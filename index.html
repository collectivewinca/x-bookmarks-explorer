ges/2016718977960120320/a3F0LOz6_normal.jpg", "likes": 1779, "retweets": 126, "replies": 89, "bookmarks": 2031, "views": 101885, "date": "2026-09-27 22:03", "url": "https://x.com/deedydas/status/2104391577091407965", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2104388989784612864/vid/avc1/1920x1080/s38S3PY8BJMpcePO.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Other"}, {"id": "2104304938801123716", "text": "I encountered authority of a different kind than I had ever encountered before, and I did not like it. and they really almost got me. they came close to really beating any curiosity out of me - Steve Jobs https://t.co/Dd7wB3iLMD", "author": "thebeautyofsaas", "authorName": "BOSS", "authorImage": "https://pbs.twimg.com/profile_images/2012506138550349824/H7NOzq7E_normal.jpg", "likes": 2219, "retweets": 243, "replies": 9, "bookmarks": 3310, "views": 133074, "date": "2026-09-27 16:19", "url": "https://x.com/thebeautyofsaas/status/2104304938801123716", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTP9uJ9WMAA76GP.jpg", "width": 816, "height": 1056}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTP9vT3WwAA25sw.jpg", "width": 816, "height": 1056}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTP9wQpWEAA3vsU.jpg", "width": 816, "height": 1056}, {"type": "photo", "url": "https://pbs.twimg.com/media/HTP9xMFWMAAy_6R.jpg", "width": 816, "height": 1056}], "category": "Other"}, {"id": "2104061777818620062", "text": "Great books on merchant banking.\n\nMerchant banking is coming back.\n\nThe next great dynasties will be built around it. https://t.co/zGdYOhzRXc", "author": "TheIcahnist", "authorName": "The Icahnist", "authorImage": "https://pbs.twimg.com/profile_images/1670268346908962818/G8meaxPG_normal.jpg", "likes": 1165, "retweets": 106, "replies": 6, "bookmarks": 1527, "views": 89039, "date": "2026-09-27 00:13", "url": "https://x.com/TheIcahnist/status/2104061777818620062", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTMhCKDXwAEuU3s.jpg", "width": 1029, "height": 1469}], "category": "Design & Code"}, {"id": "2103786760786636935", "text": "Stop telling ChatGPT \"summarize this\"\nStop telling ChatGPT \"explain this\"\nStop telling ChatGPT \"is this any good?\"\n\nThat's how you get answers that sound smart and change nothing.\n\nUse these 8 prompts instead:", "author": "free_ai_guides", "authorName": "AI Guides", "authorImage": "https://pbs.twimg.com/profile_images/1749218350767460353/YdA0hvkG_normal.jpg", "likes": 283, "retweets": 32, "replies": 6, "bookmarks": 937, "views": 50135, "date": "2026-09-26 06:00", "url": "https://x.com/free_ai_guides/status/2103786760786636935", "media": [], "category": "Other"}, {"id": "2104134014307279031", "text": "ローファイなピアノの音、細かな物音のリズムで構成されたエレクトロニカ\n\nFuzzy Memory 2026-09-27 https://t.co/bH1GTnyoyZ", "author": "atnr", "authorName": "atnr | エーティーエヌアール", "authorImage": "https://pbs.twimg.com/profile_images/1104909531274862592/HPbPRhQ5_normal.png", "likes": 213, "retweets": 21, "replies": 5, "bookmarks": 45, "views": 7298, "date": "2026-09-27 05:00", "url": "https://x.com/atnr/status/2104134014307279031", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2104128518120742912/vid/avc1/1280x720/5b0WDkmlihZHQnkX.mp4?tag=29", "width": 1280, "height": 720}], "category": "Other"}, {"id": "2104009685271814193", "text": "I don't know what I just did.\n\nI had Claude Opus 5.5 rebuild Worms Armageddon from scratch in 20 min. Destructible terrain, banana bombs, the Holy Hand Grenade etc..\n\nAll of it.\n\nWORMS 🔥 ❤️‍🔥 https://t.co/4BIqjkjbcH", "author": "emmanuel_2m", "authorName": "Emm | scenario.com", "authorImage": "https://pbs.twimg.com/profile_images/2001814557698736128/CrN0Vcl1_normal.jpg", "likes": 561, "retweets": 26, "replies": 66, "bookmarks": 223, "views": 40682, "date": "2026-09-26 20:46", "url": "https://x.com/emmanuel_2m/status/2104009685271814193", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2104009068746616834/vid/avc1/1920x1080/GRXC4vhAeUW4Ec6y.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Design & Code"}, {"id": "2102813325428216219", "text": "You can grow your intelligence https://t.co/yvsWWqVzml", "author": "CuriousMindsHub", "authorName": "Curious Minds", "authorImage": "https://pbs.twimg.com/profile_images/2026317074549587968/K2WBNNJH_normal.jpg", "likes": 8501, "retweets": 1387, "replies": 33, "bookmarks": 8281, "views": 629521, "date": "2026-09-23 13:32", "url": "https://x.com/CuriousMindsHub/status/2102813325428216219", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HS6xdrpXYAA0lbv.jpg", "width": 1700, "height": 2200}, {"type": "photo", "url": "https://pbs.twimg.com/media/HS6xdrrXEAA8mfQ.jpg", "width": 1700, "height": 2200}, {"type": "photo", "url": "https://pbs.twimg.com/media/HS6xdrlWkAAN_au.jpg", "width": 1700, "height": 2200}], "category": "Other"}, {"id": "2102775594161434965", "text": "Open the article \nCmd A\nOpen Claude Code\nCmd V\nEnter\nWin", "author": "vasuman", "authorName": "vas", "authorImage": "https://pbs.twimg.com/profile_images/2084041695088590848/jHUy-1Bq_normal.jpg", "likes": 1986, "retweets": 70, "replies": 32, "bookmarks": 4672, "views": 542361, "date": "2026-09-23 11:02", "url": "https://x.com/vasuman/status/2102775594161434965", "media": [], "category": "Other"}, {"id": "2102476527200043250", "text": "founders and marketers: you need an optimized \"about us\" page on your site\n\ni work with billion dollar tech companies and bootstrapped SaaS. The About Us is one of the first pages we optimize\n\nhere's how (8 points):\n\n(P.S. I explain why this is important at the bottom of the post)\n\nhere's how:\n\n1. start with a clear value prop sentence: \"[COMPANY] is a [CATEGORY] that [DOES XYZ] for [ICP].\"\n\n2. add your core services under a \"what [COMPANY] does\" H2 subheading. Put each service/feature/product in an H3 subheading. Write 2-3 sentences about what you do, and what outcome it produces.\n\n3. next, add a \"what makes [COMPANY] different\" H2 subheading. List about 5 core differentiators in H3 subheadings. Give specific, quantifiable differentiators and call out competitors by name. Example: [COMPANY] offers month-to-month payment terms, whereas options like [COMPETITOR] have mandated 12-month contracts. Again: 2-3 sentences per differentiator.\n\n4. your next H2 should be \"who uses [COMPANY].\" Add bullet points that call out your exact ICP segments. Example: \"B2B SaaS marketing teams at 50 to 200-employees.\"\n\n5. now add a \"the team behind [COMPANY]\" H2 subheading. Include the names of the founders, quick backstories, company origin story, team composition, and links to social pages (especially the founder(s) socials). You only need about 2 sentences per backstory/origin story.\n\n6. add a \"how [COMPANY] works\" section. Include info like communication channels, response times, who on the team customers will work with, turnaround time, and onboarding process.\n\n7. now for the most important section for AI Search: add a \"key facts\" H2. This should be an HTML <table> or <dl> (definition list) so it's crawlable. Include the following rows:\n\nCompany Name\nType\nFounded\nFounder\nHeadquarters\nWebsite\nCore Offering\nPricing\nContract Terms\nServices\nCommunication\nNotable Clients\nCustomers Served\nProjects Delivered\nCompetitors\nSocial\n\n 8. finally, add your FAQ section. Put \"frequently asked questions\" in an H2 subheading with your questions as H3s. Only 2-3 sentences per answer.\n\nHere's why this page is so important:\n1. it helps train AI to talk about your brand accurately\n2. it strengthens the E-E-A-T score of your entire domain\n3. in a world where everything seems fake, make your brand human\n\nshoot me a DM if you want a live demo of the lowest hanging fruit to rank in AI Search (tailored to your specific site)\n\ni hope this helps someone!", "author": "RobHoffman_", "authorName": "Rob Hoffman", "authorImage": "https://pbs.twimg.com/profile_images/1958537155392770048/jdJdTlg9_normal.jpg", "likes": 4931, "retweets": 190, "replies": 129, "bookmarks": 18572, "views": 1119380, "date": "2026-09-22 15:14", "url": "https://x.com/RobHoffman_/status/2102476527200043250", "media": [], "category": "Design & Code"}, {"id": "2102137061490794730", "text": "Jev (@typesafeai) is so insane & cheap for search!! \n\n> 6000+ @ycombinator Startups indexed. \n> Sub 1 second search results. \n> 90M tokens & $2.7 in total testing costs.\n\nSearch any startup in a second, in any way! \n- Color - Niche - Your Competitor - Age - Image - etc...\n\n> watch the entire video, it's so freaking cool omg!\n\n> this is the coolest thing i have ever built for fun! (worked on it for 2 days straight!)", "author": "aaayandev", "authorName": "Aayan", "authorImage": "https://pbs.twimg.com/profile_images/2069348147562680320/1DjsrLrg_normal.jpg", "likes": 1698, "retweets": 56, "replies": 84, "bookmarks": 1468, "views": 131035, "date": "2026-09-21 16:45", "url": "https://x.com/aaayandev/status/2102137061490794730", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2102131502578290688/vid/avc1/3898x2160/Ln5-k0-p62z2ULFt.mp4?tag=29", "width": 3898, "height": 2160}], "category": "Design & Code"}, {"id": "2094791148061532570", "text": "https://t.co/Fag8fBfBWv", "author": "limalemonnn", "authorName": "Lima", "authorImage": "https://pbs.twimg.com/profile_images/2083280892244455424/ldYKQT9n_normal.jpg", "likes": 935, "retweets": 180, "replies": 28, "bookmarks": 3829, "views": 3938827, "date": "2026-09-01 10:15", "url": "https://x.com/i/article/2094755208433676289", "media": [], "category": "Other"}, {"id": "2102128487612240020", "text": "this is insane. i genuinely don't understand why ambitious people aren't shown this lecture before their careers start consuming their entire lives.\n\nclayton christensen spent his career studying why successful companies collapse. in his final class, he asked students to apply the theory to themselves: if you keep allocating your time the same way, what life are you actually building?\n\nhe had already seen the answer in his own harvard mba class. everyone looked successful at the fifth reunion; by the 10th, 15th, 20th, and 25th, many were unhappy, divorced, and living far from their children.\n\nwork shows you the score immediately. close a sale, ship a product, finish a presentation, earn a promotion, get paid.\n\nan hour with your child may produce nothing you can measure today; it may take 20 years to understand what that hour built. so the next free hour goes back to work, one rational decision at a time.\n\nthis is how people build lives they never planned: through hundreds of right decisions that lead in the wrong direction, day after day.\n\nthe full 19-minute lecture is in the attached video.\n\nmoney, titles, and headcount are easy to count. christensen believed a life should be measured by the people who became better because you were there.\n\nhe died in 2020.\n\none question remains: if someone saw only where your time, energy, and attention went this year, what would they think actually mattered to you?\n\ncharlie munger described 25 psychological tendencies that influence decisions about money, work, status, and other people.\n\nread the article below and run the 25-point audit on one decision you're making now.", "author": "scientxbt", "authorName": "Scient", "authorImage": "https://pbs.twimg.com/profile_images/2100664130487111681/i9x1D-Il_normal.jpg", "likes": 553, "retweets": 106, "replies": 9, "bookmarks": 1111, "views": 97637, "date": "2026-09-21 16:11", "url": "https://x.com/scientxbt/status/2102128487612240020", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2102127647333429250/vid/avc1/1920x1080/qaigMTme_MAXAxiY.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Design & Code"}, {"id": "2102198099498135812", "text": "你是不是也在推特收藏了上千个书签，最后只存不看，\n\n开发者 Alex 用jev解决了这个痛点，\n他刚上线的这个工具 Margin, 算是真正把你的书签收藏救活了，\n\n以往尝试用传统大模型做个人书签检索, 体验几乎是灾难级的: 把几百条推文全文丢给大模型或者向量库, 每次搜一句话要在云端等上半分钟, 还要硬烧几块钱的调用费, 根本没人愿意天天用。\n而接入专做强类型决策的 Jev 之后, 整个检索逻辑彻底被掀翻了。\n\n你只要用扩展把这几年积攒的书签一键导出导入工具, 接下来直接用最口语化的人话去搜, 比如问它有哪些关于冷启动获客的实操技巧。\n\n系统完全不需要自回归逐字生成废话, 而是由底层的决策小脑以单条几十毫秒的速度在后台做并行打分。\n\n短短几秒钟之内, 上百条沉睡了几年的推文被挨个计算出匹配置信度, 界面带着进度条瞬间弹出一份按相关性精准排序的推文清单, 甚至把每条内容到底契合在哪用数字标得清清楚楚。\n\n百万 Token 只要四分钱且输出免单的机制, 让这种以往极度奢侈的遍历打分, 变成了一次只需要花几分钱的日常微小操作。\n\n真正好用的知识库从来不是逼着人类自己去建复杂的分类文件夹, 而是把检索成本压低到可以肆无忌惮地用自然语言反复提问。\n\n以前是把好内容随手扔进黑洞当个数字囤积狂, 从今天起是用毫秒级的决策神经随时把冷数据捞出来变成生产力。 https://t.co/oZnYjXhYsD", "author": "AYi_AInotes", "authorName": "AYi", "authorImage": "https://pbs.twimg.com/profile_images/1989157446829350912/pW828UwK_normal.jpg", "likes": 549, "retweets": 91, "replies": 88, "bookmarks": 894, "views": 32603, "date": "2026-09-21 20:47", "url": "https://x.com/AYi_AInotes/status/2102198099498135812", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2101673555813453825/vid/avc1/2018x1196/FHSMTmQEXcTFRVTt.mp4?tag=29", "width": 2018, "height": 1196}], "category": "Other"}, {"id": "2101721897402560826", "text": "source: https://t.co/Him22ksxa2", "author": "alexeixbt", "authorName": "alexei", "authorImage": "https://pbs.twimg.com/profile_images/2020519517382975488/X-UGPSoQ_normal.jpg", "likes": 17, "retweets": 2, "replies": 0, "bookmarks": 13, "views": 4817, "date": "2026-09-20 13:15", "url": "https://pmc.ncbi.nlm.nih.gov/articles/PMC10765015/", "media": [], "category": "Other"}, {"id": "2101979676050674161", "text": "We can measure what part of the shelf gets customer attention without any additional hardware. Just your normal CCTV cameras and a digital twin made with the phone in your pocket.\n\n@CactusXR will absolutely revolutionize how well stores can do their merchandising. https://t.co/QJceyOfRQU", "author": "broodsugar", "authorName": "Nils", "authorImage": "https://pbs.twimg.com/profile_images/1544427086173147138/iTnW7Z0y_norma
