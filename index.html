1196056, "date": "2026-08-22 04:35", "url": "https://x.com/prantare/status/2091081704114925814", "media": [], "category": "Other"}, {"id": "2091141696146788527", "text": "remember when we thought the future would bring flying cars?\n\nsomeone may have started with a more practical prototype: a four-wheeled drone that drives across the floor, then takes off and flies\n\nmaybe flying cars won’t begin as cars with wings\n\nmaybe they’ll begin as robots built to do both: drive when they can, fly when they have to…", "author": "ardchain", "authorName": "ard", "authorImage": "https://pbs.twimg.com/profile_images/2106500468234936320/-cJ4GfEh_normal.jpg", "likes": 597, "retweets": 83, "replies": 29, "bookmarks": 214, "views": 24474, "date": "2026-08-22 08:33", "url": "https://x.com/ardchain/status/2091141696146788527", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091141653633368064/vid/avc1/714x950/v1HUK5LStLtcrKz3.mp4?tag=29", "width": 714, "height": 950}], "category": "Design & Code"}, {"id": "2090832898488459699", "text": "a=(m,d=mag(k=9*cos(i*5)*sin(i),e=cos(i*3)*cos(i*2)*9)**3/1999+1.5-sin(t/2+m)**3/3)=&gt;point(99*sin(c=d/16-t/48+m)+k*(p=d**sin(d*d-t+m))+200,99*sin(c*4)+e*p+200)\nt=0,draw=$=&gt;{t||createCanvas(w=400,w);background(9).stroke(w,96);for(t+=PI/20,i=1e4;i--;)a(i%16*13)}//#つぶやきProcessing https://t.co/Y4svUrgAo5", "author": "yuruyurau", "authorName": "ア", "authorImage": "https://pbs.twimg.com/profile_images/378800000771146453/3ce1d7f804d141445ac11cf637f6e549_normal.png", "likes": 5290, "retweets": 586, "replies": 63, "bookmarks": 2469, "views": 412829, "date": "2026-08-21 12:06", "url": "https://x.com/yuruyurau/status/2090832898488459699", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2090832812081577984/vid/avc1/800x800/RSi75MMmVwPWbrE5.mp4?tag=29", "width": 800, "height": 800}], "category": "Other"}, {"id": "2090615221744525581", "text": "Introducing 3AGameFactory: https://t.co/IvoH32fbUG — a skill and reference code framework designed for 3A game development. It covers image, 3D asset, motion, audio, and CG generation tools, along with reference code for UE5, Blender, Unity3D, and three.js. We welcome your stars! https://t.co/DUPCnfitQQ", "author": "bohan_zeng", "authorName": "Bohan Zeng", "authorImage": "https://pbs.twimg.com/profile_images/1794930763718328320/vsapmaVG_normal.jpg", "likes": 168, "retweets": 29, "replies": 1, "bookmarks": 231, "views": 9793, "date": "2026-08-20 21:41", "url": "https://github.com/OpenDCAI/GameFactory-3A", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2090613491539623936/vid/avc1/1280x720/9faor-0DfQkrhVPw.mp4?tag=14", "width": 1920, "height": 1080}], "category": "Other"}, {"id": "2090695742352769362", "text": "#M5StackNew 🎉 PaperMono & PaperMono-Lite Released\nPaperMono is an e-paper development board designed for low-power display, near-field identification, and long-range communication applications. PaperMono-Lite is a streamlined version of PaperMono.\n✨Features\n✅ESP32-S3R8 core controller, 16MB Flash, 8MB PSRAM, 2.4 GHz Wi-Fi\n✅3.97-inch 4-level grayscale black-and-white e-paper display with touch support\n✅Integrated front-light system, RGB LED & built-in 1150mAh battery\n✅PDM microphone (LMD4737T261-AC02) & built-in buzzer\n✅BMI270 6-axis IMU, M5IOE1 IO expander, microSD card slot, RX8130CE RTC\n✅NFC functionality & LoRa communication supporting 868MHz ~ 923MHz (PaperMono Only)\n🛒 Get Yours:\nOfficial Store:\nPaperMono:https://t.co/wK64S7ANL0\nPaperMono-Lite: https://t.co/ClOjdpN36q\nAliExpress: https://t.co/GhFPvB4veS\n#M5Stack #PaperMono #EInk #Dashboard #LowPower #IoT #Maker #NFC #LoRa", "author": "M5Stack", "authorName": "M5Stack", "authorImage": "https://pbs.twimg.com/profile_images/1491659573413183489/WagC2sQk_normal.png", "likes": 311, "retweets": 34, "replies": 31, "bookmarks": 210, "views": 58374, "date": "2026-08-21 03:01", "url": "https://x.com/M5Stack/status/2090695742352769362", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2090695555882389505/vid/avc1/1920x1080/CJWpzmCLLB6TIn02.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Design & Code"}, {"id": "2090675707739541709", "text": "Snoopy Live Wallpaper! 🐶 https://t.co/9UdTzcZh2Z", "author": "aestheticsguyz", "authorName": "Aesthetics Walls 𝕏", "authorImage": "https://pbs.twimg.com/profile_images/2117264520435609600/qYo1eGIv_normal.jpg", "likes": 7008, "retweets": 436, "replies": 63, "bookmarks": 4247, "views": 1277921, "date": "2026-08-21 01:41", "url": "https://x.com/aestheticsguyz/status/2090675707739541709", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2090675627032797184/vid/avc1/1200x1600/SMICi4mt6zdL65sB.mp4?tag=29", "width": 1200, "height": 1600}, {"type": "video", "url": "https://video.twimg.com/amplify_video/2090675669881753600/vid/avc1/720x1280/-k3txd13iqlvS6YP.mp4?tag=29", "width": 720, "height": 1280}], "category": "Other"}, {"id": "2090773519571484996", "text": "Hy Agent Harness For Video Generation.", "author": "TencentHunyuan", "authorName": "Tencent Hy", "authorImage": "https://pbs.twimg.com/profile_images/1810934469769195520/kKSVenHW_normal.jpg", "likes": 298, "retweets": 21, "replies": 5, "bookmarks": 160, "views": 34984, "date": "2026-08-21 08:10", "url": "https://x.com/TencentHunyuan/status/2090773519571484996", "media": [], "category": "Other"}, {"id": "2090473484426313862", "text": "Elon Musk explains his 5-step algorithm for solving any problem:\n\n\"The most common mistake of smart engineers is to optimize a thing that should not exist.\"\n\n\"I have this very basic first principles algorithm that I run as a mantra.\"\n\nElon breaks it down:\n\nStep 1: Question the requirements.\n\n\"Make the requirements less dumb. The requirements are always dumb to some degree, no matter how smart the person who gave you those requirements. You have to start there, because otherwise you could get the perfect answer to the wrong question.\"\n\nStep 2: Try to delete it.\n\n\"Try to delete the part or the process step entirely. If you're not forced to put back at least 10% of what you delete, you're not deleting enough. Most people feel like they've succeeded if they haven't been forced to put things back in. But actually they haven't, they've been overly conservative and left things in that shouldn't be there.\"\n\nStep 3: Optimize or simplify.\n\n\"The most common mistake of smart engineers is to optimize a thing that should not exist. So you don't optimize until after you've tried to delete.\"\n\nStep 4: Speed it up.\n\n\"Any given thing can be done faster than you think. But you shouldn't speed things up until you've tried to delete it and optimize it otherwise, you're speeding up something that shouldn't exist.\"\n\nStep 5: Automate.\n\n\"And then the fifth thing is to automate it.\"\n\nElon explains why the order matters:\n\n\"I've gone backwards so many times where I've automated something, sped it up, simplified it, and then deleted it. I got tired of doing that. So that's why I have this mantra.\"", "author": "jaynitx", "authorName": "Jaynit", "authorImage": "https://pbs.twimg.com/profile_images/1871881199372914688/FKDqACyE_normal.jpg", "likes": 2316, "retweets": 445, "replies": 72, "bookmarks": 3740, "views": 387004, "date": "2026-08-20 12:18", "url": "https://x.com/jaynitx/status/2090473484426313862", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2090473373809913856/vid/avc1/1280x720/IN8ebKRIQrYOJSUp.mp4?tag=14", "width": 1280, "height": 720}], "category": "Design & Code"}, {"id": "2090434201179074614", "text": "I made a SSH Server which lets you fully remote desktop into another PC with SSH, directly in your terminal! \n\nhttps://t.co/j5jEx5ck4g https://t.co/UUsOyfxpkK", "author": "DarthKermi72747", "authorName": "Rylen Anil", "authorImage": "https://pbs.twimg.com/profile_images/2060624873471508480/L6zcP0VU_normal.jpg", "likes": 1476, "retweets": 143, "replies": 36, "bookmarks": 1335, "views": 143548, "date": "2026-08-20 09:42", "url": "https://github.com/rylena/sshdesk", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2090434135022350336/vid/avc1/1280x720/cKaWhYpUZsRvEpe6.mp4?tag=14", "width": 1920, "height": 1080}], "category": "Terminals"}, {"id": "2090752650136482017", "text": "First 3d vivecoded game!\n\ncurling is just the best sport so why not mix it with power ups and ball effects\n\ntry it! 👇🏻 https://t.co/ndVceueR75", "author": "albertobeicas", "authorName": "Alberto BZ", "authorImage": "https://pbs.twimg.com/profile_images/2089255767954108416/bmLODl5t_normal.jpg", "likes": 27, "retweets": 2, "replies": 4, "bookmarks": 10, "views": 2599, "date": "2026-08-21 06:47", "url": "https://x.com/albertobeicas/status/2090752650136482017", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2090752102549106688/vid/avc1/3000x1700/q-EQHumZeRSdkNjr.mp4?tag=29", "width": 3000, "height": 1700}], "category": "Other"}, {"id": "2090106932916883750", "text": "I've been tinkering with an AI to increase my “luck surface area” (basically, to find interesting opportunities that exist across my entire network) and the results are ... pretty interesting. \n\nBuilt on my corpus of personal & professional data - everyone I’ve met with, emailed, talked to, thousands of call notes, LinkedIn connections, emails, Slacks etc. Plus it does its own desk research on my contacts overnight (did that by itself without being asked, weirdly).\n\nExample - it suggested I introduce Marco (an insurtech founder, hiring for multiple roles) to Ben (an insurance headhunter I really rate). It pieced that together through a combo of Granola transcripts, emails, LinkedIn messages, and internal Slack messages.\n\nPowered by a social graph algorithm that scores relationships and potential intros - based on things like relationship strength, recency, communication style, and “likely-mutual-value”, etc. \n\nI left it running overnight, and it: \n>  found people who have helped me with intros & advice, but where that help hasn't been reciprocated by me - then it suggested actions I could take to repay the favours\n> remembered that a colleague described her ideal mentor to me in a meeting *a year ago* - found someone in my network with the exact right experience, and drafted an intro\n> surfaced a bunch of insights about my own life - like a drop-off in social & fitness activity since becoming a dad(!) - and set up a local run club on WhatsApp\n\nThe suggestions are… surprisingly good! And devoid of the usual AI slop. \n\nI talk a lot about luck surface area - putting yourself in situations where good things tend to magically happen. This is the first time I’ve built something that actually tries to increase that surface area for me and my network.\n\nI’m quite encouraged by the results, and it was surprisingly easy to build (with @claudeai, of course). Happy to share how for anyone who is interested in building their own.\n\n@bcherny", "author": "edleonklinger", "authorName": "Ed Leon Klinger", "authorImage": "https://pbs.twimg.com/profile_images/1871621683368321024/lZ3yebfW_normal.jpg", "likes": 5545, "retweets": 253, "replies": 505, "bookmarks": 8531, "views": 703941, "date": "2026-08-19 12:01", "url": "https://x.com/edleonklinger/status/2090106932916883750", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQGMz-UXUAA5uZb.jpg", "width": 2434, "height": 1502}], "category": "Design & Code"}, {"id": "2090313146183688433", "text": "Grok Bot can recreate any viral video from the link 🤯\n\nHow it works: I send @bot a link to an AI clip.\n\nIt watches the video and writes a prompt to recreate it (with any changes I want).\n\nThen it uses @imagine to generate the new video! I tried it on the subway trend 👇 https://t.co/PKzeu0VoeX", "author": "venturetwins", "authorName": "Justine Moore", "authorImage": "https://pbs.twimg.com/profile_images/2080756230893838336/q4VqZuw2_normal.jpg", "likes": 1354, "retweets": 162, "replies": 110, "bookmarks": 824, "views": 962630, "date": "2026-08-20 01:41", "url": "https://x.com/venturetwins/status/2090313146183688433", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2090313040319434753/vid/avc1/998x1846/XW6ySXm6ask0rhLO.mp4?tag=29", "width": 998, "height": 1846}], "category": "Other"}, {"id": "2090141233796816902", "text": "Till date, I’ve received 3 acquisition offers for https://t.co/hJPBhtaugS, and their only motive behind all of them was to monetize it. I know the potential this product has, and I swear I’m never going to charge people just to use it. PRIVACY SHOULD BE FREE, NOT A LUXURY.", "author": "pranvtwt", "authorName": "Pranav Mailarpawar", "authorImage": "https://pbs.twimg.com/profile_images/2060422352459214848/zd_aUtMu_normal.jpg", "likes": 2266, "retweets": 133, "replies": 72, "bookmarks": 1417, "views": 475264, "date": "2026-08-19 14:17", "url": "https://ihatepdf.cv", "media": [], "category": "Design & Code"}, {"id": "2090256520403370357", "text": "https://t.co/ViRJ7Nlbbk is now available.\n\nPiCarrier lets YOU design a Raspberry Pi compute module carrier, gives an INSTANT quote, and has a REAL ENGINEER design your carrier (as soon as you pay)\n\nWe can also source the modules for you, as well as cables. https://t.co/WUxWPBz7ci", "author": "i2cjak", "authorName": "i²cjak", "authorImage": "https://pbs.twimg.com/profile_images/2081495989555277824/eThpRVaa_normal.jpg", "likes": 214, "retweets": 22, "replies": 14, "bookmarks": 116, "views": 15309, "date": "2026-08-19 21:56", "url": "https://PiCarrier.com", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQINV4OW8AAN8Is.png", "width": 797, "height": 839}], "category": "Design & Code"}, {"id": "2090329801030820194", "text": "Am I the first person who tweeted ESP-Mosaico on X?@EspressifSystem https://t.co/ZKkJeV4Nnb", "author": "henry19840301", "authorName": "Henry Li", "authorImage": "https://pbs.twimg.com/profile_images/1781096965524373504/8_xqudLe_normal.jpg", "likes": 1118, "retweets": 85, "replies": 37, "bookmarks": 924, "views": 199520, "date": "2026-08-20 02:47", "url": "https://x.com/henry19840301/status/2090329801030820194", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2090328835841740801/vid/avc1/2160x3840/4RkGX-0RdkTWGt6K.mp4?tag=29", "width": 2160, "height": 3840}], "category": "Other"}, {"id": "2090166976056299990", "text": "Most founders copy/paste their privacy policy from Stripe or ask Claude to draft an MSA at 2:00 AM, then pray they don't get sued. \n\nYou can stop doing this. \n\nWe built a free, CC0-licensed legal template library for startups:\n-MSAs\n-Employment agreements\n-Privacy policies\n-More...\n\nAnd because many of you on here asked, here is an agent-friendly link to where these are posted on GitHub:\nhttps://t.co/GF62d39zHo", "author": "rwalk_xyz", "authorName": "Ryan Walker", "authorImage": "https://pbs.twimg.com/profile_images/2091522939183083520/s9Nacop7_normal.jpg", "likes": 4942, "retweets": 336, "replies": 108, "bookmarks": 11851, "views": 717076, "date": "2026-08-19 16:00", "url": "https://x.com/rwalk_xyz/status/2090166976056299990", "media": [], "category": "Design & Code"}, {"id": "2090175239950946348", "text": "@0xSero 33k sessions of file paths, project layouts, and pasted credentials, condensed into the exact file every future agent opens first. the skills file is the leak target", "author": "thebasedcapital", "authorName": "basedcapital", "authorImage": "https://pbs.twimg.com/profile_images/2038276727496142848/2x4dxfVC_normal.jpg", "likes": 0, "retweets": 0, "replies": 0, "bookmarks": 1, "views": 512, "date": "2026-08-19 16:33", "url": "https://x.com/thebasedcapital/status/2090175239950946348", "media": [], "category": "Other"}, {"id": "2090170768168542485", "text": "Every session you’ve ever had with an agent is valuable. \n\nIt is full of things to teach your agents via skills, it also allows you to figure out what is setting you back\n\nI’ve been processing 2 billion tokens of past sessions, 33K sessions\n\nhttps://t.co/SBAXDCr95m\n\nGet it done https://t.co/cLaiFzW87B", "author": "0xSero", "authorName": "0xSero", "authorImage": "https://pbs.twimg.com/profile_images/2111226379521892352/3ICUbYY6_normal.jpg", "likes": 215, "retweets": 8, "replies": 16, "bookmarks": 248, "views": 14777, "date": "2026-08-19 16:15", "url": "https://github.com/0xSero/ai-data-extraction/blob/main/README.md", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQHHPBeWMAA6D6i.jpg", "width": 945, "height": 2048}], "category": "Other"}, {"id": "2089908699230061040", "text": "This guy literally explained why some people become successful while other stay average. \n\nThe reason is uncomfortable. Game Theory\n\nWatch this: https://t.co/gQiK96Ue5g", "author": "Dhruvkumar16797", "authorName": "Dhruv kumar", "authorImage": "https://pbs.twimg.com/profile_images/2035601746878406656/bSUc2FIG_normal.jpg", "likes": 22533, "retweets": 4598, "replies": 195, "bookmarks": 32820, "views": 1986084, "date": "2026-08-18 22:53", "url": "https://x.com/Dhruvkumar16797/status/2089908699230061040", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2089908415682445312/vid/avc1/640x360/_z0nBIf3yQjYchIQ.mp4?tag=29", "width": 640, "height": 360}], "category": "Other"}, {"id": "2090000818762297452", "text": "Sell me your app in 2 words.", "author": "lightsilver323", "authorName": "Light Silver", "authorImage": "https://pbs.twimg.com/profile_images/2069538249320833024/7sAbdUi2_normal.jpg", "likes": 172, "retweets": 8, "replies": 532, "bookmarks": 32, "views": 37448, "date": "2026-08-19 05:00", "url": "https://x.com/lightsilver323/status/2090000818762297452", "media": [], "category": "Other"}, {"id": "2089910117940724007", "text": "Happiness is simple ✨\nThe world is so beautiful it would be a shame to miss it https://t.co/pyXyfqDTkc", "author": "Jalanparis_", "authorName": "Papi ✨", "authorImage": "https://pbs.twimg.com/profile_images/2109994203929624576/uKOL_lSt_normal.jpg", "likes": 46710, "retweets": 5219, "replies": 1512, "bookmarks": 3145, "views": 4075998, "date": "2026-08-18 22:59", "url": "https://x.com/Jalanparis_/status/2089910117940724007", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2089910091336298496/vid/avc1/478x850/X-bSogVdqTFPTuWA.mp4?tag=29", "width": 478, "height": 850}], "category": "Other"}, {"id": "2089804318144594199", "text": "This display is so cool https://t.co/BcrrRxelY0", "author": "trunarla", "authorName": "˗ˏˋmewtru´ˎ˗", "authorImage": "https://pbs.twimg.com/profile_images/1725379894367125504/CFJbkQoi_normal.jpg", "likes": 1027, "retweets": 68, "replies": 7, "bookmarks": 454, "views": 31657, "date": "2026-08-18 15:59", "url": "https://x.com/trunarla/status/2089804318144594199", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2089804093623562240/vid/avc1/2160x3840/sBDVdfLyDVm1SKMs.mp4?tag=29", "width": 2160, "height": 3840}], "category": "Other"}, {"id": "2089740376718610518", "text": "call me crazy but the first AI agent most companies should build is an autonomous analyst.\n\nyou can build one using Kimi K3.\n\nit watches your competitors while you sleep, remembers every move, and wakes your team with the launches, pricing changes, and positioning shifts they need to act on.\n\ndon't bookmark this if it crosses your timeline.\n\npaste the full article into Kimi and tell it to build the first version for your market.", "author": "VibeMarketer_", "authorName": "J.B.", "authorImage": "https://pbs.twimg.com/profile_images/1950293861793677312/ldQniJt5_normal.jpg", "likes": 4682, "retweets": 636, "replies": 127, "bookmarks": 9272, "views": 1088894, "date": "2026-08-18 11:45", "url": "https://x.com/VibeMarketer_/status/2089740376718610518", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2089740357752012800/vid/avc1/720x900/MJGFW1oF14XoamFR.mp4?tag=14", "width": 720, "height": 900}], "category": "Design & Code"}, {"id": "2090000122516254993", "text": "Building hardware is hard enough and now i have to find the right vendors too?\n\nThat’s why i built The Hardware Story: verified vendors in one place.\n\nhttps://t.co/4EB86OhSAS\n\npcb, cnc, prototypes, weird components, all of it.\n\nIf there’s a vendor you’ve worked with and can vouch for, drop them below pls 🙏\n\ncuz this stuff is hard(ware).", "author": "Otodidakt_20", "authorName": "Anishi", "authorImage": "https://pbs.twimg.com/profile_images/2016951609033732096/Ro-EKAfc_normal.jpg", "likes": 304, "retweets": 41, "replies": 48, "bookmarks": 242, "views": 15750, "date": "2026-08-19 04:57", "url": "https://www.thehardwarestory.com/", "media": [], "category": "Design & Code"}, {"id": "2089532183455084569", "text": "PRO TIP\n\nSetup an Autoresearcher to go through your sessions traces and build you skills from them for patterns and repeated behaviors\n\nYou're welcome", "author": "TheAhmadOsman", "authorName": "Ahmad", "authorImage": "https://pbs.twimg.com/profile_images/1831406651829559296/iMbSOxdP_normal.jpg", "likes": 2572, "retweets": 106, "replies": 71, "bookmarks": 2752, "views": 149854, "date": "2026-08-17 21:57", "url": "https://x.com/TheAhmadOsman/status/2089532183455084569", "media": [], "category": "Design & Code"}, {"id": "2089728564669067644", "text": "🚀 Introducing COMET Air Mouse 🖱️\n\nI’ve been working on a compact wireless air mouse built around the ESP32-C3 + MPU6050.\n\nInstead of moving a traditional mouse across a desk, COMET converts hand movements into real-time Bluetooth HID mouse controls.\n\n🔹 ESP32-C3\n🔹 MPU6050 gyroscope\n🔹 BLE HID\n🔹 Motion-controlled cursor\n🔹 Left / right click\n🔹 Gesture-based scrolling\n🔹 Adjustable sensitivity & smoothing\n🔹 Battery-powered design\n\nThe firmware is now packaged as a ready-to-flash .bin release, making it possible to deploy the device without setting up the Arduino IDE or installing the required libraries.\n\nThis project has been a great hands-on experience in embedded systems, Bluetooth HID, sensor processing, firmware development, and power management.\n\nAnd this is just V1.0. 🚀\n\n🔥 Top 6 ESP32 eBooks \nhttps://t.co/MvafQvkQbk\n\n#COMET #AirMouse #ESP32 #ESP32C3 #MPU6050 #Bluetooth #BLE #EmbeddedSystems #IoT #Electronics #Hardware #Arduino #Engineering #Maker", "author": "ebokify", "authorName": "Ebokify", "authorImage": "https://pbs.twimg.com/profile_images/1956373622588612609/i7lwvj3m_normal.jpg", "likes": 810, "retweets": 101, "replies": 16, "bookmarks": 505, "views": 29290, "date": "2026-08-18 10:58", "url": "https://x.com/ebokify/status/2089728564669067644", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2089728507773435904/vid/avc1/640x1138/NcC1o-OXQ8TcZe_B.mp4?tag=29", "width": 640, "height": 1138}], "category": "Design & Code"}, {"id": "2089774331916149090", "text": "you can remix every competitor's entire website in a weekend now with an seo agent\n\nhere's the build:\n\npull your 10 closest competitors\n\ngrab every sitemap\n\ncomposite database of every page they've ever published\n\ncluster it into topics, not keywords. you're mapping their content architecture\n\ndataforseo api to see what's actually ranking page one vs what's just sitting there dead\n\ncontent gap analysis: what everyone covers is table stakes and what nobody is covering is your wedge\n\nnow the part everyone skips \n\nrecord 30 minutes of you ranting about your industry. transcribe it. feed it in as source material\n\nadd your own data. product numbers, customer benchmarks, anything with a real stat in it\n\nwrite the articles, the landing pages, the vs pages, the alternatives pages, the glossary\n\nbuild the internal link graph on the way out, hub → cluster, nothing orphaned\n\npublish all of it in one shot\n\nthen monthly you refresh off search console decay + a fresh gap analysis. rewrite what's slipping, kill what's dead, expand what's getting impressions but no clicks.\n\ntwo things worth knowing:\n\nthe vs and alternatives pages are the highest ROI slice of the whole build. \n\nbottom funnel, your competitors won't write them honestly, and they're exactly what people type into chatgpt.\n\nand ranking and getting cited are different jobs. ranking is depth and links. \n\ngetting cited is structure\n\ndirect answer up top, definition blocks, comparison tables, h2s that match the actual question\n\nan llm is not reading your 400 word intro\n\nthe agent gets you parity. everyone's going to have this in 6 months\n\nthe 30 minute rant and your proprietary data are the only inputs that can't be scraped back out of you\n\nthat's the moat now", "author": "codyschneider", "authorName": "Cody Schneider", "authorImage": "https://pbs.twimg.com/profile_images/1642293767846924288/SYK9ccXU_normal.jpg", "likes": 275, "retweets": 9, "replies": 24, "bookmarks": 583, "views": 16863, "date": "2026-08-18 14:00", "url": "https://x.com/codyschneider/status/2089774331916149090", "media": [], "category": "Design & Code"}, {"id": "2089485374431412706", "text": "if you are using @bot or a VPS hosted agent that gets blocked from using websites, connect it to a home device (always on desktop is best) via @Tailscale and turn on these 2 settings\n\nbonus: your bots can now print your morning briefing to your home printer while being hosted in a data center across the country", "author": "theaaron", "authorName": "Aaron Makelky", "authorImage": "https://pbs.twimg.com/profile_images/2022167018670362624/kRFnZOjo_normal.jpg", "likes": 167, "retweets": 5, "replies": 18, "bookmarks": 258, "views": 17285, "date": "2026-08-17 18:51", "url": "https://x.com/theaaron/status/2089485374431412706", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HP9WHiEWUAAZfA1.png", "width": 740, "height": 728}, {"type": "photo", "url": "https://pbs.twimg.com/media/HP9Xwlha4AAjK1E.jpg", "width": 3134, "height": 4096}], "category": "Other"}, {"id": "2089698836562186712", "text": "kimi K3 openrouter, your search console data, google analytics data, and data for SEO API key the most powerful agentic marketing stack\n\nhow it works\n\npipeline pulls the data on a schedule.\n\nwarehouse holds it and does the joins.\n\nagent queries the warehouse. that's the only thing it touches.\n\nthe agent never calls an api for bulk data. ever. that's the whole trick.\n\nthe pipeline\n\nthree extractors on a daily cron.\n\ngsc → searchanalytics.query, dimensions [date, page, query, device], rowLimit 25000, paginate on startRow. backfill 16 months once. data lags 3 days so always re-pull the last 7.\n\nga4 → runReport, dimension landingPagePlusQueryString, metrics sessions + keyEvents + revenue.\n\ndataforseo → not on the cron. on demand only, cached 14 days. serp calls are the recurring bill.\n\nevery row passes through one url normalizer on the way in. lowercase, drop protocol, drop www, drop params, drop trailing slash. this is the load-bearing function in the entire system. skip it and gsc never joins ga4 and the agent confidently reports numbers that don't exist.\n\nthe warehouse\n\npostgres is fine. duckdb is fine. clickhouse if you're doing this for 50 clients.\n\nthree tables:\n\ngsc_daily (date, url_clean, query, clicks, impressions, position, device)\n\nga4_daily (date, url_clean, sessions, conversions, revenue)\n\nserp_snapshots (fetched_at, query, position, competitor_url, has_ai_overview)\n\none view on top that joins all three on url_clean. the agent only ever sees the view.\n\nupsert on natural keys so re-pulls are idempotent. you'll re-pull constantly.\n\nthe agent\n\ntwo tools. not four apis.\n\nrun_sql — read only role, schema in the system prompt, 500 row cap\n\nfetch_serp — one keyword, live endpoint, writes back to serp_snapshots\n\nopenrouter: moonshotai/kimi-k3, routing exacto. without exacto you get routed across providers on different quants and tool calls fail at random.\n\nfirst job. ship this one only.\n\nmonday 6am:\n\nfrom the joined view, pull pages ranking 5-20 with 500+ impressions and below-average ctr for their position. fetch serps for the top 10. tell me who's above us and whether an ai overview is present. flag anything with zero conversions in 90 days. post to slack.\n\nthen add one per week\n\ndecay — clicks down 25% mom by url → serp fetch → competitor or layout change\n\ncannibalization — one query, 2+ urls, split impressions\n\ninternal links — urls with impressions and no inbound links\n\nrules\n\naggregate in sql, not in context. 1m context is a cost trap, not a feature.\n\noutput goes to slack or a ticket. never a chat window.\n\nlog every query the agent writes. that's your eval set.\n\nthe model is the least differentiated part. the pipeline and the joins are the whole product.", "author": "codyschneider", "authorName": "Cody Schneider", "authorImage": "https://pbs.twimg.com/profile_images/1642293767846924288/SYK9ccXU_normal.jpg", "likes": 87, "retweets": 4, "replies": 19, "bookmarks": 156, "views": 7838, "date": "2026-08-18 09:00", "url": "https://x.com/codyschneider/status/2089698836562186712", "media": [], "category": "Other"}, {"id": "2089580618191659488", "text": "Agent discovers.\nAgent applies.\n\nAll credit goes to https://t.co/6lCb9239Sa https://t.co/aOsSDOhNX2", "author": "vaibhavhome", "authorName": "Vaibhav Arora", "authorImage": "https://pbs.twimg.com/profile_images/2069762586808070144/D-5bwIfA_normal.jpg", "likes": 2499, "retweets": 147, "replies": 95, "bookmarks": 6513, "views": 509085, "date": "2026-08-18 01:10", "url": "https://www.npmjs.com/package/job-application-agent", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HP-uZyObIAAU6LB.jpg", "width": 720, "height": 720}], "category": "Other"}, {"id": "2089455844853227966", "text": "For a while, I wanted a proper inbox on my own domain without adding another monthly mailbox subscription.\n\nSo I built QuickMail.\n\nIt’s a complete open-source mail client that runs inside your own Cloudflare account. You can send and receive real email as you@yourdomain.com, with threaded conversations, attachments, drafts, delivery tracking, multiple domains, and separate user accounts.\n\nUnder the hood, it’s one @Cloudflare Worker, D1 for mail data, R2 for attachments, and @resend for sending and receiving.\n\nThere’s no QuickMail server sitting between you and your email. You deploy it, you control the database, and you own the code.\n\nThe project includes the entire working interface, an onboarding wizard, database migrations, webhook handling, and setup documentation. You can usually get it running in about 30 minutes, with most of that time spent waiting for DNS.\n\nQuickMail v1.0 is now live. It’s free, open source, and MIT licensed.", "author": "divinprnc", "authorName": "Divin Prince", "authorImage": "https://pbs.twimg.com/profile_images/2074443406672044032/ZcwMLlnz_normal.jpg", "likes": 840, "retweets": 46, "replies": 87, "bookmarks": 1094, "views": 152678, "date": "2026-08-17 16:54", "url": "https://x.com/divinprnc/status/2089455844853227966", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2089455618482442240/vid/avc1/1920x1080/0JhUVQgZjam3qGvO.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Design & Code"}, {"id": "2089201744479936525", "text": "지도를 작품처럼 그려주는 오픈소스를 찾음!!\n우리 동네를  감성 있는 지도 포스터로 만들어 줌\n\n장소명이나 지도 스크린샷만 있으면 끝,\n도로, 건물, 공원, 물길까지 예쁘게 표현해줌\n\n단순히 AI로 만든 지도보다 이런 감성이 훨씬 잘 먹히죠\n콘텐츠 만드는 사람이라면 일단 꼭 공유 & 북마크!\n\nhttps://t.co/08V1CZ41QD\n\n제작자: marceloprates", "author": "magic_ai_skill", "authorName": "MagicAI", "authorImage": "https://pbs.twimg.com/profile_images/2085226725152268289/nL6EJ_Q4_normal.jpg", "likes": 2444, "retweets": 326, "replies": 27, "bookmarks": 3118, "views": 116519, "date": "2026-08-17 00:04", "url": "https://x.com/magic_ai_skill/status/2089201744479936525", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HP5UIjObIAARyTL.jpg", "width": 4096, "height": 2400}], "category": "Other"}, {"id": "2089279653794242783", "text": "Up to 1 BILLION FREE TOKENS on OrcaRouter😳\n\nmilk these 3 free models right now:\n- Qwen3.8 27B\n- DeepSeek V4 Pro\n- DeepSeek V4 Flash\n\nnot sure if there is a limit, so make the most of it while it is free\n\ncheck it out: https://t.co/u4EACvbwWt https://t.co/a97swNq2om", "author": "nahid_pro09", "authorName": "Nahid", "authorImage": "https://pbs.twimg.com/profile_images/2063179218645925888/I0wq1ZYN_normal.jpg", "likes": 47, "retweets": 4, "replies": 9, "bookmarks": 40, "views": 6755, "date": "2026-08-17 05:14", "url": "https://orcarouter.ai/models?price=free", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HP6cqijaIAAtS8U.jpg", "width": 1189, "height": 415}], "category": "Other"}, {"id": "2089345500314996812", "text": "The open-source library of \"404 animations\" now includes 42 free animated components to make your 404 page stand out.\n\nhttps://t.co/nvR6DwqcHy https://t.co/UhpSHhyERN", "author": "csaba_kissi", "authorName": "Csaba Kissi", "authorImage": "https://pbs.twimg.com/profile_images/1454861068233228289/6sn9BYOf_normal.jpg", "likes": 156, "retweets": 19, "replies": 11, "bookmarks": 129, "views": 8885, "date": "2026-08-17 09:36", "url": "https://404.colorion.co", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2089345241639772161/vid/avc1/1920x1080/Rrnm6LD0K8Pp9XxZ.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Other"}, {"id": "2089337139368497237", "text": "make for free, own for $1 \n\nhttps://t.co/oSkJElgcx3 https://t.co/pHNokXiPNM", "author": "jackbutcher", "authorName": "@jackbutcher", "authorImage": "https://pbs.twimg.com/profile_images/2094875295740243968/XWoHVEOq_normal.png", "likes": 563, "retweets": 31, "replies": 49, "bookmarks": 360, "views": 61959, "date": "2026-08-17 09:02", "url": "https://jack.art/kyc/create", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2089336779102896128/vid/avc1/1920x1080/LI7l2wK3UE5-kF0q.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Other"}, {"id": "2089219432522678679", "text": "A Walkable ASCII Cyberpunk City in One HTML File\nby a creator named Grow Now! Games. \n\nThis is really cool, especially in a SINGLE html file. https://t.co/TK2hLHT8Db", "author": "Smallzero", "authorName": "smallzero", "authorImage": "https://pbs.twimg.com/profile_images/2081211627932708864/ClF-SPFR_normal.jpg", "likes": 72, "retweets": 5, "replies": 4, "bookmarks": 31, "views": 3264, "date": "2026-08-17 01:15", "url": "https://x.com/Smallzero/status/2089219432522678679", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2089219296954376193/vid/avc1/1920x1080/2xzTWfhsJyFL0384.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Design & Code"}, {"id": "2088870251069129189", "text": "We teach kids things that have no connection to the world around them and wonder why they’re not engaged.\n\nSo I made this list of books covering 18 core pillars of “boring” infrastructure modern society is built on.\n\nThere are cathedrals everywhere for those with eyes to see. https://t.co/Rh90b98yWK", "author": "deedydas", "authorName": "Deedy", "authorImage": "https://pbs.twimg.com/profile_images/2016718977960120320/a3F0LOz6_normal.jpg", "likes": 4064, "retweets": 390, "replies": 95, "bookmarks": 6697, "views": 239387, "date": "2026-08-16 02:07", "url": "https://x.com/deedydas/status/2088870251069129189", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HP0obHTakAE9-r_.jpg", "width": 1193, "height": 2095}], "category": "Design & Code"}, {"id": "2089328925822607551", "text": "A friend is looking at buying a new car. I suggested he consider an EV.\n\nHis response?\n\n“No. I can’t claim petrol allowance from my company.”\n\nAnd this, in a nutshell, is why EV adoption isn’t just about the technology. 😄\n\nSometimes, the biggest barrier is the incentive structure.", "author": "prakashadvani", "authorName": "Prakash Advani", "authorImage": "https://pbs.twimg.com/profile_images/923793256869117952/Jll4D0l__normal.jpg", "likes": 41, "retweets": 14, "replies": 11, "bookmarks": 5, "views": 5200, "date": "2026-08-17 08:30", "url": "https://x.com/prakashadvani/status/2089328925822607551", "media": [], "category": "Other"}, {"id": "2088900801489928637", "text": "DeepSeek just killed the coding-agent industry.\n\ndeepseek-harness: Open-source. Free. Claude Code's top plan costs $200/month.\n\nWhat it does:\n\n→ Everything is a plugin - model adapters, tools, session logs, even the agent loop itself, all swappable from config\n→ Built on Cordis, DeepSeek's own plugin runtime\n→ One command to run: npx @deepseek-ai/dsh web - spins up a local Web UI\n→ Ships with real architecture docs + an AGENTS.md written for agents to read the codebase themselves\n→ TypeScript, MIT, developer preview - breaking changes expected, DeepSeek says so themselves\nWhat it replaces:\n→ Anthropic's Claude Code\n→ Closed, single-vendor coding-agent environments generally\n\nA frontier lab just gave away, for free, the exact layer companies charge a subscription for.\n\n→ https://t.co/b4EzZ8NwT5", "author": "ArchiveExplorer", "authorName": "Archive", "authorImage": "https://pbs.twimg.com/profile_images/2086925069217841152/bbR9tdhJ_normal.jpg", "likes": 2401, "retweets": 324, "replies": 83, "bookmarks": 3379, "views": 293895, "date": "2026-08-16 04:08", "url": "https://x.com/ArchiveExplorer/status/2088900801489928637", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HP1EMeoWUAA90we.jpg", "width": 1592, "height": 1991}], "category": "Design & Code"}, {"id": "2088953110723252718", "text": "Launching https://t.co/Q0OVtJR1Wg \n\nEverything about your next favorite film, in one place — posters, interviews, reviews; all of it refreshing every day. \n\nBuilt for people who never want to miss a frame. Starting with Telugu cinema. More on the way. https://t.co/YJ1IANA85n", "author": "Prem_Pradeep21", "authorName": "Prem Pradeep", "authorImage": "https://pbs.twimg.com/profile_images/1532922669456592897/k8n_8Vfl_normal.jpg", "likes": 265, "retweets": 43, "replies": 15, "bookmarks": 150, "views": 58597, "date": "2026-08-16 07:36", "url": "https://filmhood.in", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2088950042812088320/vid/avc1/1242x720/MpAE9pxJqI9CXdVQ.mp4?tag=14", "width": 2968, "height": 1718}], "category": "Design & Code"}, {"id": "2088992368695628159", "text": "https://t.co/yFNqoLo6ot", "author": "EXM7777", "authorName": "Machina", "authorImage": "https://pbs.twimg.com/profile_images/1922574051580563456/-OFXIxnm_normal.jpg", "likes": 755, "retweets": 62, "replies": 27, "bookmarks": 2129, "views": 411819, "date": "2026-08-16 10:12", "url": "https://x.com/i/article/2088992361707896832", "media": [], "category": "Other"}, {"id": "2088875837936619619", "text": "영화, 드라마, 뮤비 스틸 프레임 라이브러리 웹사이트\n\nAI 영상 만들기 전에 영감을 얻거나\n시각적 스토리텔링을 참고해 보기 좋음\n\n컬러, 시간대, 구도, 조명, 샷 타입별로\n원하는 무드의 컷을 쉽게 찾을 수 있음\n\n이미지로 비슷한 프레임을\n찾을 수 있는 비주얼 검색 기능 지원\n\n마음에 드는 컷은 저장해서\n무드보드 만들기도 가능함", "author": "VibeEverything", "authorName": "LOOPY", "authorImage": "https://pbs.twimg.com/profile_images/2053897145498161152/21sjtifJ_normal.jpg", "likes": 371, "retweets": 71, "replies": 27, "bookmarks": 523, "views": 21280, "date": "2026-08-16 02:29", "url": "https://x.com/VibeEverything/status/2088875837936619619", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2088874999994327040/vid/avc1/1516x1080/OLZs7tQ9Do-WgFeL.mp4?tag=29", "width": 1516, "height": 1080}], "category": "Other"}, {"id": "2088956121306591714", "text": "dude scaled a game to 100k matches played within 4 days (50k of those in 14 hours)\n\nbuilt the most viral growth loop that makes people invite friends and keeps on growing organically \n\nwhat a product building legend", "author": "ShubhAgrawal26", "authorName": "Shubh Agrawal", "authorImage": "https://pbs.twimg.com/profile_images/1714279578741649408/-eCaBhc4_normal.jpg", "likes": 156, "retweets": 4, "replies": 4, "bookmarks": 63, "views": 15506, "date": "2026-08-16 07:48", "url": "https://x.com/ShubhAgrawal26/status/2088956121306591714", "media": [], "category": "Design & Code"}, {"id": "2088903240175722719", "text": "Need a better Spotify client that looks cool and uses 2GB less memory? \n\nTry Cliamp, inspired by Winamp. Beautiful little TUI.", "author": "sspaeti", "authorName": "Simon Späti 🏔️", "authorImage": "https://pbs.twimg.com/profile_images/1137678291605676032/ITc3M_ah_normal.png", "likes": 3194, "retweets": 132, "replies": 59, "bookmarks": 2317, "views": 289551, "date": "2026-08-16 04:18", "url": "https://x.com/sspaeti/status/2088903240175722719", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2088903090581680128/vid/avc1/2056x1190/B83Xg72pgCpYOdgH.mp4?tag=29", "width": 2056, "height": 1190}], "category": "Terminals"}, {"id": "2088872834630369671", "text": "Found a gem: https://t.co/RdGps62pfB by @anmold_s \n\nFree, open-source, copy-paste map components for React. Fully customizable, zero lock-in. https://t.co/scLTEUKnYK", "author": "mdanassaif", "authorName": "Mohd Anas", "authorImage": "https://pbs.twimg.com/profile_images/2068358681352380416/u1dI4YSW_normal.jpg", "likes": 847, "retweets": 54, "replies": 11, "bookmarks": 1257, "views": 52762, "date": "2026-08-16 02:17", "url": "https://mapcn.dev", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HP0qhD0agAATZK4.jpg", "width": 2910, "height": 1662}], "category": "Design & Code"}, {"id": "2088495158006280682", "text": "AI 영상 만들 때 참고하기 좋은 스틸컷 아카이브 사이트\n\n전세계 영화·애니메이션의 고화질 스틸컷들이\n감독, 장르, 연도, 국가별로 정리되어 있음\n\n영상 만들기 전 씬의 첫/마지막 프레임,\n무드보드, 스토리보드 구상할 때 참고하기 좋음\n\nAI에게 아무리 말로 자세히 설명해도\n내가 상상한 그 장면이 똑같이 나오는 일은 거의 없음\n\n근데 시각적 레퍼런스 하나만 던져주면\n조명, 구도, 색감, 인물 위치까지 한 번에 맞출 수 있음", "author": "VibeEverything", "authorName": "LOOPY", "authorImage": plies": 51, "bookmarks": 11557, "views": 453653, "date": "2026-08-14 13:24", "url": "https://docs.google.com/spreadsheets/d/13Q8-g51jan_e2ISx-yAFkXU2uW0SNR7G-TeoNYxPIBs/edit", "media": [], "category": "Other"}, {"id": "2088249504801648914", "text": "Flipper Zero listening to a utility meter📡\n\nCommunity member u/jaded_membership_939 tested wM-Buster, a Flipper Zero app that listens for Wireless M-Bus signals from your compatible water, gas, heat and electricity meters on Sub-GHz.\n\nIt can decode your broadcast readings, such as consumption, temperature, and status, and supports encrypted readings when you have the correct key from your provider.", "author": "flipper_net", "authorName": "Flipper Devices", "authorImage": "https://pbs.twimg.com/profile_images/1537785701562843137/NPrW_-nc_normal.jpg", "likes": 496, "retweets": 51, "replies": 6, "bookmarks": 326, "views": 47150, "date": "2026-08-14 09:00", "url": "https://x.com/flipper_net/status/2088249504801648914", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2088249435838980097/vid/avc1/1080x1920/cfVk6xUazra7zPkg.mp4?tag=29", "width": 1080, "height": 1920}], "category": "Other"}, {"id": "2088313557351825755", "text": "your home router....sucks. \n\n- It probably just got banned by the FCC.\n- it's dumb\n- it's boring\n\n-------&gt; You need to build your own. ⬇️⬇️⬇️", "author": "NetworkChuck", "authorName": "NetworkChuck", "authorImage": "https://pbs.twimg.com/profile_images/1599109943977775104/2_2ilfKp_normal.png", "likes": 617, "retweets": 24, "replies": 48, "bookmarks": 403, "views": 161153, "date": "2026-08-14 13:15", "url": "https://x.com/NetworkChuck/status/2088313557351825755", "media": [], "category": "Design & Code"}, {"id": "2088302753919778965", "text": "Built this 3D museum with a character exploring iconic artworks, Disney like animated arrivals and art info panels, using Three.js. https://t.co/5BxFry47nh", "author": "techartist_", "authorName": "Techartist", "authorImage": "https://pbs.twimg.com/profile_images/2111565799928602624/Rd21F0Lg_normal.jpg", "likes": 152, "retweets": 15, "replies": 8, "bookmarks": 51, "views": 7816, "date": "2026-08-14 12:32", "url": "https://x.com/techartist_/status/2088302753919778965", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2088302391284346881/vid/avc1/1280x828/TfBjH1vO4dFMlNGY.mp4?tag=29", "width": 1280, "height": 828}], "category": "Design & Code"}, {"id": "2088208468448817210", "text": "Today we are launching Dhenu Vision: the vision intelligence API for agriculture.\n\nState of the art for identification of pests and diseases in real farm photos. 95.1% precision, where the best frontier model scores 84.6%. https://t.co/XJWGi1yVes", "author": "chheplo", "authorName": "Pratik Desai", "authorImage": "https://pbs.twimg.com/profile_images/1904962015472631808/HCckP-cM_normal.jpg", "likes": 859, "retweets": 135, "replies": 36, "bookmarks": 269, "views": 40567, "date": "2026-08-14 06:17", "url": "https://x.com/chheplo/status/2088208468448817210", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2088207535262269440/vid/avc1/1920x1080/_7oFexmo0-ZSv1bP.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Other"}, {"id": "2088345102540587356", "text": "anatomy of a managed deep agent. https://t.co/pnmD06la9i https://t.co/5YhIkJP6SI", "author": "caspar_br", "authorName": "Caspar", "authorImage": "https://pbs.twimg.com/profile_images/1982513791498625024/mTCEFECz_normal.jpg", "likes": 1715, "retweets": 195, "replies": 33, "bookmarks": 2952, "views": 337582, "date": "2026-08-14 15:20", "url": "https://langch.in/mda", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HPtKvz9a4AAt_ow.jpg", "width": 3440, "height": 4011}], "category": "Other"}, {"id": "2088291051828367400", "text": "holy f**king shit, this github repo is full of free public apis and it has 457k stars 😳\n\npublic-apis is the biggest curated list of free apis on the internet\n\nwhat you get:\n- hundreds of free public apis\n- 30+ categories: music, news, finance, weather, games, science, sports\n- many need no auth or api key\n- community maintained\n- all free\n\ncategories:\n- animals, anime, books\n- business, calendar\n- finance, games\n- music, news\n- science, sports, weather\n- and way more\n\nhow to use:\n1. open the repo\n2. pick a category\n3. grab the api you need\n4. build something\n\nno subscriptions, no paid tiers\njust free apis for your projects\n\nsave this before you lose it", "author": "FareaNFts", "authorName": "Farea", "authorImage": "https://pbs.twimg.com/profile_images/1526240923088482305/YmdeyXCc_normal.jpg", "likes": 236, "retweets": 25, "replies": 17, "bookmarks": 459, "views": 35584, "date": "2026-08-14 11:45", "url": "https://x.com/FareaNFts/status/2088291051828367400", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2088289740151980032/vid/avc1/2940x1912/pUAnR59FFjuEnaMO.mp4?tag=29", "width": 2940, "height": 1912}], "category": "Design & Code"}];
        
        let filteredBookmarks = [...allBookmarks];
        
        const categoryColors = {
            'Design & Code': 'design',
            'Game Development': 'game',
            'Vibe Coding': 'vibe',
            'Security': 'security',
            'Terminals': 'terminals',
            'Other': 'other'
        };
        
        function formatDate(dateStr) {
            if (!dateStr) return '';
            const d = new Date(dateStr.replace(' ', 'T') + 'Z');
            const now = new Date();
            const diffDays = Math.floor((now - d) / 86400000);
            if (diffDays < 1) return 'Today';
            if (diffDays < 7) return diffDays + 'd ago';
            if (diffDays < 30) return Math.floor(diffDays/7) + 'w ago';
            if (diffDays < 365) return Math.floor(diffDays/30) + 'mo ago';
            return Math.floor(diffDays/365) + 'y ago';
        }
        
        function formatNumber(num) {
            return (num || 0).toLocaleString();
        }
        
        function renderBookmarks(bookmarks) {
            const container = document.getElementById('bookmarks');
            container.innerHTML = '';
            
            if (bookmarks.length === 0) {
                container.innerHTML = '<div class="empty-state">No bookmarks found. Try adjusting your filters.</div>';
                return;
            }
            
            bookmarks.forEach((bm, index) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.style.animationDelay = `${index * 0.02}s`;
                
                const authorName = bm.authorName || bm.author;
                const authorHandle = bm.author;
                const authorInitial = authorName.charAt(0).toUpperCase();
                const date = formatDate(bm.date);
                const category = bm.category || 'Other';
                const categoryClass = categoryColors[category] || 'other';
                
                let mediaHtml = '';
                if (bm.media && bm.media.length > 0) {
                    const firstMedia = bm.media.find(m => m.type === 'photo') || bm.media[0];
                    if (firstMedia && firstMedia.url) {
                        mediaHtml = `<div class="card-media"><img src="${firstMedia.url}" alt="" loading="lazy"></div>`;
                    }
                }
                
                const text = bm.text || '';
                const displayText = text.length > 200 ? text.substring(0, 200) + '...' : text;
                
                const xUrl = bm.url || `https://x.com/${authorHandle}/status/${bm.id}`;
                
                card.innerHTML = `
                    ${mediaHtml}
                    <div class="card-header">
                        <div class="card-avatar">${authorInitial}</div>
                        <div class="card-author-info">
                            <div class="card-author">${authorName}</div>
                            <div class="card-handle">@${authorHandle}</div>
                        </div>
                        <span class="card-date">${date}</span>
                    </div>
                    <div class="card-text">${displayText}</div>
                    <div class="card-meta">
                        <span class="meta-item">👍 ${formatNumber(bm.likes)}</span>
                        <span class="meta-item">🔖 ${formatNumber(bm.bookmarks)}</span>
                        <span class="meta-item">👁 ${formatNumber(bm.views)}</span>
                        <span class="meta-item">🔁 ${formatNumber(bm.retweets)}</span>
                    </div>
                    <div class="card-actions">
                        <a href="${xUrl}" target="_blank" class="btn btn-primary">View on X</a>
                        <span class="category-badge ${categoryClass}">${category}</span>
                    </div>
                `;
                
                container.appendChild(card);
            });
            
            document.getElementById('resultsCount').textContent = `${bookmarks.length} results`;
        }
        
        function filterBookmarks() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const category = document.getElementById('categoryFilter').value;
            const author = document.getElementById('authorFilter').value;
            const sortBy = document.getElementById('sortBy').value;
            
            let result = allBookmarks.filter(bm => {
                const text = (bm.text || '').toLowerCase();
                const authorHandle = (bm.author || '').toLowerCase();
                const authorName = (bm.authorName || '').toLowerCase();
                const categoryMatch = category ? bm.category === category : true;
                const authorMatch = author ? authorHandle === author || authorName === author : true;
                const searchMatch = search ? 
                    text.includes(search) || authorHandle.includes(search) || authorName.includes(search) : true;
                
                return categoryMatch && authorMatch && searchMatch;
            });
            
            result.sort((a, b) => {
                switch(sortBy) {
                    case 'date-desc': return new Date(b.date) - new Date(a.date);
                    case 'date-asc': return new Date(a.date) - new Date(b.date);
                    case 'likes-desc': return (b.likes || 0) - (a.likes || 0);
                    case 'likes-asc': return (a.likes || 0) - (b.likes || 0);
                    case 'bookmarks-desc': return (b.bookmarks || 0) - (a.bookmarks || 0);
                    case 'bookmarks-asc': return (a.bookmarks || 0) - (b.bookmarks || 0);
                    default: return 0;
                }
            });
            
            return result;
        }
        
        function populateAuthorFilter() {
            const authorFilter = document.getElementById('authorFilter');
            const authors = [...new Set(allBookmarks.map(bm => bm.author).filter(Boolean))].sort();
            authors.forEach(author => {
                const option = document.createElement('option');
                option.value = author;
                option.textContent = author;
                authorFilter.appendChild(option);
            });
        }
        
        function toggleView(btn) {
            document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const view = btn.dataset.view;
            document.getElementById('bookmarks').classList.toggle('list', view === 'list');
        }
        
        function resetFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('authorFilter').value = '';
            document.getElementById('sortBy').value = 'date-desc';
            filteredBookmarks = filterBookmarks();
            renderBookmarks(filteredBookmarks);
        }
        
        document.getElementById('searchInput').addEventListener('input', () => {
            filteredBookmarks = filterBookmarks();
            renderBookmarks(filteredBookmarks);
        });
        
        document.getElementById('categoryFilter').addEventListener('change', () => {
            filteredBookmarks = filterBookmarks();
            renderBookmarks(filteredBookmarks);
        });
        
        document.getElementById('authorFilter').addEventListener('change', () => {
            filteredBookmarks = filterBookmarks();
            renderBookmarks(filteredBookmarks);
        });
        
        document.getElementById('sortBy').addEventListener('change', () => {
            filteredBookmarks = filterBookmarks();
            renderBookmarks(filteredBookmarks);
        });
        
        populateAuthorFilter();
        filteredBookmarks = filterBookmarks();
        renderBookmarks(filteredBookmarks);
        
        console.log('Bookmarks Explorer initialized with', allBookmarks.length, 'bookmarks');
    </script>
</body>
