031181314/wDZ2Wo3L_normal.jpg", "likes": 2347, "retweets": 290, "replies": 206, "bookmarks": 352, "views": 601510, "date": "2026-09-17 03:01", "url": "https://x.com/RobLogic/status/2100480294243709005", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2100480267496644608/vid/avc1/576x1024/AnEgcrjikCvSdfSF.mp4?tag=29", "width": 576, "height": 1024}], "category": "Other"}, {"id": "2100398572004946079", "text": "It never made sense to me how pi (π) can continue forever without ending until I watched this video. https://t.co/rsOSJVkVRh", "author": "JoshuaBarzon", "authorName": "Josh Barzon", "authorImage": "https://pbs.twimg.com/profile_images/1817034503472181248/Tb-a8h8h_normal.jpg", "likes": 2726, "retweets": 525, "replies": 87, "bookmarks": 1637, "views": 377179, "date": "2026-09-16 21:36", "url": "https://x.com/JoshuaBarzon/status/2100398572004946079", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2100398526937112576/vid/avc1/1078x1550/yjd4QdvwvQJ6YCll.mp4?tag=29", "width": 1078, "height": 1550}], "category": "Other"}, {"id": "2100390847795916811", "text": "OMG why doesn’t every menu do this? https://t.co/wn6jOHLycG", "author": "posvar", "authorName": "jeremy.eth", "authorImage": "https://pbs.twimg.com/profile_images/1794157262443024384/QQg8tiCl_normal.jpg", "likes": 35686, "retweets": 1721, "replies": 332, "bookmarks": 8316, "views": 2620459, "date": "2026-09-16 21:06", "url": "https://x.com/posvar/status/2100390847795916811", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSYWWDObAAAW_Tw.jpg", "width": 1536, "height": 2048}], "category": "Other"}, {"id": "2100449168548311276", "text": "https://t.co/iMKZSk2jJM", "author": "lovedropx", "authorName": "love drops", "authorImage": "https://pbs.twimg.com/profile_images/1922145872076271616/WpPuwBWY_normal.jpg", "likes": 2092, "retweets": 418, "replies": 3, "bookmarks": 631, "views": 36598, "date": "2026-09-17 00:58", "url": "https://x.com/lovedropx/status/2100449168548311276", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSZLYnQbAAEnDfo.jpg", "width": 736, "height": 736}], "category": "Other"}, {"id": "2100293405834453355", "text": "I've attempted to map everything in oncology in a public website and open source repo for all. \n\nThe site is trying to get all cancers, products, technologies, bottlenecks, people, startup opportunities with 1000+ ideas for upgrading the field. \n\nIf you have a loved one with cancer and you are technical or can engineer, go take a look, file improvement requests or bugs or help with the open repo and make this the best open and free info resource for individuals, researchers and educational use. \n\nThis should save people time, aid AI oncology projects and generate positive action. If you are not technical just complain in this thread about broken or annoying or things you want and I'll fix them live.\n\nSome of the interesting pages:\n\nTreatments: https://t.co/EJEOhMppoB\n\nA gallery of the molecules being used https://t.co/EV6ZitrVqm\n\nAnd targets: https://t.co/CgkjuF8nR2\n\nThe technologies in oncology: https://t.co/lNaieWYRKH\n\n1100 ideas for helping oncology: https://t.co/iQA6Z5SvRA\n\nBottlenecks on oncology: https://t.co/WND44055WD\n\nOpen questions (LETS GO RESEARCH PEOPLE) https://t.co/wSbphQ0IBg\n\nStartup requests (LETS GO STARTUP PEOPLE) https://t.co/PphztuLihP\n\nMechanics of cancer: https://t.co/cMUyVObzZi\n\nBattlefronts: https://t.co/PlSZitVd50\n\nIsotope supply: https://t.co/2Pcl4tTuPv\n\nKey papers: https://t.co/YK0dW1XJj0\n\nPipeline funnels: https://t.co/xYcbSCSyBg\n\nCancer by type: https://t.co/d9k8Yyzdk7\n\nInstitutional rankings: https://t.co/VepXcKHhaa\n\nThe startups: https://t.co/whXKg5dPzb\n\nHeros and heroines : https://t.co/uLDmhRjE36\n\nKey medical people: https://t.co/JWhDZ0rC73\n\nHere is the project roadmap: https://t.co/UtbbuOsdA5\n\nModels and data sets: https://t.co/bim0tjiWOj\n\nThere are other views as well, take a browse. \n\nTry making a PR if you have an upgrade to this on the repo here: https://t.co/2Dw0ufEJ3z\n\nIf you are biologically/medically minded and something is wrong, file a bug as well or say on the thread and we will get it fixed live. \n\nIf this is a useful project star the repo and help get it calibrated. \n\nI've tried to add some other languages but I cannot speak them so tell me if that doesnt work well.\n\nI believe we will crack oncology and having total information dominance is key to the problem. \n\nLet the feedback flow!", "author": "judegomila", "authorName": "Jude Gomila", "authorImage": "https://pbs.twimg.com/profile_images/1479571942923403266/7wgRHk___normal.jpg", "likes": 4544, "retweets": 939, "replies": 200, "bookmarks": 5016, "views": 333803, "date": "2026-09-16 14:39", "url": "https://x.com/judegomila/status/2100293405834453355", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSW70HwakAAzdh7.jpg", "width": 2400, "height": 1350}, {"type": "photo", "url": "https://pbs.twimg.com/media/HSW8LAwa4AAiomY.jpg", "width": 2400, "height": 1350}, {"type": "photo", "url": "https://pbs.twimg.com/media/HSW8OPvaUAEs2fp.jpg", "width": 2400, "height": 1350}, {"type": "photo", "url": "https://pbs.twimg.com/media/HSW8RTMbUAA9W8D.jpg", "width": 2400, "height": 1350}], "category": "Other"}, {"id": "2100044166830899613", "text": "How to understand anything: https://t.co/paTG2kitWl", "author": "CuriousMindsHub", "authorName": "Curious Minds", "authorImage": "https://pbs.twimg.com/profile_images/2026317074549587968/K2WBNNJH_normal.jpg", "likes": 1499, "retweets": 293, "replies": 9, "bookmarks": 1465, "views": 57037, "date": "2026-09-15 22:08", "url": "https://x.com/CuriousMindsHub/status/2100044166830899613", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSTa46dWMAA2C3I.jpg", "width": 1545, "height": 2000}, {"type": "photo", "url": "https://pbs.twimg.com/media/HSTa46DXgAAmSlU.jpg", "width": 1545, "height": 2000}], "category": "Other"}, {"id": "2099866104403492925", "text": "someone on a call today asked me what a good outreach message on LinkedIn looks like - when folks ask me this, I usually end up referring them to this site we built called https://t.co/vR3YvBjHiZ \n\na collection of hundreds of real outreach messages that got a praise. \n\nincase you wanna scroll and see what good looks like.", "author": "ShubhAgrawal26", "authorName": "Shubh Agrawal", "authorImage": "https://pbs.twimg.com/profile_images/1714279578741649408/-eCaBhc4_normal.jpg", "likes": 173, "retweets": 8, "replies": 19, "bookmarks": 398, "views": 18776, "date": "2026-09-15 10:21", "url": "https://coolmessagebro.com", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSQ4xLGbsAA5PTU.jpg", "width": 1433, "height": 1080}], "category": "Design & Code"}, {"id": "2099354958063894925", "text": "The music you loved between the ages of 13 and 18 will stay with you for the rest of your life, and no music you hear after that will ever hit the same way. A 2017 study in Frontiers in Psychology mapped the listening patterns of every generation and found that preferences formed in adolescence are the strongest and most durable of any age.\n\nCarol Krumhansl at Cornell University analysed the listening habits and emotional responses of thousands of people across multiple generations and found a consistent pattern: the songs that produce the strongest emotional response are the ones you heard during your teenage years. Not childhood. Not your twenties. The narrow window between roughly 13 and 18.\n\nThe researchers called it the reminiscence bump, a term borrowed from memory research. The brain during adolescence is undergoing rapid development in the regions that handle emotion and reward, and music that arrives during that window gets encoded with an intensity that later music cannot match. The same song heard at 15 and at 35 produces a stronger neurological response at 15, and the memory of that response is what makes the song feel like yours forever.\n\nThis is why classic rock fans feel physically different when they hear the opening of their song than when they hear something new. The brain built a room for that music during a period of heightened sensitivity, and the room is still there, unchanged, decades later.\n\nThe study also found that each generation has a bump centred on the hits of their teenage years, and the bump is remarkably consistent. The music industry has known this for decades: the audience you capture at 15 is the audience you keep for life. https://t.co/xWGnuvS9N7", "author": "anishmoonka", "authorName": "Anish Moonka", "authorImage": "https://pbs.twimg.com/profile_images/1953042191577972736/YV-bNMV2_normal.jpg", "likes": 3201, "retweets": 655, "replies": 110, "bookmarks": 1658, "views": 228809, "date": "2026-09-14 00:30", "url": "https://x.com/anishmoonka/status/2099354958063894925", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSAFiygboAAhPvM.jpg", "width": 1260, "height": 1296}], "category": "Design & Code"}, {"id": "2098835754168332628", "text": "On macOS and wanna see something interesting? Ask your agent: \"look at ~/Library/Application Support/Knowledge/knowledgeC.db and tell me some interesting facts\"\n\nI had no idea this stuff was all getting logged and it can infer a lot about your activity.", "author": "cooperx86", "authorName": "Peter Cooper", "authorImage": "https://pbs.twimg.com/profile_images/2103217578810253312/I-su_x3G_normal.jpg", "likes": 3047, "retweets": 116, "replies": 44, "bookmarks": 6156, "views": 411569, "date": "2026-09-12 14:06", "url": "https://x.com/cooperx86/status/2098835754168332628", "media": [], "category": "Other"}, {"id": "2098947859064483893", "text": "i want Codex to understand why i think a design is good, not just that i like it\n\nso i added little design critique quizzes to Taste for macOS (and iOS). you explain what works, what doesn't, and why\n\nyour critiques compound and become design guidance that the Taste MCP brings into Codex, Claude, Cursor, etc\n\nso when you say \"make it look better,\" your coding agent has a better idea of what good means to you specifically", "author": "alexkehr", "authorName": "Alex Kehr", "authorImage": "https://pbs.twimg.com/profile_images/2047254543667216384/2WW1ELF3_normal.jpg", "likes": 60, "retweets": 4, "replies": 13, "bookmarks": 34, "views": 3436, "date": "2026-09-12 21:32", "url": "https://x.com/alexkehr/status/2098947859064483893", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2098946581081018368/vid/avc1/1012x720/lydbKDqhSZ-Gd-Gb.mp4?tag=29", "width": 1012, "height": 720}], "category": "Design & Code"}, {"id": "2098895441915945311", "text": "This indie dev is making a game where you must find your car in a car park of 99,999 identical cars\n\n- Press your key to rule the wrong ones out\n- Sell what people left behind for upgrades\n- Buy drones to cover more of the car park\n\nGame is Where Did I Park? https://t.co/KDGxBSz5yb", "author": "IndieGameJoe", "authorName": "Indie Game Joe", "authorImage": "https://pbs.twimg.com/profile_images/1384258548448698377/W9iLPojX_normal.jpg", "likes": 2305, "retweets": 99, "replies": 126, "bookmarks": 629, "views": 614734, "date": "2026-09-12 18:04", "url": "https://x.com/IndieGameJoe/status/2098895441915945311", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2098895024520052736/vid/avc1/1920x1080/rg7S_H4ragyeS4Nd.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Other"}, {"id": "2097709112364535947", "text": "Your brain cannot tell the difference between someone insulting you to your face and you insulting yourself inside your own head. The stress response is the same.\n\nWhen you think something like \"I always mess this up,\" a small region called the amygdala, your brain's threat detector, fires the same way it would if a car were heading toward you. It floods your bloodstream with cortisol, the hormone your body releases when it thinks you are in danger. Your heart rate climbs, your blood pressure rises, your muscles tense, all because of a sentence you said silently in a room where nothing was wrong.\n\nA study published in Scientific Reports found that negative, past-directed thoughts raised cortisol levels in participants even when there was no external stress happening at all. The threat was purely internal, and the body treated it as if it were coming from outside. Researchers at the Mind Lab at a neuroscience institute put it plainly: the brain does not distinguish between a perceived danger in the environment and a harsh verdict you deliver about yourself.\n\nThe worse part is what happens next. Cortisol makes you more emotionally sensitive, which makes the next thought more likely to be negative, which releases more cortisol. The cycle feeds itself. Neurons that fire together wire together, so every repetition of \"I am not good enough\" digs the groove a little deeper and makes the thought more automatic.\n\nThe good news from the same research: the pathway runs both ways. People who trained in emotional regulation, including repeating statements about their own worth, showed less firing in the threat centre over time. The brain can learn to quiet the alarm. It just needs a different sentence to practice with. https://t.co/AJF7U5Treb", "author": "anishmoonka", "authorName": "Anish Moonka", "authorImage": "https://pbs.twimg.com/profile_images/1953042191577972736/YV-bNMV2_normal.jpg", "likes": 775, "retweets": 135, "replies": 6, "bookmarks": 679, "views": 39716, "date": "2026-09-09 11:30", "url": "https://x.com/anishmoonka/status/2097709112364535947", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRyEejPawAARTR3.jpg", "width": 986, "height": 1200}], "category": "Design & Code"}, {"id": "2097692685775565031", "text": "✨ I replaced all these SaaS with my own vibe coded now, so about $25,000/mo savings:\n\n- Weather API -> My own vibe coded weather service using Norway's meteorology API\n- Image resizing API -> My own vibe coded image resizing API with NodeJS's Sharp + Redis (saves ~$1,500/mo)\n- Google Vision NSFW detection -> My own $0/mo vibe coded NSFW detection service with Python's NudeNET (saves ~$2,500/mo)\n- Cloudflare Streaming -> My own $0/mo Nginx VPS video streaming (saves ~$250/mo)\n- API Flash -> My own $0/mo screenshot service (for social images) (saves ~$250/mo)\n- New Relic + IPHub -> My own $0/mo error monitoring, DDOS blocking and fleet management service (called error2telegram) (saves ~$250/mo)\n- Human moderators -> My own moderation on all my sites with @xAI (saves ~$10,000/mo)\n- IFTTT -> Telegram bot (saves ~$100/mo)\n- Photopea as editor inside Photo AI -> Vibe coded my own photo editor (saves ~$100/mo)\n- Mapbox -> Vibecoded my own free replacement with OpenFreeMaps (saves ~$500/mo)\n- Uptimerobot -> My own $5/mo Uptime Canary app running on Kuma (saves ~$50/mo)\n- Ghost blog -> My own $0/mo blog platform\n- Customer support -> @featurebasehq + AI support bot (saves $5,000/mo)\n- Scrapingbee/SerpAPI -> My own $1/mo scraper with Patchright (save ~$250/mo)\n\nI think I have reached my final limit of replacing my SaaS services as I have these left, but that'd mean becoming an ICANN registrar (I don't want 😁), managing my own email (I don't want), managing my own hard drives at home in a storage (I don't want) and managing my own servers at home too (I don't want) and running my own GPU rig at home (I don't want):\n\n- Cloudflare Domains\n- Cloudflare Email Sending\n- Cloudflare R2 Storage\n- Backblaze B2 for backups\n- Hetzner for all my servers for all my sites (VPS)\n- xAI for all LLMs for all my sites (so many things like moderation, writing emails, anything)", "author": "levelsio", "authorName": "@levelsio", "authorImage": "https://pbs.twimg.com/profile_images/2077111020305162240/PwddgOau_normal.jpg", "likes": 4269, "retweets": 208, "replies": 350, "bookmarks": 6144, "views": 582405, "date": "2026-09-09 10:24", "url": "https://x.com/levelsio/status/2097692685775565031", "media": [], "category": "Design & Code"}, {"id": "2097778568499474775", "text": "emotional damage cake https://t.co/07pXZ1Fxs0", "author": "naiivememe", "authorName": "naiive", "authorImage": "https://pbs.twimg.com/profile_images/1712169020424933376/Y_KdDb2A_normal.jpg", "likes": 1898, "retweets": 154, "replies": 15, "bookmarks": 222, "views": 45736, "date": "2026-09-09 16:06", "url": "https://x.com/naiivememe/status/2097778568499474775", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRxSoWCbQAA_Hsx.jpg", "width": 1280, "height": 1552}], "category": "Other"}, {"id": "2097958455092904218", "text": "Three.js conf time! Look how amazing this speaker badge is!\n\nIt has games!! https://t.co/XfX9wOHpgH", "author": "cassiecodes", "authorName": "Cassie Evans", "authorImage": "https://pbs.twimg.com/profile_images/1800895614558818304/NDwx9VT2_normal.jpg", "likes": 1574, "retweets": 106, "replies": 72, "bookmarks": 488, "views": 100870, "date": "2026-09-10 04:00", "url": "https://x.com/cassiecodes/status/2097958455092904218", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2097955596657999872/vid/avc1/720x1280/n2-kh-c_h8g7qEFi.mp4?tag=14", "width": 1080, "height": 1920}], "category": "Other"}, {"id": "2097751241451503735", "text": "Why would you build anything without this going forward? https://t.co/om1QIbs3lg", "author": "ShannonJean", "authorName": "Shannon Jean", "authorImage": "https://pbs.twimg.com/profile_images/2102457418886340608/zASVglKg_normal.jpg", "likes": 773, "retweets": 38, "replies": 67, "bookmarks": 444, "views": 2322539, "date": "2026-09-09 14:17", "url": "https://x.com/ShannonJean/status/2097751241451503735", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2097714062906060800/vid/avc1/636x830/d71jqNEySt2iMG_S.mp4?tag=29", "width": 636, "height": 830}], "category": "Design & Code"}, {"id": "2096964158994755604", "text": "FFmpeg Skill Update 🎬\n\nVer.0.9.2→Ver.0.12.0\n\n「この動画を9:16にして」「無音カットして」「字幕入れて」\nに加えて、今はこんな指示もできます。\n\n「この部分だけピクセル単位でクロップして」\n「この写真、ズームしながらクリップにして」(Ken Burns風)\n「動画を回転/反転して」\n「この動画にロゴ動画を合成して」「グリーンバックを抜いて」\n「この動画、逆再生にして」\n「手ブレを直して」\n「連番の画像から動画作って」\n「単色/グラデーションの背景クリップ作って」\n「劣化なしでそのまま書き出して」\n「字幕は画質そのままで、後から切り替えられる形で入れて」\n「ハイライトは音量じゃなくて長さで選んで」\n「AI解析用に軽い解像度でプレビュー書き出して」\n\nできることが21→28個のツールに増えました。\n\n🔍 AIが「わかった上で」処理するように\n\n・「今この環境でこのツールが実際に使えるか」を実行前に事前チェック\n・GPUエンコーダー/フォント代替の有無も把握\n・複数の音声トラックを持つファイル(吹き替え・別言語版など)で、使うトラックをほぼ全ツールで指定可能に\n・字幕トラックの言語などの詳細も読み取れるように\n・字幕タイミングをタイムコード(hh:mm:ss:ff)形式でも指定可能に\n・9:16化などのクロップで、切り取る位置(左寄せ/右寄せなど)も指定可能に\n・音声を再エンコードするかしないか、各ツールが正直に申告するように\n\n✅ 「壊れない・嘘をつかない」を徹底\n\n・書き出しが本当に成功したか毎回確認してから「完了」と報告、失敗時のゴミファイルも残さない\n・元の動画ファイルを誤って上書き・破損させない安全策\n・失敗した時、原因とやり直せるかをAIが判別\n・色変換で再エンコードが必要になった場合も、字幕や追加の音声トラックをできる限り残すように\n・同期のズレを検出した時、信頼度が低い場合はAIに警告\n・最新FFmpeg / Windows環境でも安定動作(Windowsのパス周りのバグ修正含む)\n\n🛠️ 開発・保守の仕組みも強化\n\n・「AIがして良いこと/判断すべきでないこと」を明文化(勝手にAIが「見た目の良さ」を判断しない設計)\n・生FFmpegコマンドへの逃げ道を塞ぐテストを追加\n・ドキュメントと実際のコードの挙動がズレたら自動テストで検知\n・OSSとしてのContributing手順を整備、バージョンタグを打つとGitHub Releaseが自動生成される仕組みを追加\n・GPU対応について「対応してるとは言うが動作保証はしない」ことを正直に明記\n\nClaude Code / Cursor / Codex対応、MCPあり、ローカル処理でクラウド不要は変わらず。\n\nCurrent: v0.12.0\n\nhttps://t.co/5Uuz4Zs09B\n\n#FFmpeg #AIVideo #AI #MCP #ClaudeCode #OpenSource", "author": "kebura_P", "authorName": "shogo kajiyama", "authorImage": "https://pbs.twimg.com/profile_images/2117597005560311808/U1Bi-rDh_normal.png", "likes": 2378, "retweets": 262, "replies": 24, "bookmarks": 3818, "views": 147368, "date": "2026-09-07 10:09", "url": "https://x.com/kebura_P/status/2096964158994755604", "media": [], "category": "Other"}, {"id": "2096917764296610039", "text": "This Is How Air Actually Moves Through Your Home https://t.co/6eBrQxBxhm", "author": "stemexplor", "authorName": "S.T.E.M Explorer", "authorImage": "https://pbs.twimg.com/profile_images/1974131811333656576/P1UmaXyf_normal.jpg", "likes": 11061, "retweets": 1649, "replies": 61, "bookmarks": 5550, "views": 4116483, "date": "2026-09-07 07:05", "url": "https://x.com/stemexplor/status/2096917764296610039", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2096917700450848770/vid/avc1/664x924/WdedSJXoIJu5wN-3.mp4?tag=29", "width": 664, "height": 924}], "category": "Other"}, {"id": "2095848114074898603", "text": "I use a free skill that lets Claude watch any YouTube video and turn it into a reusable skill.\n\nTo watch a video, use an open-source skill called /watch.\n\nIt pulls the captions, extracts the key frames, and hands both to Claude, so it works from what was on screen.\n\nThe method works just as well on Loom, TikTok, tutorials, a competitor's launch video, a podcast, or a screen recording of something broken.\n\nInstall it, then paste this into Claude Code:\n\n/plugin marketplace add bradautomates/claude-video\n/plugin install watch@claude-video\n\nOn first run it installs ffmpeg and yt-dlp. Mac does it automatically, Linux and Windows print the commands to run.\n\n/watch [paste the video URL] and turn it into a skill.\n\n\"You are a skill builder working only from this video.\n\nWatch it fully, frames and transcript. Identify the one thing it teaches, then extract every step, decision and example in the order they appear. Note anything shown on screen that the speaker never says out loud.\n\nThen give me:\n\nWhat this video teaches, in one line\nThe steps, written as instructions an AI could follow\nEvery mistake or warning the creator gives\nA skill file I can save and reuse\n\nRules: use only what is in the frames and captions, mark anything you inferred, and if the download failed or the captions were missing, tell me before you build anything.\"", "author": "alex_prompter", "authorName": "Alex Prompter", "authorImage": "https://pbs.twimg.com/profile_images/2066532957049769985/zzC81Zmq_normal.jpg", "likes": 252, "retweets": 23, "replies": 22, "bookmarks": 505, "views": 19046, "date": "2026-09-04 08:15", "url": "https://x.com/alex_prompter/status/2095848114074898603", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRXywELaYAEhqZa.jpg", "width": 1536, "height": 1024}], "category": "Design & Code"}, {"id": "2096843300385009984", "text": "Nice https://t.co/XTOWyG0l4D", "author": "QingQ77", "authorName": "Geek Lite", "authorImage": "https://pbs.twimg.com/profile_images/2004028412730789892/4IFUGOl2_normal.jpg", "likes": 1673, "retweets": 148, "replies": 19, "bookmarks": 1081, "views": 121148, "date": "2026-09-07 02:09", "url": "https://x.com/QingQ77/status/2096843300385009984", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2096843235956228096/vid/avc1/1080x1920/RuzIqy2sR3Bkdc6-.mp4?tag=29", "width": 1080, "height": 1920}], "category": "Other"}, {"id": "2096706412453810409", "text": "If you are a Mac user, check this \n\nhttps://t.co/7ez5kgyQY4 \n\nDamn.", "author": "baba_Omoloro", "authorName": "Peter Agboola", "authorImage": "https://pbs.twimg.com/profile_images/1995577864587001856/Zh6YFoeU_normal.jpg", "likes": 4694, "retweets": 232, "replies": 99, "bookmarks": 11626, "views": 1348812, "date": "2026-09-06 17:05", "url": "https://recordly.dev", "media": [], "category": "Other"}, {"id": "2096009146248122416", "text": "I used GPT-6 Astra to create a 3D website that pulls apart a Tesla Model X into 334 modeled pieces\n\nwe are in a renaissance of learning https://t.co/r2V2bJyuJJ", "author": "ashebytes", "authorName": "ashe", "authorImage": "https://pbs.twimg.com/profile_images/2068592289761636352/kMaWy2mb_normal.jpg", "likes": 8246, "retweets": 722, "replies": 280, "bookmarks": 3830, "views": 1126081, "date": "2026-09-04 18:54", "url": "https://x.com/ashebytes/status/2096009146248122416", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2096008340329627648/vid/avc1/3840x2096/hswPv2D2oZ_ddhJo.mp4?tag=29", "width": 3840, "height": 2096}], "category": "Other"}, {"id": "2096221988763173186", "text": "since you guys loved the exploding tesla.. \n\nI used GPT-6 Astra to create a 3D website that pulls apart the male anatomy into 2,234 modeled pieces!\n\nwe are in a renaissance of learning https://t.co/9CGmHcdhnk", "author": "ashebytes", "authorName": "ashe", "authorImage": "https://pbs.twimg.com/profile_images/2068592289761636352/kMaWy2mb_normal.jpg", "likes": 53243, "retweets": 5411, "replies": 1152, "bookmarks": 26692, "views": 8050264, "date": "2026-09-05 09:00", "url": "https://x.com/ashebytes/status/2096221988763173186", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2096218474930405376/vid/avc1/3958x2160/Z1emO-cwwuzzoNXj.mp4?tag=29", "width": 3958, "height": 2160}], "category": "Other"}, {"id": "2096229865825394750", "text": "What is stopping you from being musical?", "author": "PierceLilholt", "authorName": "Pierce Alexander Lilholt", "authorImage": "https://pbs.twimg.com/profile_images/1863419009644781568/0Rz7-ojd_normal.jpg", "likes": 110, "retweets": 11, "replies": 86, "bookmarks": 6, "views": 6159, "date": "2026-09-05 09:32", "url": "https://x.com/PierceLilholt/status/2096229865825394750", "media": [], "category": "Other"}, {"id": "2095898682075803651", "text": "DIY: easy and simple 3D hologram https://t.co/q9z1EtKIun", "author": "Rainmaker1973", "authorName": "Massimo", "authorImage": "https://pbs.twimg.com/profile_images/914888589670043654/KVvwjcWA_normal.jpg", "likes": 1373, "retweets": 153, "replies": 4, "bookmarks": 1006, "views": 285894, "date": "2026-09-04 11:36", "url": "https://x.com/Rainmaker1973/status/2095898682075803651", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2095885797274910720/vid/avc1/1080x1920/QM4BdeBQbjGBeK3G.mp4?tag=29", "width": 1080, "height": 1920}], "category": "Other"}, {"id": "2096134811434029313", "text": "Elon Musk says Tesla will sell a Cybercab to a customer for under 30,000 dollars before 2027. A chartered financial analyst built the model for what one would actually earn you.\n\nOn Herbert Ong's channel, Soren Basher gave 8 things worth knowing:\n\n1. Fourteen thousand in the worst case", "author": "GeniusGTX", "authorName": "GeniusThinking", "authorImage": "https://pbs.twimg.com/profile_images/2050658876195065856/wXZMLbh2_normal.jpg", "likes": 2342, "retweets": 234, "replies": 117, "bookmarks": 2380, "views": 1163513, "date": "2026-09-05 03:14", "url": "https://x.com/GeniusGTX/status/2096134811434029313", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2096134739359150080/vid/avc1/1920x1080/0iPYLmKfVJKJ-Of_.mp4?tag=16", "width": 1920, "height": 1080}], "category": "Design & Code"}, {"id": "2095925354271514973", "text": "Some fun use cases for Omni 1.1 ⬇️", "author": "FlowbyGoogle", "authorName": "Google Flow", "authorImage": "https://pbs.twimg.com/profile_images/2056773883223793673/fiUqiVTu_normal.jpg", "likes": 1098, "retweets": 36, "replies": 33, "bookmarks": 684, "views": 153485, "date": "2026-09-04 13:21", "url": "https://x.com/FlowbyGoogle/status/2095925354271514973", "media": [], "category": "Other"}, {"id": "2095732415876764099", "text": "Cloudflare Images binding can rasterize text now.\n\n.text() turns a string into an image (or draws it over one) from a Worker — font, size, color. Also: signed URLs, Direct Creator Upload links, metadata filters on .list().\n\nhttps://t.co/wQwqPX9YXV", "author": "ravixalgorithm", "authorName": "Ravi", "authorImage": "https://pbs.twimg.com/profile_images/2030568364901560320/KRIUF447_normal.jpg", "likes": 1, "retweets": 0, "replies": 0, "bookmarks": 1, "views": 70, "date": "2026-09-04 00:35", "url": "https://developers.cloudflare.com/changelog/product/images/", "media": [], "category": "Other"}, {"id": "2095691842880934081", "text": "John Steinbeck’s teenage son fell in love and wrote to his father about it and this is what his father wrote back. https://t.co/wN0A6CCptK", "author": "divya_venn", "authorName": "divenire", "authorImage": "https://pbs.twimg.com/profile_images/1893333894658727936/rkyIVN4i_normal.jpg", "likes": 12570, "retweets": 973, "replies": 29, "bookmarks": 3343, "views": 351018, "date": "2026-09-03 21:54", "url": "https://x.com/divya_venn/status/2095691842880934081", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRVkn9ZaYAAT9It.jpg", "width": 1080, "height": 1350}], "category": "Other"}, {"id": "2095400022963867926", "text": "come play 👀\nhttps://t.co/1Dtf9Ub9Cv is now open-sourced (AGPL-3.0)\n\nyou can modify, distribute, use it commercially", "author": "hieuSSR", "authorName": "Hieu 🚀", "authorImage": "https://pbs.twimg.com/profile_images/2100611159519064064/UwyRrBP6_normal.jpg", "likes": 172, "retweets": 6, "replies": 18, "bookmarks": 273, "views": 29519, "date": "2026-09-03 02:34", "url": "https://mailflare.co", "media": [], "category": "Other"}, {"id": "2095555631042163014", "text": "🚨 NVIDIA just quietly changed what a “personal AI computer” can mean.\n\nMeet NVIDIA PAIR: Personal AI Router.\n\nInstead of buying one massive machine to run local AI, PAIR lets you connect the computers you already have and turn them into a personal AI inference cluster.\n\nYour RTX PC.\nYour DGX Spark.\nEven supported Macs.\nAll working together.\nPAIR automatically discovers compatible machines on your local network and routes AI workloads to whichever device has available compute.\n\nThink of it like a load balancer for AI agents running inside your house.\n\nAnd this is where things get interesting:\n\n→ Run multiple AI agents in parallel\n→ Route inference across multiple GPUs/computers\n→ Use Ollama + LM Studio\n→ Keep prompts, files and agent context on your own network\n→ No racks or complicated cluster setup\n→ Windows, Linux and macOS support\n\nThe bigger idea here isn’t just PAIR.\n\nIt’s where NVIDIA thinks AI computing is going.\nToday we have:\n1 user → 1 computer → 1 AI model\nTomorrow could look more like:\n1 user → many AI agents → an entire pool of local compute\nYour gaming PC might run one agent.\n\nYour workstation runs another.\n\nA DGX Spark handles the heavy model.\n\nAnd PAIR becomes the router deciding where every inference request goes.\n\nThe cloud isn’t disappearing.\n\nBut personal AI infrastructure is starting to look a lot more like a miniature data center.\n\nAnd NVIDIA wants to provide the operating layer underneath it.\n\nPAIR is currently in beta and NVIDIA has released it as free, open-source software.\n\nThis one is worth watching. 👀\nhttps://t.co/eRslBpy8C5", "author": "aijoey", "authorName": "Joey", "authorImage": "https://pbs.twimg.com/profile_images/1644521879909150726/LQMqYnTx_normal.jpg", "likes": 1276, "retweets": 144, "replies": 69, "bookmarks": 1396, "views": 87381, "date": "2026-09-03 12:52", "url": "https://x.com/aijoey/status/2095555631042163014", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRToSouaUAAXv6c.jpg", "width": 1034, "height": 606}], "category": "Design & Code"}, {"id": "2095149761523491199", "text": "How to send a hug through a beautiful card. https://t.co/08RYKYjAM2", "author": "Rainmaker1973", "authorName": "Massimo", "authorImage": "https://pbs.twimg.com/profile_images/914888589670043654/KVvwjcWA_normal.jpg", "likes": 8939, "retweets": 1384, "replies": 30, "bookmarks": 8885, "views": 603863, "date": "2026-09-02 10:00", "url": "https://x.com/Rainmaker1973/status/2095149761523491199", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2095116514844082180/vid/avc1/720x720/PHT8BGBPnavIw5VQ.mp4?tag=29", "width": 720, "height": 720}], "category": "Other"}, {"id": "2095166860740174273", "text": "I’m excited to finally announce the newest edition my Stanford course 𝗧𝗵𝗲 𝗠𝗼𝗱𝗲𝗿𝗻 𝗦𝗼𝗳𝘁𝘄𝗮𝗿𝗲 𝗗𝗲𝘃𝗲𝗹𝗼𝗽𝗲𝗿. It has been 9 months in the making.\n\nLast November, with the release of Claude Opus 4.5, coding agents experienced a step function improvement in capability. We all felt it. The LLMs were more powerful, could reason for longer, solve harder tasks.\n\nThis year’s iteration of my course reflects the 2026 metamorphosis of software engineering.\n\nMy core belief is simple: AI-native developers of the LLM era are going to become the most important members of any software organization. I have designed my course to train this next generation of engineers.\n\n𝗪𝗵𝗮𝘁’𝘀 𝗱𝗶𝗳𝗳𝗲𝗿𝗲𝗻𝘁 𝘁𝗵𝗶𝘀 𝘁𝗶𝗺𝗲 𝗮𝗿𝗼𝘂𝗻𝗱\n\nFirst, 85% of my Fall 2025 class material is being thrown out. The Fall 2026 syllabus reflects the core capabilities AI-native engineers must have: agent skills, advanced context engineering, MCP portals, agent-ready codebase principles, agentic code review, security, parallelizing background agents, software factories, and more.\n\nSecond, I am going to teach my students how to have software taste. Every student will be required to ship pull requests to production-grade, real-world codebases. The course is collaborating with the top open-source AI repos who will offer support and mentorship to students on how to meaningfully contribute to their projects.\n\nThis has never been done before in any university course so I am incredibly grateful to our OSS Partners: @browserbase, @HeyGen, @CopilotKit, @semgrep, @OpenHandsDev, @milvusio, @marimo_io, Pi, @crewAIInc, @warpdotdev, @vercel, @cmux, @arizeai, @UnslothAI, and @anyscalecompute.\n\n𝗪𝗵𝗮𝘁’𝘀 𝘀𝘁𝗮𝘆𝗶𝗻𝗴 𝘁𝗵𝗲 𝘀𝗮𝗺𝗲\n\nI’m fortunate to again have AI software engineering leaders and founders as guest speakers to share their learnings from building top coding agent products. Thank you to @leerob from @cursor_ai, @bcherny of @claudeai code, @EnoReyes of @FactoryAI, @silasalberti of @cognition, @0xine of @semgrep, Rajesh Bhatia of @Cloudflare , @amasad of @Replit, and @eladgil.\n\nAll resources will be available online. All classes will be available to the public.\n\n9/22 on Stanford campus. See you in class. \n\nhttps://t.co/wTokHyUMsz", "author": "mihail_eric", "authorName": "Mihail Eric", "authorImage": "https://pbs.twimg.com/profile_images/1470840933713207296/ncMAXAa2_normal.jpg", "likes": 10598, "retweets": 1586, "replies": 276, "bookmarks": 15537, "views": 1547068, "date": "2026-09-02 11:08", "url": "https://x.com/mihail_eric/status/2095166860740174273", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRNBGrHaQAEgb2Y.jpg", "width": 1984, "height": 682}], "category": "Design & Code"}, {"id": "2095079512816193577", "text": "THE MONTESSORI WAY TO HANDLE A CHILD WHO WON’T LISTEN WITHOUT RAISING YOUR VOICE ONCE.\n\n1. Get physically close before you speak at all.", "author": "shamol_coder", "authorName": "M. Castells", "authorImage": "https://pbs.twimg.com/profile_images/2040050881954193408/wDnAOoya_normal.jpg", "likes": 4736, "retweets": 387, "replies": 110, "bookmarks": 9581, "views": 1770094, "date": "2026-09-02 05:20", "url": "https://x.com/shamol_coder/status/2095079512816193577", "media": [], "category": "Other"}, {"id": "2094863994066796896", "text": "What if your next vehicle concept could go from a rough idea to a 3D website in a few hours? 🤯\n\nVehicle design traditionally involves sketches, renders, CAD tools, 3D software, and a lot of time before anyone can actually experience the idea.\n\nAnd that's where AI can help you do better. \n\nI vibe coded this website using AI where you can explore different futuristic vehicle concepts in 3D. \n\nProcess wasn't anything special than what I've been doing so far. \n\nI generated those futuristic vehicle designs with GPT Image 2.0, turned those images into 3D models using Tripo, and then used Claude Opus 5 to build a website that renders the models and lets anyone interact with them directly in the browser.\n\nSo instead of just looking at a concept image, you can actually walk around it, explore the design, and experience the idea in 3D.\n\nAnd this goes far beyond vehicles.\n\nAs you might have seen some of my other posts, same workflow can be applied to education, prototyping, product visualization, architecture, and countless other fields.\n\nWith AI + 3D, you can turn ideas that once required complex workflows into experiences you can build and iterate much faster \n\nLive: https://t.co/2JFsEJaL9n\nCode: https://t.co/6YMRVJWvt0", "author": "thebuggeddev", "authorName": "The Bugged Dev", "authorImage": "https://pbs.twimg.com/profile_images/1956770434260910080/xVO3sbPP_normal.jpg", "likes": 236, "retweets": 24, "replies": 16, "bookmarks": 180, "views": 13189, "date": "2026-09-01 15:04", "url": "https://x.com/thebuggeddev/status/2094863994066796896", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2094859414172008448/vid/avc1/2940x1846/VMLznq8Nl8rJ-6gL.mp4?tag=29", "width": 2940, "height": 1846}], "category": "Vibe Coding"}, {"id": "2094828674092880129", "text": "After seeing so many ESP32 devices, I think people seriously underestimate the jog dial and the humble REC slide switch.\n\nHardware designers should learn more from 2000s Japanese consumer electronics. Those teams understood tactile UX long before touchscreens took over. https://t.co/DZzjIwaFgJ", "author": "henry19840301", "authorName": "Henry Li", "authorImage": "https://pbs.twimg.com/profile_images/1781096965524373504/8_xqudLe_normal.jpg", "likes": 4516, "retweets": 288, "replies": 101, "bookmarks": 2457, "views": 332628, "date": "2026-09-01 12:44", "url": "https://x.com/henry19840301/status/2094828674092880129", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRJTdmzbwAEzh5j.jpg", "width": 941, "height": 1672}], "category": "Design & Code"}, {"id": "2094689020995404083", "text": "Why would anyone use Tailscale when you can setup Nebula in 10 minutes?\nSame features, MIT license, and your trust chain isn’t given to another company.\n\nhttps://t.co/Mb6asFSwEi\n\nMy coding agent set it up for me and then did an infra audit independently. Works like a charm!", "author": "mittsh", "authorName": "Micha Mazaheri", "authorImage": "https://pbs.twimg.com/profile_images/1772708682695905280/vTFkyw9Y_normal.jpg", "likes": 942, "retweets": 35, "replies": 88, "bookmarks": 2023, "views": 228953, "date": "2026-09-01 03:29", "url": "https://github.com/slackhq/nebula", "media": [], "category": "Terminals"}, {"id": "2094753351372067215", "text": "cringe alert, this is the video that got us into YC\n\nthe YC guys, they're pros, they'll find the signal\nso don't overthink it, be simple, have clarity, have ambition\n\nhope it helps https://t.co/q7DJdyFaTg", "author": "AniC_dev", "authorName": "Anicet", "authorImage": "https://pbs.twimg.com/profile_images/1968045619248877568/XrGi-opy_normal.jpg", "likes": 436, "retweets": 14, "replies": 32, "bookmarks": 306, "views": 27039, "date": "2026-09-01 07:44", "url": "https://x.com/AniC_dev/status/2094753351372067215", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2094753000766013440/vid/avc1/720x404/-nxRtqgRZwaDBW1x.mp4?tag=29", "width": 720, "height": 404}], "category": "Other"}, {"id": "2094277661719744915", "text": "DIY- AR(Augmented Reality) glasses only cost 8$, are you interested??? 😱❤️🥰 https://t.co/87p8TZNei0", "author": "HiddenPlaces25", "authorName": "Hidden Places", "authorImage": "https://pbs.twimg.com/profile_images/2088662607175766016/OEEANKkg_normal.jpg", "likes": 1722, "retweets": 459, "replies": 585, "bookmarks": 850, "views": 297500, "date": "2026-08-31 00:14", "url": "https://x.com/HiddenPlaces25/status/2094277661719744915", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2094276993898713088/vid/avc1/720x1280/VjaHqEF3bSvJIWCO.mp4?tag=29", "width": 720, "height": 1280}], "category": "Other"}, {"id": "2094507025116127697", "text": "pretty crazy that Grok Bot can do this for you.\n\nhaven’t had a chance to use it yet but folks are using it for insane use cases.\n\nworth a read if you’re investing in ai search", "author": "ShubhAgrawal26", "authorName": "Shubh Agrawal", "authorImage": "https://pbs.twimg.com/profile_images/1714279578741649408/-eCaBhc4_normal.jpg", "likes": 40, "retweets": 0, "replies": 3, "bookmarks": 80, "views": 6493, "date": "2026-08-31 15:26", "url": "https://x.com/ShubhAgrawal26/status/2094507025116127697", "media": [], "category": "Other"}, {"id": "2094469325096636499", "text": "imagining a few small gestures to edit/write with ai:\nword: spin synonyms\nsentence: shift the tone (cold &lt;-&gt; warm)\nparagraph: shorten/expand https://t.co/hEcx2e0gS6", "author": "poetengineer__", "authorName": "Kat ⊷ the Poet Engineer", "authorImage": "https://pbs.twimg.com/profile_images/1783930619782656000/3hXoqxDX_normal.jpg", "likes": 8922, "retweets": 851, "replies": 222, "bookmarks": 4110, "views": 1038957, "date": "2026-08-31 12:56", "url": "https://x.com/poetengineer__/status/2094469325096636499", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2094469279554932736/vid/avc1/1280x720/uQbvKF2Yq0LB86np.mp4?tag=29", "width": 1280, "height": 720}], "category": "Other"}, {"id": "2094169705468604696", "text": "claude shannon was trying to fix phone calls when he accidentally solved market prediction\n\nbell labs published the paper in 1948. two sigma found it 50 years later, built a $60 billion fund around it, never mentioned it to retail\n\nthe idea is almost insultingly simple: every price series is signal buried in noise\n\nshannon proved you can measure *how much signal exists* at any moment - not predict direction, just quantify structure vs randomness\n\nthe formula is entropy:\nH = -sum(p * log2(p))\n\nrun it on rolling return distributions. outputs a number between 0 and 1\n\nH above 0.7 = noise. random walk. stay out\nH below 0.35 = structure detected. something non-random is happening in this market right now\n\nthat's the filter. not RSI, not bollinger bands - entropy\n\nbacktested SPY, 2003-2023:\n> entries in low-entropy windows: 61% win rate\n> same entries in high-entropy windows: 49%\n\none formula, 12% win rate difference, zero change to the underlying signal\n\nshannon published this math 77 years ago. it's chapter 2 of every information theory course on the planet\n\ndata to build it is free. the python is 40 lines\n\nBookmark this before you scroll past\n\nthey spent decades keeping you staring at lagging indicators while they were measuring the information content of the exact same price data you've always had", "author": "L1vsun", "authorName": "Livsun", "authorImage": "https://pbs.twimg.com/profile_images/2106747083357122561/R4DCJIW1_normal.jpg", "likes": 777, "retweets": 84, "replies": 10, "bookmarks": 2059, "views": 112231, "date": "2026-08-30 17:05", "url": "https://x.com/L1vsun/status/2094169705468604696", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2094169612879290368/vid/avc1/1080x1440/HRNLHgfHE63MVL05.mp4?tag=29", "width": 1080, "height": 1440}], "category": "Design & Code"}, {"id": "2093885794008318287", "text": "このプロンプト楽しい https://t.co/BBubjAHi2O", "author": "omom398", "authorName": "YutaTanaka", "authorImage": "https://pbs.twimg.com/profile_images/1745374776745775104/5RMPmfzM_normal.jpg", "likes": 8391, "retweets": 406, "replies": 20, "bookmarks": 6661, "views": 882700, "date": "2026-08-29 22:17", "url": "https://x.com/omom398/status/2093885794008318287", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQ76BRNbsAACIRy.jpg", "width": 1086, "height": 1448}, {"type": "photo", "url": "https://pbs.twimg.com/media/HQ76B2nb0AA4nhh.jpg", "width": 1086, "height": 1448}], "category": "Other"}, {"id": "2094122297044996136", "text": "made myself a Grok Pocket this weekend so i can take my grok bots on the go and easily switch between them.\n\ngonna spend the evening fine-tuning the animation and making responses minimal. \n\nwill open-source it this week. https://t.co/iBvNaOLdUO", "author": "BobbyThakkar", "authorName": "Bobby Thakkar", "authorImage": "https://pbs.twimg.com/profile_images/1737318162033500160/MNQcpSw9_normal.jpg", "likes": 2626, "retweets": 121, "replies": 250, "bookmarks": 1043, "views": 249555, "date": "2026-08-30 13:57", "url": "https://x.com/BobbyThakkar/status/2094122297044996136", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2094122120032710656/vid/avc1/1080x1920/210L27coIoIjXmdg.mp4?tag=29", "width": 1080, "height": 1920}], "category": "Other"}, {"id": "2094147454501540236", "text": "I saw this and I wanted to make a Mumbai version of this, so i spent my weekend doing this, had so much fun :) \n\nTry it out here: https://t.co/IzVUniDO1R\n\n- Walk around Marine Drive \n- Sit on the bench/parapet enjoy the sunset\n- Interact with people, buy Chai, feed birds\n\nNeeds a lot of work and improvements\n\nThanks @robj3d3 for igniting the spark xD", "author": "0xadarshmishra", "authorName": "Adarsh", "authorImage": "https://pbs.twimg.com/profile_images/2115760145410199552/jMP-6m6Z_normal.jpg", "likes": 265, "retweets": 17, "replies": 35, "bookmarks": 194, "views": 32493, "date": "2026-08-30 15:37", "url": "https://mumbai.adarshmishra.dev", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2094125931376132096/vid/avc1/2168x1080/bHjkGkjIDAFNTZWv.mp4?tag=29", "width": 2168, "height": 1080}], "category": "Design & Code"}, {"id": "2094323059155190260", "text": "everyone keeps asking how to get the @student.umgc.edu email\n\nhere it is, no fluff:\n\n1. go to https://t.co/Xa9JShx2Jr and apply - fee is waived if you apply by sept 1\n2. register at least one class (this is the part everyone skips)\n3. email activates - you get your @student.umgc.edu\n\nthat one email unlocks:\n- google ai pro for a year\n- chatgpt plus\n- codex credits\n- github student pack\n\nstep 2 is the whole trick. apply without enrolling and the email stays dead\n\ndo it before sept 1 while it's free\n\napply at https://t.co/Xa9JShx2Jr", "author": "alannnfx", "authorName": "Alan", "authorImage": "https://pbs.twimg.com/profile_images/2116539573639802880/ceHGNtXS_normal.jpg", "likes": 3985, "retweets": 329, "replies": 107, "bookmarks": 10180, "views": 941721, "date": "2026-08-31 03:15", "url": "https://umgc.edu", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HRCHt-3b0AAdKkf.jpg", "width": 1592, "height": 900}], "category": "Other"}, {"id": "2093994904238350603", "text": "\"Game theory is the most powerful decision-making framework in history.\n\nFrom Sun Tzu &amp; Genghis Khan to John F. Kennedy, it was used to win wars, forge empires and conquer the world.\"", "author": "Tim_Denning", "authorName": "Tim Denning", "authorImage": "https://pbs.twimg.com/profile_images/1760794427331948545/XXYtQTw4_normal.jpg", "likes": 1496, "retweets": 197, "replies": 18, "bookmarks": 2352, "views": 246613, "date": "2026-08-30 05:31", "url": "https://x.com/Tim_Denning/status/2093994904238350603", "media": [], "category": "Design & Code"}, {"id": "2094067933559345490", "text": "i wanted to build something this weekend that needed GPUs but wasn't sure where the cheapest place to host them was...\n\nso of course instead of building the actual idea, i built https://t.co/pN1xRxUCxV", "author": "burcs", "authorName": "brandon", "authorImage": "https://pbs.twimg.com/profile_images/1625693464573902848/3qlQ1n6n_normal.jpg", "likes": 1564, "retweets": 104, "replies": 110, "bookmarks": 1442, "views": 113422, "date": "2026-08-30 10:21", "url": "https://gputable.dev", "media": [], "category": "Design & Code"}, {"id": "2093559174420652461", "text": "Holy shit... Someone built a free AI that watches your security cameras and describes what happened in plain english.\n\nIt's called Clearcam. It bolts onto any security camera you already own and turns it into a smart one.\n\nNo new hardware. No cloud. The AI runs on your own machine.\n\n→ Spots and tracks people, cars, and objects the moment they appear\n→ Saves a clip of the exact event instead of 24 hours of an empty driveway\n→ Writes a plain english summary of each event with Qwen3 VL, so you read what happened instead of scrubbing footage\n→ Makes every event searchable, so \"the person at the door last night\" actually pulls it up\n→ Runs fully local. Your footage never leaves your machine.\n\nHere's the part that stings.\n\nRing, Nest, and Arlo all charge a monthly fee to unlock person detection and saved event history on cameras you already bought. You pay rent to watch your own front door.\n\nClearcam gives you the AI brain for free and keeps it on hardware you control.\n\nRuns on Mac and Linux. iOS and Android apps included.\n\n1.2K stars. GPL-3.0. Open source.", "author": "itsharmanjot", "authorName": "Harman", "authorImage": "https://pbs.twimg.com/profile_images/2026685520466853888/rfjlGyl8_normal.jpg", "likes": 1735, "retweets": 216, "replies": 26, "bookmarks": 2581, "views": 94553, "date": "2026-08-29 00:39", "url": "https://x.com/itsharmanjot/status/2093559174420652461", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQ3Q-J4bgAA4QK6.jpg", "width": 1866, "height": 2918}], "category": "Security"}, {"id": "2093637541572612188", "text": "created a lil site that turns a bouquet into a qr code\n\nhad so much fun messing around with three.js, thinking about which flower to add next 👀 https://t.co/gpWuOXnlKL", "author": "ann_nnng", "authorName": "Ann Nguyen", "authorImage": "https://pbs.twimg.com/profile_images/2091330595632861184/QKmUwPaL_normal.jpg", "likes": 5483, "retweets": 334, "replies": 116, "bookmarks": 2860, "views": 2241075, "date": "2026-08-29 05:51", "url": "https://x.com/ann_nnng/status/2093637541572612188", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2093636820399779840/vid/avc1/2678x1480/yqQRt9e916Kzh9qN.mp4?tag=29", "width": 2678, "height": 1480}], "category": "Design & Code"}, {"id": "2093677547485794308", "text": "I’m convinced mathematics is taught wrong. Its beauty is buried under technical jargon and lifeless formulas when it should be clear, visual and practical. My mission is to get you fluent in the math that will still be useful in 50 years.\n\nStart here: https://t.co/7anugoK3U1", "author": "TivadarDanka", "authorName": "Tivadar Danka", "authorImage": "https://pbs.twimg.com/profile_images/1360155656557363201/eqb9M0QA_normal.jpg", "likes": 1448, "retweets": 159, "replies": 15, "bookmarks": 1727, "views": 60828, "date": "2026-08-29 08:30", "url": "https://thepalindrome.org/p/the-palindrome-library", "media": [], "category": "Other"}, {"id": "2093628563693944889", "text": "Today is a very historical moment for AI video generation\n\nYou can now generate AI video faster than you can watch it\n\nBefore it'd take let's say 2-5 minutes to generate 15 seconds of video\n\n@fal made a post-trained Minimax H3 variant called Max which is 50x faster than the original but still maintains quality\n\nIt generates 15 seconds of video in 9 seconds!\n\nThat means you can now do new things like build a perpetual livestream with it that never ends!", "author": "levelsio", "authorName": "@levelsio", "authorImage": "https://pbs.twimg.com/profile_images/2077111020305162240/PwddgOau_normal.jpg", "likes": 15220, "retweets": 1068, "replies": 145, "bookmarks": 10790, "views": 2493902, "date": "2026-08-29 05:15", "url": "https://x.com/levelsio/status/2093628563693944889", "media": [], "category": "Vibe Coding"}, {"id": "2092551769243185177", "text": "Google is doing some great AI work in India that is actually helping farmers on the ground and honestly, almost nobody is talking about it.\n\nIt’s surprising how much we focus on every new model drop, while some of the most meaningful AI work is happening quietly in the real world.\n\nGoogle DeepMind’s AnthroKrishi team built two AI models using satellite imagery:\n\n- Agricultural Landscape Understanding (ALU) maps farm boundaries, trees and water bodies, with historical data going back 15 years.\n- Agricultural Monitoring & Event Detection (AMED) uses multispectral data to monitor crops, sowing and harvesting, identifying 11 major crops.\n\nAnd this is already being used at scale:\n\n- 5M+ farmers in Telangana through its agricultural DPI\n- 140M+ hectares covered by Terrastack\n- 2.6M hectares of irrigated land in Karnataka\n- CarbonFarm is using it across 12 countries\n- FAO is integrating the models into its global agricultural data platform with $2.5M from Google\n\nThese models are now providing agricultural insights across 6 African countries, and the Agricultural Landscape Understanding layer is one of the most popular layers on Google Earth globally.", "author": "ai_for_success", "authorName": "AshutoshShrivastava", "authorImage": "https://pbs.twimg.com/profile_images/1687401026805256192/uQ1o2wVQ_normal.jpg", "likes": 348, "retweets": 41, "replies": 16, "bookmarks": 165, "views": 59356, "date": "2026-08-26 05:56", "url": "https://x.com/ai_for_success/status/2092551769243185177", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2092551705674301441/vid/avc1/2560x1300/uFRXQy-Jd4PWLJUY.mp4?tag=29", "width": 2560, "height": 1300}], "category": "Design & Code"}, {"id": "2091967294582727005", "text": "This is an insane example of how far cheap coding models are getting.\n\nChiro used MiniMax-M3 to help expand this open-source Three.js VFX sandbox, and the technical stack is wild:\n\n→ custom GLSL shaders\n→ procedural geometry\n→ GPU particle systems\n→ real-time portals and spell effects\n→ 10 abilities/boosts\n→ live controls for basically everything\n\nYou can literally pause an explosion or spell mid-frame and reshape its geometry, timing and appearance with sliders.\n\nThat last part broke my brain a little.\n\nThis isn’t a collection of pre-rendered effects. It’s a programmable VFX system running in the browser.\n\nhttps://t.co/pk4igbGvX3\n\n https://t.co/BtJ8Hq5uim", "author": "TokenGremlin", "authorName": "Token Gremlin", "authorImage": "https://pbs.twimg.com/profile_images/2073095799462940672/YKuJiTq7_normal.jpg", "likes": 198, "retweets": 16, "replies": 7, "bookmarks": 297, "views": 26067, "date": "2026-08-24 15:14", "url": "https://x.com/TokenGremlin/status/2091967294582727005", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091854307096186880/vid/avc1/1920x1080/BoYRDRhwuWDYyEQD.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Design & Code"}, {"id": "2092250905655812121", "text": "i finally cracked frontend design with AI... without using any skill\n\nfrontend needs taste to not look like slop, and i'm more of an engineer than an artist, so i'm genuinely bad at it\n\nmy way around it: collecting inspirations and modules from other people, building a lego of components\n\nresources you can send to your agents:\n- https://t.co/7CUfh1jSmr\n- https://t.co/hKiKiyjLd8\n- https://t.co/XMkWlWenQv\n- https://t.co/k3p8MhfvCj\n- https://t.co/PTkhqaLgU7\n\nit's VERY easy for agents to edit components once they have the code\n\nyou send the link, your agent fetches the full list of components, then you ask it to find the best way to integrate them into your frontend foundation\n\nthe easiest way i found to make your UI/UX drastically better without being a genius designer", "author": "EXM7777", "authorName": "Machina", "authorImage": "https://pbs.twimg.com/profile_images/1922574051580563456/-OFXIxnm_normal.jpg", "likes": 6595, "retweets": 373, "replies": 134, "bookmarks": 17429, "views": 1135997, "date": "2026-08-25 10:01", "url": "https://x.com/EXM7777/status/2092250905655812121", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQkrHCBa8AAKVtP.jpg", "width": 959, "height": 1016}], "category": "Design & Code"}, {"id": "2092242135504552118", "text": "I genuinely don't have any words for this 🤯\n\nJust ONE image of a robotic bee and somehow got this incredibly gooood 3D model with great topology.\n\nNo prompt. No rework. No retries. Nothing else.\n\nThis kind of thing could have taken weeks of modeling, retopology and iteration. Or maybe more. Damnn\n\nNow anyone with a crazy enough idea can just make beautiful things. Anyone. \n\nThat honestly feels insane. What a time to be alive!!", "author": "thebuggeddev", "authorName": "The Bugged Dev", "authorImage": "https://pbs.twimg.com/profile_images/1956770434260910080/xVO3sbPP_normal.jpg", "likes": 723, "retweets": 62, "replies": 49, "bookmarks": 635, "views": 53992, "date": "2026-08-25 09:26", "url": "https://x.com/thebuggeddev/status/2092242135504552118", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2092239768310685696/vid/avc1/2940x1846/GInDgYtwO-NP3lBh.mp4?tag=29", "width": 2940, "height": 1846}], "category": "Design & Code"}, {"id": "2092158857032433869", "text": "Found a fun way to generate QR codes that don’t look like QR codes.\n\n- Enter a URL and it grows a 3D tree from the code itself\n- The ground grid is the actual scannable QR\n- Switch between Spring, Summer, and Autumn looks\n- Runs fully in the browser, nothing uploaded\n- Tap the tree to flatten it and scan\n\nhttps://t.co/133ukElFea", "author": "Manixh02", "authorName": "Manish Kumar", "authorImage": "https://pbs.twimg.com/profile_images/2063627005753778176/JVC810VY_normal.jpg", "likes": 17360, "retweets": 1824, "replies": 223, "bookmarks": 10253, "views": 1095021, "date": "2026-08-25 03:55", "url": "https://x.com/Manixh02/status/2092158857032433869", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2092158830365052928/vid/avc1/1280x700/C0o4SiXWSjbM4N1J.mp4?tag=29", "width": 1280, "height": 700}], "category": "Design & Code"}, {"id": "2091906740409553036", "text": "I ran the same task on Claude Code and DeepSeek's new agent harness. One cost $150. The other cost $2.\n Today we're launching https://t.co/twx6etZb3X (@agentsky_dev), the \"OpenRouter for Agents\" — one API → Claude Code, Codex, DeepSeek, Kimi, OpenCode, and every major agent in the cloud.  \nAnd Agent Playground on top: race them on your own task, with your real tools (GitHub, Gmail, more), side by side in a browser: time, cost, tokens burnt.  \n\nGuess which one was $2.", "author": "quxiaoyin", "authorName": "Xiaoyin Qu", "authorImage": "https://pbs.twimg.com/profile_images/1683592007875436544/P0kykGvV_normal.jpg", "likes": 1258, "retweets": 214, "replies": 233, "bookmarks": 1183, "views": 2227523, "date": "2026-08-24 11:13", "url": "http://AgentSky.dev", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091906447902916608/vid/avc1/1920x1080/8QNiQjN278bHcKet.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Vibe Coding"}, {"id": "2091873880809885894", "text": "Dotted Countdown by davidope https://t.co/y8MBOjR6ja", "author": "recentdesign", "authorName": "Recent", "authorImage": "https://pbs.twimg.com/profile_images/2064989708435050496/xNgZCa7g_normal.jpg", "likes": 5370, "retweets": 385, "replies": 49, "bookmarks": 1496, "views": 413998, "date": "2026-08-24 09:02", "url": "https://x.com/recentdesign/status/2091873880809885894", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091873853874032640/vid/avc1/1080x1080/iSaL15VowNbGSLLQ.mp4?tag=29", "width": 1080, "height": 1080}], "category": "Design & Code"}, {"id": "2091972446546997681", "text": "This is one of the coolest VR experiences I’ve seen in a while. It lets you and your friends build wild tracks together and then race on them to see who finishes first, all from within the same room. https://t.co/0HTqC7LHFP", "author": "nathie", "authorName": "Nathie", "authorImage": "https://pbs.twimg.com/profile_images/1567608510497652736/TvoiS4g6_normal.jpg", "likes": 2050, "retweets": 235, "replies": 62, "bookmarks": 598, "views": 256009, "date": "2026-08-24 15:34", "url": "https://x.com/nathie/status/2091972446546997681", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091972382428667905/vid/avc1/720x720/u5anhEj50sEC7ndE.mp4?tag=29", "width": 720, "height": 720}], "category": "Design & Code"}, {"id": "2091965052517597453", "text": "imma make the entire city skateable", "author": "eboueteatime", "authorName": "Udd", "authorImage": "https://pbs.twimg.com/profile_images/2073130385274540032/_YrcC7MG_normal.jpg", "likes": 3, "retweets": 0, "replies": 0, "bookmarks": 1, "views": 149, "date": "2026-08-24 15:05", "url": "https://x.com/eboueteatime/status/2091965052517597453", "media": [], "category": "Design & Code"}, {"id": "2091948930124947941", "text": "14 days. Unlimited building. ⚡\n\nFrom Aug 24–Sep 6, get unlimited access to MiniMax M3 and M2.7 on @gmi_cloud—plus Speech 2.8 and Music 3.0.\n\nStart building on GMI Cloud. What will you create? 👇", "author": "MiniMax_AI", "authorName": "MiniMax (official)", "authorImage": "https://pbs.twimg.com/profile_images/1875100548535574529/VxHk9HyU_normal.jpg", "likes": 2030, "retweets": 171, "replies": 73, "bookmarks": 1723, "views": 268755, "date": "2026-08-24 14:01", "url": "https://x.com/MiniMax_AI/status/2091948930124947941", "media": [], "category": "Design & Code"}, {"id": "2091917895689273843", "text": "you can just make music with claude btw https://t.co/9l0QrEynPZ", "author": "ozzyxs1a", "authorName": "ozzy", "authorImage": "https://pbs.twimg.com/profile_images/2089825762324963328/UA4lQCLt_normal.jpg", "likes": 2301, "retweets": 140, "replies": 57, "bookmarks": 1655, "views": 164941, "date": "2026-08-24 11:57", "url": "https://x.com/ozzyxs1a/status/2091917895689273843", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091917760766889984/vid/avc1/3840x2160/chG9v6-GQTCWoS5G.mp4?tag=29", "width": 3840, "height": 2160}], "category": "Other"}, {"id": "2091954190067363888", "text": "Today I learned about Entity Stacking.\n\nIf you put these links in your Organisation schema under `sameAs`, Google will understand who the fuck you are far better than with 300 junk directory listings - and it’s free.\n\nCheers, @Charles_SEO 🎩 https://t.co/3kkkw8TcpD", "author": "tarasshyn", "authorName": "Taras", "authorImage": "https://pbs.twimg.com/profile_images/2020169408149131264/RnfNmmpo_normal.jpg", "likes": 1307, "retweets": 45, "replies": 30, "bookmarks": 2663, "views": 98015, "date": "2026-08-24 14:22", "url": "https://x.com/tarasshyn/status/2091954190067363888", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQbTdvWXMAAq9uO.jpg", "width": 1920, "height": 1440}], "category": "Other"}, {"id": "2091897900800635319", "text": "Starting today, every free account can verify 3 domains.\n\nAny region. Free for everyone. https://t.co/UkKb3sJ5JR", "author": "resend", "authorName": "Resend", "authorImage": "https://pbs.twimg.com/profile_images/2114772249052069888/KEjhjHhR_normal.jpg", "likes": 823, "retweets": 45, "replies": 55, "bookmarks": 215, "views": 76800, "date": "2026-08-24 10:38", "url": "https://x.com/resend/status/2091897900800635319", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQfqDcubUAEYkeb.jpg", "width": 1920, "height": 1008}], "category": "Other"}, {"id": "2091608381236596846", "text": "You can just use @Cloudflare to make inboxes for your Grok @bot \ncheck out @thomasgauvin 's agentic inbox repo https://t.co/juX5zk97eG", "author": "ethantroy", "authorName": "Ethan Troy", "authorImage": "https://pbs.twimg.com/profile_images/2109481437002928128/6fi4NqoO_normal.jpg", "likes": 163, "retweets": 11, "replies": 13, "bookmarks": 280, "views": 21107, "date": "2026-08-23 15:27", "url": "https://x.com/ethantroy/status/2091608381236596846", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQbiS-MXsAAQyHX.jpg", "width": 3200, "height": 1960}], "category": "Design & Code"}, {"id": "2091008998275453346", "text": "Google is basically a job board if you know the right search operators. 👀\n\nTry:\n\n\"site:https://t.co/cPuLV5VVQT \"Your Role\"\"\n\nInstantly uncover Ashby job postings that most people never search for... https://t.co/PWmR1TvHLe", "author": "_vmlops", "authorName": "Vaishnavi", "authorImage": "https://pbs.twimg.com/profile_images/2017673694068543493/h06eTOL0_normal.jpg", "likes": 601, "retweets": 51, "replies": 14, "bookmarks": 918, "views": 27928, "date": "2026-08-21 23:46", "url": "http://jobs.ashbyhq.com", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQTBmS0bwAAo-s9.jpg", "width": 1843, "height": 546}], "category": "Other"}, {"id": "2091620859907850652", "text": "In March 2026, I started on a TUI-based music player called cliamp. It was made as a tribute to Winamp, which we all love.\n\nI gained traction on my first post, which was really shitty compared to what I can do now, but nostalgia kicked in.\n\nIt was a few months ago, included as the default Omarchy TUI music player.\n\ncliamp has separate providers, like\n- Spotify\n- YouTube Music\n- Jellyfin\n- SSH streaming\n- Local streaming\n- 30k+ radio channels\n- And much more\n\nIt can run in daemon mode (no tui), it has IPC to be controlled by and from whatever you want, a full cli.\n\nThe cliamp radio channel has exploded, and in the last seven days it has had around 115,000 sessions in total.\n\nThe goal is to make cliamp even better, so I am working on the architecture. E.g., better IPC, so you can run it in daemon mode and build what you want on top of it to control it.\n\nI am also working on a GUI version that will use the IPC, as many have requested a GUI.\n\nAnyways, here's a short video of cliamp. It is pretty. It might not be the best UX to use yet, but it is the prettiest TUI music player out there.\n\nThanks", "author": "iamdothash", "authorName": "Bjarne Øverli", "authorImage": "https://pbs.twimg.com/profile_images/2106775124200325120/Spz2szEH_normal.jpg", "likes": 2455, "retweets": 164, "replies": 123, "bookmarks": 711, "views": 107609, "date": "2026-08-23 16:17", "url": "https://x.com/iamdothash/status/2091620859907850652", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091620714046521344/vid/avc1/2880x1800/xUSn_zyJcqB6vgdU.mp4?tag=29", "width": 2880, "height": 1800}], "category": "Terminals"}, {"id": "2091448491381801130", "text": "Please Don’t overcomplicate it. \n\n• Build a Password Manager to learn file handling, hashing (not full crypto)\n• Build a URL Shortener to understand routing, IDs, and persistence\n• Build a Todo App with deadlines to practice CRUD and basic state\n• Build a Web Scraper to learn requests, parsing, and rate limits\n• Build a CLI Expense Tracker to master logic, files, and edge cases\n• Build a Log Analyzer to work with files, timestamps, and patterns\n• Build a Simple Recommender using similarity rules (not ML magic)\n• Build an Email Automation Script using SMTP and scheduling\n\nPROJECTS. Not tutorials.", "author": "ashuuu_soft", "authorName": "Ashuuu🧚‍♀️", "authorImage": "https://pbs.twimg.com/profile_images/2093619554429833216/-MZMVFpM_normal.jpg", "likes": 1598, "retweets": 105, "replies": 10, "bookmarks": 2186, "views": 69171, "date": "2026-08-23 04:52", "url": "https://x.com/ashuuu_soft/status/2091448491381801130", "media": [], "category": "Terminals"}, {"id": "2091446099752206574", "text": "“A human being should be able to change a diaper, plan an invasion, butcher a hog, conn a ship, design a building, write a sonnet, balance accounts, build a wall, set a bone, comfort the dying, take orders, give orders, cooperate, act alone, solve equations, analyze a new problem, pitch manure, program a computer, cook a tasty meal, fight efficiently, die gallantly. Specialization is for insects.”\n\n— Robert A. Heinlein", "author": "Naturalphilosy", "authorName": "Natural Philosophy", "authorImage": "https://pbs.twimg.com/profile_images/1994926371806810112/HS-SaOU4_normal.jpg", "likes": 1090, "retweets": 273, "replies": 48, "bookmarks": 318, "views": 31249, "date": "2026-08-23 04:43", "url": "https://x.com/Naturalphilosy/status/2091446099752206574", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQZPJAba4AAsd-B.jpg", "width": 470, "height": 561}], "category": "Design & Code"}, {"id": "2091425355714462042", "text": "A wall installed with prisms suddenly feels like a good idea. https://t.co/pqanJQ8VAa", "author": "inertiaaaaaa", "authorName": "Cat Woman", "authorImage": "https://pbs.twimg.com/profile_images/1897332823976996864/-9nWk0mw_normal.jpg", "likes": 9947, "retweets": 1152, "replies": 54, "bookmarks": 2379, "views": 250582, "date": "2026-08-23 03:20", "url": "https://x.com/inertiaaaaaa/status/2091425355714462042", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091425261011251200/vid/avc1/720x1280/EwMpiGqQnbvp3kj7.mp4?tag=29", "width": 720, "height": 1280}], "category": "Design & Code"}, {"id": "2091269489014853634", "text": "https://t.co/q4uYMHCO3X", "author": "maxyourenergy", "authorName": "The High Energy Journal", "authorImage": "https://pbs.twimg.com/profile_images/1927362674192449536/KNEitDsy_normal.jpg", "likes": 2690, "retweets": 208, "replies": 7, "bookmarks": 1284, "views": 53729, "date": "2026-08-22 17:01", "url": "https://x.com/maxyourenergy/status/2091269489014853634", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQWugvAXgAAxP5X.jpg", "width": 1179, "height": 920}], "category": "Other"}, {"id": "2091573858553786807", "text": "a very literal example of giving a small computer eyes\n\na Raspberry Pi in a moving car is turning the road into a live list of objects\n\neach vehicle gets a label, a bounding box, and a confidence score as it appears in the camera feed\n\nthe useful loop is simple:\n\ncamera frame → vision result → local rule → physical or network action\n\nthe same pattern can run on a much smaller board. my ESP32 vision guide starts with the camera, then shows how to turn what it sees into a reaction\n\ngive your ESP32 eyes", "author": "ardchain", "authorName": "ard", "authorImage": "https://pbs.twimg.com/profile_images/2106500468234936320/-cJ4GfEh_normal.jpg", "likes": 1746, "retweets": 207, "replies": 22, "bookmarks": 1480, "views": 179872, "date": "2026-08-23 13:10", "url": "https://x.com/ardchain/status/2091573858553786807", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091573478633676800/vid/avc1/720x1280/GjltQJ8D973Srjjo.mp4?tag=29", "width": 720, "height": 1280}], "category": "Design & Code"}, {"id": "2091502146449740149", "text": "How many of you actually know how \"what you eat\" grows? 🤔\n\nI never learned crop science in school. I learned it by walking around our farm with my father, who showed me different crops and explained how they grow.\n\nBut not everyone has access to a farm, so I built a 3D Crop Science application in @threejs using Claude Opus 5 to make that learning experience more visual and interactive.\n\nIt is an exploration of different types of seeds where each seed has three different stages. \n\nThe first stage shows the whole seed. The second stage is a cross section that shows what is inside the seed and how it grows. \n\nThe third stage shows the germination phase through a 3D model.\n\nThere are 24 models in total. The original models were 1,349.6 MB, which Claude optimized down to just 11.6 MB in total. All of the 3D models were generated using @tripoai.\n\nClaude also created visual information for each seed showing details like seed type, storage tissue and germination phase. Each seed also has a YouTube video that shows how it actually grows in the real world.\n\nThere is also a section showing where each seed is commonly grown using both a 3D globe and a flat map. You can explore different regions and click on specific areas to see more information about where that seed is grown.\n\nThe entire experience is fully responsive and also includes quizzes that you can take in both normal and 3D formats.\n\nI strongly believe education becomes much more effective when you can see, interact, watch and explore instead of relying only on textbooks.\n\nLive: https://t.co/TSYTrjj7qf\nCode: https://t.co/qdXeDFHtOZ", "author": "thebuggeddev", "authorName": "The Bugged Dev", "authorImage": "https://pbs.twimg.com/profile_images/1956770434260910080/xVO3sbPP_normal.jpg", "likes": 977, "retweets": 123, "replies": 30, "bookmarks": 875, "views": 46213, "date": "2026-08-23 08:25", "url": "https://x.com/thebuggeddev/status/2091502146449740149", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091491487632740352/vid/avc1/2940x1846/KCjxj1fHFjGiAyFQ.mp4?tag=29", "width": 2940, "height": 1846}], "category": "Vibe Coding"}, {"id": "2091265597237608664", "text": "This is by far the best web design Claude skill I've ever used.\n\nLinked in the replies. https://t.co/8YfLJJ0nE8", "author": "nateherk", "authorName": "Nate Herk", "authorImage": "https://pbs.twimg.com/profile_images/2046419318918037504/GFSBxbxy_normal.jpg", "likes": 1570, "retweets": 130, "replies": 43, "bookmarks": 3633, "views": 234385, "date": "2026-08-22 16:45", "url": "https://x.com/nateherk/status/2091265597237608664", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2091265448935403520/vid/avc1/1920x1080/vtqUT2bpN4w3oElt.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Design & Code"}, {"id": "2091206035050766523", "text": "Imagine going to Costco for a hot dog and a Coke and coming home with a $3,000 sauna. https://t.co/PZCDdQTF7s", "author": "InvestingAddict", "authorName": "Investing Addict", "authorImage": "https://pbs.twimg.com/profile_images/2032195449390759937/dQtkR_Jr_normal.jpg", "likes": 25681, "retweets": 588, "replies": 705, "bookmarks": 1179, "views": 2027427, "date": "2026-08-22 12:49", "url": "https://x.com/InvestingAddict/status/2091206035050766523", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HQV0zc5a4AAc84o.jpg", "width": 2048, "height": 1840}], "category": "Other"}, {"id": "2091146828137791887", "text": "Bir Kere Girince Saatlerce Çıkamayacağınız 50 Site\n\n1.) 'https://t.co/FDTmt38jKw' — Dünyayı canlı uydu görüntüsüyle izleme\n2.) 'https://t.co/Tytazsp6y2' — Şu an gökyüzündeki her uçağı görme\n3.) 'https://t.co/b8trMj1vUi' — Denizdeki tüm gemileri anlık takip\n4.) 'https://t.co/EYzDYh0BqF' — Rüzgar ve fırtınaların c
