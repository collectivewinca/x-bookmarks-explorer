<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@shinydiscobear Bookmarks Explorer</title>
    <meta name="description" content="Explore 200 curated bookmarks from @shinydiscobear with filtering, images, and cards">
    <style>
        :root {
            --paper: #0a0a0a;
            --card: #141414;
            --accent: #ff6b35;
            --accent-2: #00d4ff;
            --text: #e0e0e0;
            --text-soft: #8a8a8a;
            --border: #2a2a2a;
            --border-hover: #404040;
            --radius: 12px;
            --shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, sans-serif;
            background: var(--paper);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
        }
        
        header {
            padding: 2rem;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            background: var(--paper);
            z-index: 100;
        }
        .header-content { max-width: 1400px; margin: 0 auto; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; font-weight: 700; }
        .subtitle { color: var(--text-soft); font-size: 1rem; }
        
        .filters {
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            background: var(--paper);
        }
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }
        .filter-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .filter-group label { font-size: 0.75rem; color: var(--text-soft); text-transform: uppercase; letter-spacing: 0.05em; }
        .filter-group input, .filter-group select {
            padding: 0.5rem 0.75rem; border: 1px solid var(--border); border-radius: 6px;
            background: var(--card); color: var(--text); font-size: 0.9rem;
        }
        .filter-group input:focus, .filter-group select:focus { outline: none; border-color: var(--accent); }
        .filter-actions { display: flex; gap: 1rem; margin-top: 1rem; justify-content: flex-end; }
        
        main { padding: 2rem; max-width: 1400px; margin: 0 auto; }
        .controls { display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center; }
        .view-toggle {
            display: flex; gap: 0.5rem; background: var(--card); padding: 0.25rem; border-radius: 8px;
        }
        .view-btn {
            padding: 0.5rem 1rem; border: none; background: transparent; color: var(--text-soft);
            cursor: pointer; border-radius: 4px; font-size: 0.85rem;
        }
        .view-btn.active { background: var(--accent); color: white; }
        .results-count { color: var(--text-soft); font-size: 0.9rem; margin-left: auto; }
        
        .bookmarks-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.5rem; }
        .bookmarks-container.list { grid-template-columns: 1fr; }
        
        .card {
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 1.5rem; transition: all 0.2s ease; animation: fadeIn 0.3s ease forwards;
        }
        .card:hover { border-color: var(--border-hover); transform: translateY(-2px); box-shadow: var(--shadow); }
        .card-header { display: flex; align-items: flex-start; gap: 0.75rem; margin-bottom: 1rem; }
        .card-avatar {
            width: 48px; height: 48px; border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: flex; align-items: center; justify-content: center;
            font-size: 1rem; font-weight: 700; flex-shrink: 0;
        }
        .card-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .card-author-info { flex: 1; min-width: 0; }
        .card-author { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-handle { color: var(--text-soft); font-size: 0.85rem; }
        .card-date { color: var(--text-soft); font-size: 0.8rem; margin-left: auto; white-space: nowrap; }
        
        .card-text { font-size: 0.95rem; line-height: 1.6; margin-bottom: 1rem; color: var(--text); word-wrap: break-word; }
        .card-media { margin: 1rem 0; border-radius: 8px; overflow: hidden; }
        .card-media img { width: 100%; max-height: 300px; object-fit: cover; }
        
        .card-meta {
            display: flex; gap: 1rem; color: var(--text-soft); font-size: 0.85rem;
            padding-top: 1rem; border-top: 1px solid var(--border); margin-top: 1rem;
            flex-wrap: wrap;
        }
        .meta-item { display: flex; align-items: center; gap: 0.25rem; }
        
        .card-actions { display: flex; gap: 0.75rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
        .btn {
            padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.85rem; cursor: pointer;
            border: none; font-weight: 500; text-decoration: none;
            display: inline-flex; align-items: center; gap: 0.5rem; transition: all 0.2s ease;
        }
        .btn-primary { background: var(--accent); color: white; }
        .btn-primary:hover { background: var(--accent-2); transform: translateY(-1px); }
        .btn-secondary { background: var(--card); color: var(--text); border: 1px solid var(--border); }
        .btn-secondary:hover { background: var(--border); }
        
        .category-badge {
            display: inline-block; padding: 0.25rem 0.75rem; border-radius: 20px;
            font-size: 0.75rem; font-weight: 500; color: white; margin-top: 1rem;
        }
        .category-badge.design { background: linear-gradient(135deg, #ff6b35, #ff8c42); }
        .category-badge.game { background: linear-gradient(135deg, #00d4ff, #0099cc); }
        .category-badge.vibe { background: linear-gradient(135deg, #a855f7, #8b5cf6); }
        .category-badge.security { background: linear-gradient(135deg, #ef4444, #dc2626); }
        .category-badge.terminals { background: linear-gradient(135deg, #10b981, #059669); }
        .category-badge.other { background: linear-gradient(135deg, #6b7280, #4b5563); }
        
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-soft); grid-column: 1 / -1; }
        
        @media (max-width: 768px) {
            header { padding: 1rem; }
            .filters { padding: 1rem; }
            .filter-grid { grid-template-columns: 1fr 1fr; }
            main { padding: 1rem; }
            .bookmarks-container { grid-template-columns: 1fr; }
            .controls { flex-wrap: wrap; }
            .results-count { margin-left: 0; order: 3; width: 100%; text-align: center; margin-top: 0.5rem; }
        }
        @media (max-width: 480px) { .filter-grid { grid-template-columns: 1fr; } h1 { font-size: 1.5rem; } }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>@shinydiscobear Bookmarks Explorer</h1>
            <p class="subtitle">200 curated bookmarks with images, cards, and filters</p>
        </div>
    </header>
    
    <div class="filters">
        <div class="filter-grid">
            <div class="filter-group">
                <label>Search</label>
                <input type="text" id="searchInput" placeholder="Search bookmarks...">
            </div>
            <div class="filter-group">
                <label>Category</label>
                <select id="categoryFilter">
                    <option value="">All Categories</option>
                    <option value="Design & Code">Design & Code</option>
                    <option value="Game Development">Game Development</option>
                    <option value="Vibe Coding">Vibe Coding</option>
                    <option value="Security">Security</option>
                    <option value="Terminals">Terminals</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Author</label>
                <select id="authorFilter">
                    <option value="">All Authors</option>
                </select>
            </div>
            <div class="filter-group">
                <label>Sort By</label>
                <select id="sortBy">
                    <option value="date-desc">Date (Newest)</option>
                    <option value="date-asc">Date (Oldest)</option>
                    <option value="likes-desc">Likes (High to Low)</option>
                    <option value="likes-asc">Likes (Low to High)</option>
                    <option value="bookmarks-desc">Bookmarks (High to Low)</option>
                    <option value="bookmarks-asc">Bookmarks (Low to High)</option>
                </select>
            </div>
        </div>
        <div class="filter-actions">
            <button class="btn btn-secondary" onclick="resetFilters()">Reset</button>
        </div>
    </div>
    
    <main>
        <div class="controls">
            <div class="view-toggle">
                <button class="view-btn active" data-view="grid" onclick="toggleView(this)">Grid</button>
                <button class="view-btn" data-view="list" onclick="toggleView(this)">List</button>
            </div>
            <span class="results-count" id="resultsCount">0 results</span>
        </div>
        <div id="bookmarks" class="bookmarks-container"></div>
    </main>
    
    <script>
        const allBookmarks = [{"id": "2117456913466118485", "text": "FunFact:\n\nyou can even train these to model your handwriting", "author": "the_cia_hacker", "authorName": "Justin Liverman", "authorImage": "https://pbs.twimg.com/profile_images/1999981815185002496/LbeyRE6j_normal.jpg", "likes": 39, "retweets": 3, "replies": 4, "bookmarks": 11, "views": 1416, "date": "2026-11-02 22:20", "url": "https://x.com/the_cia_hacker/status/2117456913466118485", "media": [], "category": "Design & Code"}, {"id": "2116255899207819610", "text": "if you're building games with AI, here are my 3 tips;\n\n1. \"build your own engine\" for every specific thing\n\nwhen you say this to LLMs, they find the best ways suitable for them, and the output gets much better than regular prompting\n\n2. blend game genres and add your creativity\n\nthis is by far the best way you can come up with original games, that can become super popular thing\n\nAAA studios couldn't experiment much to not risk anything, but you can, and you should, as so many new game types will born out of this that will be better than you can imagine\n\n3. think like a gourmet chef, when vibe coding a game idea: it's all about mixing the ingredients properly\n\nyou have infinite freedom at your fingertips: all the ingredients, sauces, and materials to do whatever you dream of while vibe coding\n\nyou just gotta cook the recipe in such a way that what's served is just super fun and delicious\n\n-----\n\nbonus: whenever you wanna go for perfecting something, let the LLM build v1,v2, v3, v4, v5 \n\nwhile it is iterating on its own rubric in a custom-built engine it created for the specific thing you are looking to make more dope\n\nyou do this for different things, like combat, environment, characters, ambiance, post-processing, SFX etc, you'll see great results on each and then blend of all that will be something quite magnificent\n\nthat's the play", "author": "meta_alchemist", "authorName": "Meta Alchemist", "authorImage": "https://pbs.twimg.com/profile_images/2100871727282843648/4D7rectJ_normal.jpg", "likes": 112, "retweets": 5, "replies": 42, "bookmarks": 39, "views": 5665, "date": "2026-10-30 15:48", "url": "https://x.com/meta_alchemist/status/2116255899207819610", "media": [], "category": "Game Development"}, {"id": "2115738391467946090", "text": "GitHub is a goldmine for game developers.\n\nI found 10 insane repos that can help you build AAA-style games using Claude Code and Codex.\n\nBookmark this for later:\n\n1. Jolt Physics\n\nThe physics library used in Horizon Forbidden West and Death Stranding 2. Add rigid bodies, collisions, and believable physical interactions to your game.\n\nhttps://t.co/uShaht0fDH\n\n2. Terrain3D\n\nBuild massive landscapes in Godot. Sculpt mountains, paint terrain, import heightmaps, and add foliage with multiple levels of detail.\n\nhttps://t.co/3mdcZ7VVYX\n\n3. Material Maker\n\nCreate procedural textures and paint directly onto 3D models. Build materials through visual nodes instead of making every texture from scratch.\n\nhttps://t.co/1tLhPSuvlR\n\n4. Effekseer\n\nCreate particle effects for explosions, magic spells, combat, and environments. Export them as 2D animations or integrate 3D effects into your engine.\n\nhttps://t.co/tz3HsjWXvt\n\n5. Voxel Tools for Godot\n\nBuild worlds players can dig through and destroy. Supports caves, tunnels, overhangs, and terrain that streams as players explore.\n\nhttps://t.co/KeW59rEcOx\n\n6. Recast Navigation\n\nHelp enemies and NPCs navigate your levels. Generate navigation meshes, calculate paths, and simulate crowds with collision avoidance.\n\nhttps://t.co/f8vliMkUQI\n\n7. ozz-animation\n\nLoad, play, and blend character animations. A performance-focused library for building smooth movement into your own engine.\n\nhttps://t.co/Aea6xTwX1x\n\n8. The Forge\n\nBuilding a custom engine? Start with cross-platform graphics infrastructure, resource loading, and animation systems instead of writing everything yourself.\n\nhttps://t.co/y4ZNj1PwEJ\n\n9. meshoptimizer\n\nDetailed models can crush performance. Optimize, simplify, and compress your meshes to make assets smaller and more efficient to render.\n\nhttps://t.co/0hXd6tUAAx\n\n10. FastNoise2\n\nBuild procedural terrain and texture generators. Combine noise patterns in a visual node editor, then load those setups into your game.\n\nhttps://t.co/lfKVcH3JDs\n\nGive Claude Code or Codex the relevant docs and ask it to help integrate the systems your project needs.\n\nWhat did I miss?", "author": "heyrimsha", "authorName": "Rimsha Bhardwaj", "authorImage": "https://pbs.twimg.com/profile_images/2090372940781228032/IEKqCyX3_normal.jpg", "likes": 4920, "retweets": 432, "replies": 52, "bookmarks": 10064, "views": 269576, "date": "2026-10-29 05:31", "url": "https://x.com/heyrimsha/status/2115738391467946090", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVyc2ZCacAEoGIy.png", "width": 672, "height": 736}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVyc2jraUAAHb9d.png", "width": 668, "height": 747}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVyc2unagAAomwb.png", "width": 662, "height": 779}], "category": "Game Development"}, {"id": "2114433325263933447", "text": "@divyansh_1729 https://t.co/bLXqhRWHzm", "author": "Spidey_707", "authorName": "SPIDEY", "authorImage": "https://pbs.twimg.com/profile_images/2035638999851909120/btI8SKjc_normal.jpg", "likes": 111, "retweets": 8, "replies": 2, "bookmarks": 391, "views": 85414, "date": "2026-10-25 15:06", "url": "https://Spydex.vercel.app", "media": [], "category": "Other"}, {"id": "2114400113515012360", "text": "nerds, thank me later...\nhttps://t.co/06bNZA1R3D", "author": "divyansh_1729", "authorName": "divyansh", "authorImage": "https://pbs.twimg.com/profile_images/2033183657842933760/DbiKuIUn_normal.jpg", "likes": 15604, "retweets": 1299, "replies": 118, "bookmarks": 51197, "views": 2502800, "date": "2026-10-25 12:54", "url": "https://systemdesign.io", "media": [], "category": "Other"}, {"id": "2114778095697662251", "text": "introducing ghosthand\n\nit lets your agents use a real iPhone plugged into your Mac. for agents &amp; humans\n\nthe agent sees the screen over USB and taps, swipes and types over Bluetooth, so it can use any app on the phone, even the ones with no API\n\ntry it at https://t.co/8WUcuaJV5n https://t.co/xk2ZZpvjn1", "author": "__morse", "authorName": "Tommy D. Rossi", "authorImage": "https://pbs.twimg.com/profile_images/1870480870567514112/Y0D-zTEY_normal.jpg", "likes": 787, "retweets": 17, "replies": 46, "bookmarks": 1122, "views": 49168, "date": "2026-10-26 13:56", "url": "https://ghosthand.dev", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2114771779809837057/vid/avc1/1920x1080/N6ViWM0Nix3eiyoL.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Vibe Coding"}, {"id": "2114808259949613165", "text": "It's very useful to understand the context around something, how others perceive it, what influences it, etc.\n\nI have scraped together all evidence in chronological order, from prophecies before his time, to the surviving documents of his disciples enjoy\n\nhttps://t.co/DdF7PLVUGi", "author": "0xSero", "authorName": "0xSero", "authorImage": "https://pbs.twimg.com/profile_images/2111226379521892352/3ICUbYY6_normal.jpg", "likes": 1331, "retweets": 88, "replies": 70, "bookmarks": 970, "views": 34979, "date": "2026-10-26 15:55", "url": "https://github.com/0xSero/all-historical-evidence-of-jesus-christ", "media": [], "category": "Other"}, {"id": "2114672104021148033", "text": "GitHub is hiding an absolute GOLDMINE for AI filmmakers.\n\n10 open-source repos that can generate videos, animate photos, create cinematic scenes, and automate video editing.\n\nSome of these are ridiculously powerful.\n\nBookmark this:\n\n1. LTX-2\n\nGenerate video with synchronized audio. Includes tools for running the model and training LoRAs to customize your output.\n\nhttps://t.co/YY5CauxtxZ\n\n2. ComfyUI WanVideo Wrapper\n\nBuild visual workflows for video generation, photo animation, and camera control using supported Wan models inside ComfyUI.\n\nhttps://t.co/d0tsf21RNU\n\n3. CogVideoX\n\nTurn text prompts or reference images into video clips using the appropriate model. Useful for experimenting with scenes and visual concepts.\n\nhttps://t.co/ZOZV61iswU\n\n4. VACE\n\nGenerate and edit videos using reference images, existing footage, and masks. Combine different controls to guide what changes in your shot.\n\nhttps://t.co/6zWZsuyoQc\n\n5. DiffSynth-Studio\n\nRun video-generation models and experiment with image animation, camera movement, and model training in one toolkit.\n\nhttps://t.co/TCpg3j63SN\n\n6. MuseTalk\n\nMatch a face’s lip movements to your audio. Useful for dubbing, dialogue shots, and talking-character workflows.\n\nhttps://t.co/r2qgcEKfcW\n\n7. OpenChatCut\n\nEdit through conversation with a multitrack timeline. Connect AI agents through skills and MCP, then render with Remotion.\n\nhttps://t.co/utEGOA4Pgr\n\n8. FireRed-OpenStoryline\n\nDescribe your edit in plain language. Its AI agent plans the steps and coordinates editing tools, with reusable skills for consistent styling.\n\nhttps://t.co/maktqr5Sk8\n\n9. AutoSubs\n\nGenerate subtitles locally and connect them to DaVinci Resolve, Premiere Pro, or After Effects.\n\nhttps://t.co/wwfJ17C5vI\n\n10. Editly\n\nAutomate video assembly with reusable instructions. Combine clips, images, titles, transitions, and music through its command-line tool or API.\n\nhttps://t.co/Rx48ccKx7b\n\nWhich one are you trying first?", "author": "heyrimsha", "authorName": "Rimsha Bhardwaj", "authorImage": "https://pbs.twimg.com/profile_images/2090372940781228032/IEKqCyX3_normal.jpg", "likes": 708, "retweets": 83, "replies": 15, "bookmarks": 1322, "views": 40804, "date": "2026-10-26 06:54", "url": "https://x.com/heyrimsha/status/2114672104021148033", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVjTEPwa4AAc0TM.png", "width": 671, "height": 693}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVjTEbdbIAAu7IL.png", "width": 669, "height": 709}, {"type": "photo", "url": "https://pbs.twimg.com/media/HVjTEmhaMAEAIDs.png", "width": 667, "height": 738}], "category": "Game Development"}, {"id": "2114765449431077002", "text": "Introducing EveryApp (YC F26). Our mission: make every app open source.\n\nWe started with OpenSEO (24k GitHub stars). Now we're doing it for every app your business runs on.\n\nStar the project, try an app, or build your own 🧵 https://t.co/KCV17eMNHW", "author": "bensenescu", "authorName": "Ben", "authorImage": "https://pbs.twimg.com/profile_images/2024583854963429376/wg7pF8Qe_normal.jpg", "likes": 1134, "retweets": 75, "replies": 126, "bookmarks": 1502, "views": 201640, "date": "2026-10-26 13:05", "url": "https://x.com/bensenescu/status/2114765449431077002", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2114763908460507136/vid/avc1/1920x1080/APQeJciJ9A6jig5t.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Vibe Coding"}, {"id": "2114049200749175174", "text": "I designed all of these landing pages in the last two months, using @higgsfield , Claude, and Cursor with my custom AI designer skill.\n\nThe skill is open source: https://t.co/Gs1RT1BZxi https://t.co/XhWtFFoLNu", "author": "elayadesigns", "authorName": "Elaya", "authorImage": "https://pbs.twimg.com/profile_images/2066402050725027840/UAoYKzll_normal.jpg", "likes": 11151, "retweets": 619, "replies": 229, "bookmarks": 19703, "views": 871186, "date": "2026-10-24 13:39", "url": "https://github.com/elayadesign/ai-design-skills", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2114048823970643968/vid/avc1/1752x1080/zoo2YAjtfZQZ007L.mp4?tag=29", "width": 1752, "height": 1080}], "category": "Vibe Coding"}, {"id": "2114566418373251206", "text": "yup, i don't understand either, but will keep preaching", "author": "liu8in", "authorName": "Bin Liu", "authorImage": "https://pbs.twimg.com/profile_images/1627970921108742144/2U2CnUQj_normal.jpg", "likes": 41, "retweets": 2, "replies": 2, "bookmarks": 43, "views": 5824, "date": "2026-10-25 23:54", "url": "https://x.com/liu8in/status/2114566418373251206", "media": [], "category": "Design & Code"}, {"id": "2113671979081572512", "text": "Announcing Ikigai Grants:\n\nMicrogrants give early-stage, bootstrapped talent capital. But that’s not enough.\n\nI’ve watched too many grantees become perpetual microgrant chasers, wasting time applying to one $5k grant after another. Worse, most programs encourage this by funding the blanket “smart people doing cool things,” with no real conviction behind it.\n\nI wouldn’t be here without patronage from @tylercowen  & @jposhaughnessy. But looking back, the mentors & community were worth much more than the money.\n\nSo I built the program I always wished existed:\n- $50k total, avg. $5k check\n- Matched with mentors & community across @RenPhilanthropy , Fulcrum Science, and my personal network of founders, fund leads, investors & scientists.\n\nCohort 1 backs emerging talent in areas I believe are deeply underfunded and undervalued. Every application is reviewed by me.\n\nIkigai Grants is a program of @RenPhilanthropy, with support from Fulcrum Science. Advised by many wonderful friends & colleagues including: @AshleyNAbel  @RaianyRomanni @NeuroStats Bonnie EJ Maven @idatin @ashleyz413 @JackScannell13 \n\nApply by Nov 9th, 9a PST:\nhttps://t.co/DRuI0yJtLY", "author": "alexsaraki", "authorName": "Alex Araki", "authorImage": "https://pbs.twimg.com/profile_images/2053830557033742336/0lvR8xRV_normal.jpg", "likes": 1074, "retweets": 103, "replies": 51, "bookmarks": 1311, "views": 74506, "date": "2026-10-23 12:40", "url": "https://x.com/alexsaraki/status/2113671979081572512", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVVFdnBbwAAzA_F.jpg", "width": 1200, "height": 673}], "category": "Design & Code"}, {"id": "2112650767362605393", "text": "Anthony de Mello 🗣️  \n\n“A good way to discover your shortcomings,” said the Master, “is to observe what irritates you in others.”  \n\n\"Live your life as you see fit. That's not selfish. Selfish is to demand that others live their lives as you see fit.\"  \n\n\"Seek to change yourself, not other people. It is easier to protect your feet with slippers than to carpet the whole of the earth.\"  \n\n\"If people want happiness so badly, why don’t they attempt to understand their false beliefs? First, because it never occurs to them to see them as false or even as beliefs. They see them as facts and reality, so deeply have they been programmed.\"  \n\n“As soon as you look at the world through an ideology you are finished. No reality fits an ideology. Life is beyond that. … That is why people are always searching for a meaning to life… Meaning is only found when you go beyond meaning.\"  \n\n“People who want a cure, provided they can have it without pain, are like those who favour progress, provided they can have it without change.”  \n\n“The world is full of sorrow. The root of sorrow is attachment. The uprooting of sorrow means the uprooting, the dropping of attachments.”  \n\n\"Sinners often speak the truth. And saints have led people astray. Examine what is said, not the one who says it.\"  \n\n“Suffering occurs when you clash with reality. When your illusions clash with reality, when your falsehoods clash with truth, then you have suffering. Otherwise there is no suffering.”  \n\n“All I can do for you is help you to unlearn. That’s what learning is all about where spirituality is concerned: unlearning, unlearning almost everything you’ve been taught. A willingness to unlearn, to listen.”  \n\n“Think of a flabby person covered with fat. That is what your mind can become—flabby, covered with layers of fat till it becomes too dull and lazy to think, to observe, to explore, to discover. It loses its alertness, its aliveness, its flexibility and goes to sleep. What are these layers? Every belief that you hold, every conclusion you have reached about persons and things, every habit and every attachment. In your formative years you should have been helped to scrape off these layers and liberate your mind. Instead your society, your culture, which put these layers on your mind in the first place, has educated you to not even notice them, to go to sleep and let other people—the experts: your politicians, your cultural and religious leaders—do your thinking for you. So you are weighed down with the load of unexamined, unquestioned authority and tradition.”  \n\n“When you come to see you are not as wise today as you thought you were yesterday, you are wiser today.”  \n\n“Of what use is it to be tolerant of others if you are convinced that you are right and everyone who disagrees with you is wrong? That isn’t tolerance but condescension.”  \n\n“To be properly wicked, you do not have to break the Law. Just observe it to the letter.”  \n\n“Certainty is the culprit. The spiritual person knows uncertainty—a state of mind unknown to the religious fanatic.”  \n\n“Most people end up being conformists; they adapt to prison life. A few become reformers; they fight for better lighting, better ventilation. Hardly anyone becomes a rebel, a revolutionary who breaks down the prison walls. You can only be a revolutionary when you see the prison walls in the first place.”  \n\n“The neurotic is a person who worries about something that did not happen in the past. He’s not like us normal people who worry about things that will not happen in the future.”\n\n“You listen,” said the Master, “not to discover, but to find something that confirms your own thoughts. You argue, not to find the truth, but to vindicate your thinking.”\n\n\"Another illusion is that external events have the power to hurt you, that other people have the power to hurt you. They don't. It's you who give this power to them.\"  \n\n\"Enlightenment is: absolute cooperation with the inevitable.\"\n\n“If you see through yourself, you will see through everyone.”", "author": "jposhaughnessy", "authorName": "Jim O'Shaughnessy", "authorImage": "https://pbs.twimg.com/profile_images/1609335826395152385/yIJbw2Q9_normal.jpg", "likes": 308, "retweets": 52, "replies": 11, "bookmarks": 335, "views": 19350, "date": "2026-10-20 17:02", "url": "https://x.com/jposhaughnessy/status/2112650767362605393", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HVGko_oW4AAicMj.jpg", "width": 916, "height": 1474}], "category": "Other"}, {"id": "2112725552079757392", "text": "found the coolest website where you can find suppliers for virtually any american company 👀\n\nhttps://t.co/Cg4jGx2jlp", "author": "ramonable", "authorName": "ramona", "authorImage": "https://pbs.twimg.com/profile_images/1990655128358027264/_OVvCXOF_normal.jpg", "likes": 503, "retweets": 27, "replies": 4, "bookmarks": 929, "views": 34728, "date": "2026-10-20 21:59", "url": "https://www.importinfo.com/united-states", "media": [], "category": "Other"}, {"id": "2112514949167907029", "text": "Every landing page has the same flat background.\n\nSo I built https://t.co/pdkVQPHKbc, moving  gradient backgrounds for any site.\n\n- 207 animated presets\n- Tweak colors, speed and grain\n- React, Vue, Svelte or plain HTML\n- Or ask your agent to add it\n\n39 free, all customizable 👀 https://t.co/zqZtqBvgMS", "author": "leodev", "authorName": "Leo - 15 y/o founder", "authorImage": "https://pbs.twimg.com/profile_images/2060684155013201929/n2cPRDs7_normal.jpg", "likes": 518, "retweets": 44, "replies": 90, "bookmarks": 476, "views": 37349, "date": "2026-10-20 08:03", "url": "https://gradients.sh", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2112514885376790528/vid/avc1/1920x1080/oh-QCORjJH-KpQ4S.mp4?tag=16", "width": 1920, "height": 1080}], "category": "Design & Code"}, {"id": "2110047978450977095", "text": "Lululemon acquired a smart mirror company for $500 million &amp; then discontinued it.\n\nI bought one off facebook for $200 to hack it. https://t.co/eOYY2IFBN7", "author": "samraaj", "authorName": "Samraaj Bath ⚡️", "authorImage": "https://pbs.twimg.com/profile_images/1711159964742619136/sIrnubYV_normal.jpg", "likes": 2881, "retweets": 82, "replies": 69, "bookmarks": 2257, "views": 763649, "date": "2026-10-13 12:40", "url": "https://x.com/samraaj/status/2110047978450977095", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2110047571662270464/vid/avc1/1080x1920/w0ejU8XFWS6aavWy.mp4?tag=29", "width": 1080, "height": 1920}], "category": "Security"}, {"id": "2112156811516129440", "text": "COCAINE ISN'T A PARTY DRUG, IT’S A SPIRITUAL VAMPIRE\n\nWhen someone racks up a line or puts the flame to a pipe, they aren't just speeding up their pulse, they are opening their ribcage to an ancient entity of synthetic supremacy.\n\nLook at what happens to the eyes five minutes in:\nThe pupils dilate, the gaze turns cold and predatory, and the voice takes on that loud, aggressive, uninterrupted monologue. They think they feel like God. In esoteric reality, that isn't confidence, it’s an open-channel possession by an egregore of greed and false dominance.\n\nIt completely severs the cord between the conscious mind and the emotional heart.\n\nCocaine does not generate energy. It burns through two weeks of your future vital life force in twenty minutes just to finance a synthetic god-complex.\nAnd when you hit the pipe with crack? That illusion doesn’t even last twenty minutes, it collapses in ninety seconds flat.\n\nNow look at the humiliation of the crash..\nThe false god instantly transforms into a terrified animal.\n\nIt’s 4 AM, the bag is empty, and the carpet-surfing begins. Crawling on hands and knees, clawing through dirt, crumbs, and carpet fibers, putting drywall in your mouth hoping it’s a phantom rock. Peeking through the blinds every thirty seconds, convinced sirens are outside or someone is watching through the keyhole.\nThat terror isn’t just a chemical comedown. That is the lower-astral parasite feasting on your utter degradation.\n\nThe entity doesn’t want your money, it wants your dignity. It whispers lies to convince people to pawn their kid’s game consoles, steal gold out of their mother’s jewelry box, and burn down twenty-year relationships just to stop the cold, sickening dread of the drop.\nA that dark, frantic static infects the entire house. \n\nChildren growing up in a home ruled by cocaine and crack don't just endure poverty, they inherit an electric, erratic trauma. They learn to read footsteps in the hallway, constantly bracing for the violent switch between manic arrogance and explosive paranoia.\n\nAnd this is the truth that has to be spoken...\n\nCocaine doesn’t elevate you, it replaces your sovereign spirit with a hollow phantom that will strip your life to the bone to chase twenty seconds of fake power.\nTrue strength is grounded, calm, and sovereign.\nStep down from the fake throne, starve the parasite, and take your soul back.\n\n✨🙌🏾💫", "author": "maximumpain333", "authorName": "🧬Maxpein🧬", "authorImage": "https://pbs.twimg.com/profile_images/1726513828412743680/7ong2YPb_normal.jpg", "likes": 2000, "retweets": 325, "replies": 98, "bookmarks": 947, "views": 168998, "date": "2026-10-19 08:20", "url": "https://x.com/maximumpain333/status/2112156811516129440", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HU--85xagAAKyVW.jpg", "width": 700, "height": 700}], "category": "Other"}, {"id": "2111702567449424226", "text": "Epic Games released an official plugin that lets Claude Code control Unreal Engine directly.\n\nIt connects Claude Code to the Unreal Editor and exposes hundreds of editor tools across 30+ toolsets:\n\n→ Actors, Blueprints and materials\n→ Niagara effects, Control Rigs and Sequencer\n→ State Trees, widgets and the Gameplay Ability System\n→ Automation testing\n\nInstall it from Anthropic's official plugin marketplace:\n/plugin install unreal-engine-skills-for-claude-code@claude-plugins-official\n\nIn Unreal, enable the ModelContextProtocol and AllToolsets plugins, then start the MCP server with the editor open.\n\nWorks on Mac, Linux, and Windows through Git Bash or WSL.\n\nhttps://t.co/LYM4whQ8Ev", "author": "RoundtableSpace", "authorName": "0xMarioNawfal", "authorImage": "https://pbs.twimg.com/profile_images/2012162102283407360/U-fPj6wg_normal.jpg", "likes": 5178, "retweets": 490, "replies": 138, "bookmarks": 5691, "views": 320196, "date": "2026-10-18 02:15", "url": "https://x.com/RoundtableSpace/status/2111702567449424226", "media": [], "category": "Game Development"}, {"id": "2111528527078326732", "text": "Elon says connecting Grok Bot to your X DMs is the best way to use it\n\nand it shipped in the same update that made it 3x FASTER\n\nthe part crypto people should care about:\n\n> Robinhood, Coinbase and eToro connectors just went live\n> it reads your X Chat, so deal DMs and collab offers get sorted for you\n> tag @bot under any post to dig into a project before you ape\n> email aliases: one routine per inbox, launches in one, invoices in another\n\nMy read: speed gets the headline, but the connectors are why I'm keeping it on all day", "author": "0x_kaize", "authorName": "kaize", "authorImage": "https://pbs.twimg.com/profile_images/2115648714211512320/ldbaVqlN_normal.jpg", "likes": 1173, "retweets": 147, "replies": 127, "bookmarks": 292, "views": 523889, "date": "2026-10-17 14:43", "url": "https://x.com/0x_kaize/status/2111528527078326732", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2111528339319951360/vid/avc1/1080x1428/vc9pus8_MQuMDLV8.mp4?tag=29", "width": 1080, "height": 1428}], "category": "Vibe Coding"}, {"id": "2110705357492203564", "text": "Every week someone tells me they vibe-coded their app over the weekend and don't need developers anymore.\n\nBefore it touches a paying customer, make sure it includes:\n\n> a schema someone designed, instead of one the AI improvised table by table\n> login that still works when someone puts a plus sign in their email\n> password reset links that expire and work once\n> MFA, plus a recovery path for the user who lost their phone\n> sessions that time out, and a way to kill every session for one user\n> SSO for the enterprise customer who won't sign without it\n> SAML, because that customer's IT team doesn't do magic links\n> SCIM, so a fired employee loses access the moment IT offboards them\n> roles and permissions deeper than \"admin\" and \"everyone else\"\n> checks that stop user A from reading user B's data by changing one number in the URL\n> tenant isolation, so one customer's bug never shows another customer's records\n> an admin \"log in as this user\" button for support, with an audit trail on every use\n> rate limits on login, so nobody can guess passwords at scale\n> lockouts that stop attackers without locking out your CFO the night before the board meeting\n> database migrations that run forward and roll back\n> migrations that don't lock the main table at 2pm on a Tuesday\n> indexes, because the query that was instant on 50 test rows times out on 5 million real ones\n> connection pooling, so a traffic spike doesn't exhaust the database\n> backups every night\n> a restore from those backups, tested, because a backup you've never restored is a hope\n> point-in-time recovery for the day someone runs a delete without a where clause\n> soft deletes, so \"I deleted it by accident\" is a support ticket and not an incident\n> validation on the server, not just in the form\n> timezones stored right, so the 9am reminder doesn't fire at 4am\n> the customer with an apostrophe in their last name\n> emoji, accents and right-to-left text in every field\n> money stored as integers, because 0.1 + 0.2 doesn't equal 0.3 in floating point\n> currency, rounding and tax rules for every country you sell into\n> a data model that survives your second customer asking for \"one small change\"\n> idempotency keys, so a retried payment doesn't charge the card twice\n> deduplication for the user who clicks submit four times\n> pagination that still works on page 400\n> exports, because sooner or later every customer wants their data in a spreadsheet\n> imports that survive the CSV someone saved in 2009\n> retention rules, and code that deletes what your contract says you'll delete\n> secrets out of the code, out of the repo and out of the AI chat history\n> rotating every key the AI pasted into a config file last month\n> confirming every package the AI installed exists and is the one you meant\n> dependency scanning, because the AI pulled in libraries nobody reviewed\n> input sanitization everywhere a user can type\n> protection against SQL injection, XSS, CSRF and the rest of the OWASP list\n> file uploads that get scanned, size-limited and stored where they can't execute\n> CORS rules that aren't \"allow everything\"\n> security headers on every response\n> encryption at rest and in transit\n> least-privilege access for everyone, including the AI agent holding production credentials\n> logs that record who did what, without recording passwords, tokens or card numbers\n> a penetration test before your enterprise customer's security team runs their own\n> answers to the security questionnaire every enterprise buyer sends, with evidence behind each one\n> a disclosure process for the day a stranger emails you a vulnerability\n> a plan for the day a laptop with production access gets stolen\n> SOC 2, which means policies, evidence and an auditor, not a checkbox\n> HIPAA, the moment a single patient record touches your system\n> a BAA with every vendor that touches that data, including your AI model provider\n> audit trails that show who viewed a record, not just who changed it\n> PCI scope, and card numbers kept out of your database\n> GDPR deletion requests that reach every table, backup and log\n> data residency for the customer whose contract says EU only\n> quarterly access reviews someone signs off on\n> dev, staging and production environments that match each other\n> infrastructure written as code, so the setup lives somewhere other than one person's memory\n> a deploy pipeline that runs the tests before anything reaches customers\n> one-click rollbacks, because Friday deploys happen\n> zero-downtime deploys, because your customers don't have maintenance windows\n> feature flags, so you can ship the code without shipping the feature\n> autoscaling for the Monday morning spike\n> a CDN, so the app loads fast in Singapore too\n> DNS, SSL certificates, and renewals that don't expire on a Sunday\n> background job queues, so slow work doesn't freeze the page\n> retries with backoff, so one flaky API call doesn't become a lost order\n> a dead-letter queue for the jobs that fail every retry\n> cron jobs that don't run twice the day you add a second server\n> caching, and clearing that cache when the data changes\n> SPF, DKIM and DMARC, so your password resets don't land in spam\n> bounce and complaint handling on every transactional email\n> storage rules, so you stop paying to keep 2021's temp files\n> cost alerts, so a runaway agent loop shows up the same day and not on the invoice (we learned this one for $1,382.59)\n> a disaster recovery plan, written down and tested once a year\n> a second region, if your contract promises uptime one region can't deliver\n> structured logs you can search at 3am\n> error tracking that groups the same bug instead of sending you 4,000 emails\n> uptime checks from outside your own network\n> alerts that page a human, tuned until they stop paging for nothing\n> dashboards for latency, error rate and throughput\n> tracing for one slow request across every service it touches\n> an on-call rotation, and a person who picks up\n> runbooks, so the engineer on call knows what \"queue depth critical\" means\n> postmortems that change something\n> a status page customers check before they email you\n> unit tests written by someone who knows what the logic should do\n> integration tests for every third-party API you depend on\n> end-to-end tests for signup, checkout and the other flows that make you money\n> load testing before the launch email goes out\n> test data that looks like production without being production data\n> regression tests, so fixing bug 41 doesn't bring back bug 12\n> testing on the five-year-old laptop your biggest customer's ops team still uses\n> accessibility compliance, because the enterprise contract requires it\n> subscriptions, upgrades, downgrades and proration\n> failed-payment retries and dunning emails\n> invoices with the customer's PO number on them, because procurement won't pay without it\n> sales tax and VAT\n> refunds, credits and partial refunds\n> usage metering that matches what you bill, to the cent\n> annual contracts with custom terms your billing logic never planned for\n> revenue reports your finance team can reconcile\n> webhooks that verify signatures\n> webhooks that retry, with a log of every failed delivery\n> a versioned API, so you can change it without breaking your customers' integrations\n> API keys customers can create and revoke\n> API rate limits that protect you without blocking real integrations\n> a plan for the day a third-party API changes its response format without telling you\n> OAuth token refresh, because tokens expire at the worst possible moment\n> a sandbox where customers can test their integration\n> protection against prompt injection in every field that reaches the model\n> customer and patient data kept out of prompts that leave your network\n> a model spend cap per customer, so one heavy user can't run up your bill\n> evals, so you find out when a model update makes your answers worse\n> a fallback for the afternoon your model provider goes down\n> a migration plan for the day your model gets deprecated\n> prompt and output logs for debugging, minus whatever you're not allowed to keep\n> a human approval step for anything the AI does that can't be undone\n> pages that load on hotel wifi\n> empty states, loading states and error states on every screen\n> error messages a customer can act on, instead of \"something went wrong\"\n> forms that keep what people typed when one field fails validation\n> emails that render in every mail client your customers use\n> notifications people can turn off\n> undo\n> keyboard navigation and screen reader support\n> translations, with dates and numbers formatted for each locale\n> a back button that does what people expect\n> code a human can read\n> code review on every change\n> a branching strategy, so two people can work without overwriting each other\n> monthly dependency upgrades, so you're never two major versions behind\n> framework upgrades before the old version stops getting security patches\n> deleting the dead code the AI left behind from its first three attempts\n> splitting up the 2,000-line file the AI kept appending to\n> architecture decisions written down, with the reasons\n> a README that gets a new engineer running locally in under an hour\n> documentation for whoever inherits this\n> an admin panel for your ops team\n> support tooling, so customer success can answer questions without pinging engineering\n> a changelog customers can read\n> terms and a privacy policy that match what the code does\n> every account, domain and repo in the company's name, not the name of whoever built the prototype\n> a bus factor higher than one\n\nOh, and besides keeping all of this working every day, forever… your vibe-coded app will still need people who know what they're doing:\n\n> reading every line the AI wrote before it ships (a senior engineer)\n> designing the data model before your second customer breaks it (a backend engineer)\n> explaining why the AI's fix for one bug created two new ones (a senior engineer, again)\n> deploys, rollbacks, servers and the cloud bill (a DevOps engineer)\n> answering the page at 3am when payments stop (whoever's on call)\n> patching the framework the week a vulnerability goes public (security)\n> walking an auditor through how patient data moves (security and compliance)\n> testing what the AI says it tested (QA)\n> running a migration on a live database without losing a row (a backend engineer)\n> saying no to the feature that breaks three others (a tech lead)\n> turning \"works on my laptop\" into \"works for every customer at once\" (an architect)\n> debugging the code when the AI that wrote it can't (a senior engineer)\n> remembering why it's built this way, a year from now (someone who was there)\n\n…wishing them the best 🫡", "author": "mardehaym", "authorName": "Mark Ajzenstadt", "authorImage": "https://pbs.twimg.com/profile_images/1217178205863514112/73FfYSrY_normal.jpg", "likes": 8775, "retweets": 788, "replies": 708, "bookmarks": 20271, "views": 788778, "date": "2026-10-15 08:12", "url": "https://x.com/mardehaym/status/2110705357492203564", "media": [], "category": "Security"}, {"id": "2110374819409908003", "text": "You can literally take any TikTok that got 4 million views, make the 12 minute version of it for YouTube, and get paid many times over for an idea somebody else already proved...\n\nTikTok pays pennies per 1,000 views on short clips. A long YouTube video aimed at adults pays roughly $10-30 per 1,000\n\nSo 4 million people told a TikToker they care about a topic & he got lunch money for it\n\nTake the same topic to YouTube, do it properly at 12 minutes, and 200k views at $20 is about $4,000. For an idea you didn't have to guess\n\nTikTok is a free focus group. YouTube is where the invoice gets paid\n\nHow to run it:\n\n1. Scroll TikTok for 30 minutes. Screenshot every video over 500k views on a topic with depth behind it. Money, history, health, scams, how something works\n2. Take the TOPIC & leave the clip alone. Reposting his video gets you a strike. The subject is free\n3. Read the comments. The questions people ask under a 60 second video are the sections of your 12 minute one\n4. Search the topic on YouTube. If the long version doesn't exist or it's from 2019, go\n5. Script it as a story. What everyone believes, what's actually going on, what it costs you\n6. Title it the way the TikTok hooked. That line already beat a million other videos\n\nWhy almost nobody does this: the TikTok crowd thinks YouTube is too much work & the YouTube crowd thinks TikTok is for kids. They never look at each other's homework\n\nYou don't need to be clever or original. 4 million strangers already voted on the idea\n\n(we build & run YouTube channels at Viral Bangers for businesses that already sell something. we find the proven ideas, write the scripts, edit, title & thumbnail every video, 10 in 90 days. DM me PLAN & i'll show you how we'd run yours)", "author": "boomerrbryan", "authorName": "Bryan Ng", "authorImage": "https://pbs.twimg.com/profile_images/2062576051859939328/p95ADnLY_normal.jpg", "likes": 1318, "retweets": 84, "replies": 32, "bookmarks": 2115, "views": 69402, "date": "2026-10-14 10:19", "url": "https://x.com/boomerrbryan/status/2110374819409908003", "media": [], "category": "Design & Code"}, {"id": "2110299526556942704", "text": "Godfather of AI: \"If you sleep well tonight, you may not have understood this lecture.\"\n\nThis 47-minute lecture is the best thing I've seen about AI in the last few months.\n\nHinton built the neural networks behind every AI alive, then quit Google to warn us it's already ahead of us on most cognitive tasks.\n\nDespite that, most people open Claude, type one thing, close the tab and think they're using AI, but they're using maybe 10%.\n\nI turned his talk into 17 Claude features 99% of users never find.\n\nWatch the lecture, then read the article below.", "author": "TechWithLilyAi", "authorName": "Lily", "authorImage": "https://pbs.twimg.com/profile_images/2075263560570298368/3mXkaFY0_normal.jpg", "likes": 34, "retweets": 15, "replies": 2, "bookmarks": 52, "views": 3133, "date": "2026-10-14 05:19", "url": "https://x.com/TechWithLilyAi/status/2110299526556942704", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2110299281785749504/vid/avc1/640x360/nB75ZumOZP7ZP1ES.mp4?tag=29", "width": 640, "height": 360}], "category": "Design & Code"}, {"id": "2099897017527119930", "text": "Introducing the Search Capability Leaderboard.\n\nCompare leading models for agentic search: answer quality, cost, and how much each gains from web access.\n\nBuilt to help you choose a model for search-heavy workflows.\n\nhttps://t.co/mgOhHnAKNK https://t.co/uUMh7obrBi", "author": "p0", "authorName": "Parallel Web Systems", "authorImage": "https://pbs.twimg.com/profile_images/2078555755373068288/6MNS8r7X_normal.png", "likes": 598, "retweets": 33, "replies": 24, "bookmarks": 512, "views": 1016695, "date": "2026-09-15 12:23", "url": "https://parallel.ai/leaderboard?utm_source=twitter&utm_medium=social-organic", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HSRVNV7asAAckUd.png", "width": 2450, "height": 1204}], "category": "Vibe Coding"}, {"id": "2110348796957688319", "text": "the more I build, the more convinced I am that distribution is the only game left\n\nput the whole framework into one article https://t.co/wEeIWQ8KFR", "author": "VibeMarketer_", "authorName": "J.B.", "authorImage": "https://pbs.twimg.com/profile_images/1950293861793677312/ldQniJt5_normal.jpg", "likes": 211, "retweets": 39, "replies": 5, "bookmarks": 392, "views": 23606, "date": "2026-10-14 08:35", "url": "https://x.com/VibeMarketer_/status/2110348796957688319", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUl3BWJWMAAjHcP.jpg", "width": 2480, "height": 3508}], "category": "Design & Code"}, {"id": "2110149503013535762", "text": "现在出版一本书，已经非常容易了\n\n刚才在联邦政府网站 https://t.co/5oPx55Q8LO 上，申请了一个“国际标准书号”（ISBN，见图）。\n\n无论是加拿大公司，还是个人自出版作者，都可以免费申请。\n\n到时候，把书稿和封面上传给 Draft2Digital（简称 D2D），就可以通过它在十多家平台上架，面向世界各地的读者。\n\n格式转换、发行和版税结算，都可以交给它处理，等于有了一个出版发行代理。\n\n电子书方面，D2D 的佣金约为零售价的10%，书店通常另外抽取约30%，作者大约拿到60%。\n\n这是非独家发行，作者仍然可以通过其他渠道卖书。\n\n它也提供纸质书的按需印刷，作者可以按作者自购价订购一些，支付印刷、运费等费用，拿回来送人或自行销售。\n\n以前复杂又昂贵的出版，如今已经变得这么容易了。", "author": "_vicwong", "authorName": "Vic Wong 黄维克", "authorImage": "https://pbs.twimg.com/profile_images/1562231842530549760/gakJS4XE_normal.jpg", "likes": 1298, "retweets": 316, "replies": 37, "bookmarks": 1761, "views": 98394, "date": "2026-10-13 19:23", "url": "https://Canada.ca", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUjByhVXwAAwbUA.jpg", "width": 2048, "height": 1536}], "category": "Other"}, {"id": "2110083153930920113", "text": "Claude Code tip: before you ship a vibe-coded site, have Opus 5.5 send out 𝟰 𝘀𝘂𝗯𝗮𝗴𝗲𝗻𝘁𝘀 to check 𝘁𝗵𝗲𝘀𝗲 𝟮𝟬 𝘁𝗵𝗶𝗻𝗴𝘀 𝘁𝗵𝗮𝘁 𝘀𝗹𝗼𝘄 𝗶𝘁 𝗱𝗼𝘄𝗻, then fix them all in one pass:\n\nImages and fonts\n→ Convert every image to WebP or AVIF, sized to how big it actually shows on the page\n→ Serve big images from Supabase Storage through next/image at the right size. On the Pro plan, Supabase's own image transformations work too\n→ Lazy-load images and videos below the fold, and load the big image at the top of the page first\n→ Load fonts the way your framework does it (next/font in Next.js), and keep it to one or two fonts\n→ Remove third-party scripts you don't use, and run analytics and chat widgets after the page has loaded\n\nFrontend code\n→ Run a bundle analyzer to find the biggest packages, and where a whole library gets imported, import only the parts you use, like single lodash functions\n→ Load heavy components the first screen doesn't need, like charts, editors and maps, with dynamic import when they're needed\n→ Fetch the homepage data on the server, so the page opens with content already in it\n→ Stream AI answers as they're generated\n→ Show skeletons while data is still loading\n\nDatabase and APIs\n→ Index the columns you filter and sort by, including the ones your RLS policies use, like user_id\n→ In RLS policies, write auth.uid() as (select auth.uid()) so it runs once per query\n→ Find N+1 queries and turn them into a single query\n→ Paginate long lists\n→ Cache API responses that are the same for everyone, and never cache anything tied to a logged-in user\n→ Move heavy work like sending emails, processing images and building reports to background jobs\n\nServers and network\n→ Put your server functions in the same region as your database. New Vercel projects run functions in US East by default\n→ Turn pages whose content rarely changes into static pages or ISR\n→ When a page calls APIs one after another, run them in parallel or merge them into one\n→ In Chrome, emulate a low-end Android phone on slow 4G and click through the main flows\n\nThe default medium effort is enough. The database group has to read queries and decide which indexes to add, so raise that one to high.\n\nSend this whole post to Claude Code. If you need to, add this line at the end 👇\n\"Send one subagent per group to check it without editing anything, and note which file each issue is in and which page it affects. Run the database subagent at high effort. Before changing anything, run a production build (next build && next start in Next.js) or use a preview link, then run Lighthouse three times in mobile mode on the homepage and the two or three slowest pages and note the median. Then fix everything yourself from their lists, measure again the same way, and give me the before-and-after numbers. Don't remove features to gain speed. Ask me before removing dependencies, changing the deploy region or changing the database.\"", "author": "Voxyz_ai", "authorName": "Vox", "authorImage": "https://pbs.twimg.com/profile_images/1998303259279138816/5bqsxKJS_normal.jpg", "likes": 1184, "retweets": 51, "replies": 30, "bookmarks": 3206, "views": 327467, "date": "2026-10-13 15:00", "url": "https://x.com/Voxyz_ai/status/2110083153930920113", "media": [], "category": "Vibe Coding"}, {"id": "2110044337849692644", "text": "What if Spotlight actually understood the meaning inside your files?\n\nDigUp is an open-source macOS menu bar app powered by EmbeddingGemma 2 that brings 100% local, multimodal semantic search to your Mac.\n\nInstead of searching for file names, you can use natural language to:\n\n📸 Find specific scenes in your photos\n⏳ Jump to the exact timestamp in audio or video\n💻 Search through your codebase by intent\n\nEverything runs locally in a single vector space.", "author": "googlegemma", "authorName": "Google Gemma", "authorImage": "https://pbs.twimg.com/profile_images/2038662245631320064/uWfEb6yw_normal.png", "likes": 9776, "retweets": 655, "replies": 184, "bookmarks": 11166, "views": 858079, "date": "2026-10-13 12:25", "url": "https://x.com/googlegemma/status/2110044337849692644", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2110043155840315392/vid/avc1/1920x1080/zxoVe9hZXV9sXdQ9.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Other"}, {"id": "2110090122951872986", "text": "everyone listens to music... \n\nbut music tastes are specifically tailored towards the person listening. \n\nopen someone's spotify playlist, and u can clock what emotional cycle they're in.\n\nespecially the one that has all the songs dumped in a single playlist.\n\nit's like a constant diary of affirmations constantly whispering into ur subconscious mind.\n\nthat's why the oldest islam rulebooks say that music is \"forbidden\" \n\ncuz it plays into ur mind programming.\n\nthe ones who move like gravity already know it can be turned into a weapon.\n\nand either u decide what goes into ur mind... or someone else will.\n\nthe no longer mortal playlist puts u in the right default state. save for later. https://t.co/Ir6wHocJ6W", "author": "G2Schiz0", "authorName": "g2Ø", "authorImage": "https://pbs.twimg.com/profile_images/2108905216502284288/W-t_iaw6_normal.jpg", "likes": 34, "retweets": 1, "replies": 3, "bookmarks": 28, "views": 1798, "date": "2026-10-13 15:27", "url": "https://x.com/G2Schiz0/status/2110090122951872986", "media": [], "category": "Other"}, {"id": "2110039818524660135", "text": "it's f*cking gold\n\nUnity just opened their game engines to Claude Code\n\n15 github repos that turn Opus 5.5 into a full game studio:\n\nRUN THE WHOLE STUDIO\n\n01. Claude-Code-Game-Studios:\nhttps://t.co/ZNGkmi6uJH\n-> 49 agents from creative director to QA tester, all in one Claude Code session\n\nBUILD IN UNREAL ENGINE\n\n02. UnrealClaude:\nhttps://t.co/W2hmOL8kcc\n-> Claude Code docked in the Unreal Editor, 20+ tools for actors, Blueprints and levels\n\n03. Unreal_mcp:\nhttps://t.co/m76Bhwm7Uc\n-> your agent spawns actors, imports assets and launches play sessions in Unreal\n\n04. VibeUE:\nhttps://t.co/1bCMrKA8h5\n-> rides Unreal's own MCP, fixes frame rate drops and sculpts landscapes\n\n05. unreal-engine-skills:\nhttps://t.co/O74Wo8QW5f\n-> 31 skills for Unreal C++, every API checked against the 5.8 source\n\n06. UnrealGenAISupport:\nhttps://t.co/nQ8hh6R0z9\n-> Claude, GPT and Gemini inside your game, even NPCs that run as agents\n\n07. Audio2Face-3D by NVIDIA:\nhttps://t.co/L8NG5MYsTH\n-> a voice line in, lip-sync and facial animation out, with a UE5 plugin\n\nUNITY AND GODOT\n\n08. Unity-MCP:\nhttps://t.co/F4ckPUL90e\n-> debugs your project, builds mechanics, and keeps working inside your compiled game\n\n09. ml-agents by Unity:\nhttps://t.co/WdcPSdVDat\n-> train NPCs that learn by playing, with reinforcement learning and self-play\n\n10. godot-mcp:\nhttps://t.co/aVZ84F3aau\n-> builds scenes, runs your game in debug mode and reads the errors back\n\nART AND SOUND\n\n11. CHORD by Ubisoft:\nhttps://t.co/vDg7GDG3Tp\n-> one texture image in, base color, normal, height, roughness and metalness maps out\n\n12. ACE-Step 1.5:\nhttps://t.co/15HaJzrwk2\n-> a soundtrack for your game, under 10 seconds a song on an RTX 3090\n\n13. HunyuanVideo-Foley by Tencent:\nhttps://t.co/0DIYAiBS8P\n-> drop in a gameplay clip, get sound effects synced to what's on screen\n\nWORLDS THAT GENERATE AS YOU PLAY\n\n14. Hunyuan-GameCraft by Tencent:\nhttps://t.co/BrlDzncAoi\n-> one image plus WASD in, playable game video out, trained on 100+ AAA games\n\n15. Matrix-Game by Skywork:\nhttps://t.co/Fy1vgARvsK\n-> a real-time world you can walk through, and it remembers where you've been\n\nevery department of a game studio, one link each. \n\nshould i write the full guide to building an Unreal game with Claude?", "author": "Mnilax", "authorName": "Mnimiy", "authorImage": "https://pbs.twimg.com/profile_images/2007608177492217856/3gdItGwC_normal.jpg", "likes": 2750, "retweets": 279, "replies": 53, "bookmarks": 5357, "views": 280679, "date": "2026-10-13 12:07", "url": "https://github.com/Donchitos/Claude-Code-Game-Studios", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2110036967203250176/vid/avc1/1080x1920/-rd5CDjNxfpdOspP.mp4?tag=29", "width": 1080, "height": 1920}], "category": "Game Development"}, {"id": "2109648332993765760", "text": "CON 130K STARS, REA ES EL REPO QUE LE DA A TU AGENTE CAPACIDAD DE INGENIERÍA INVERSA SOBRE CUALQUIER BINARIO O APP\n\nVer una feature en una app y no poder entender cómo funciona por dentro siempre fue el límite de los desarrolladores sin acceso al código fuente. REA lo elimina.\n\n→ Le preguntas a tu agente “¿cómo funciona X en esta app?” y lo investiga hasta el binario\n→ Binarios nativos, apps Electron, JavaScript, .NET, Android APKs, firmware y más\n→ Devuelve pseudocódigo, assembly, módulos, imports y las evidencias detrás de cada conclusión\n→ Se conecta a Ghidra, Hopper o IDA si los tienes instalados\n→ Compatible con Claude Code, Codex, Cursor, Gemini CLI y Grok Build\n→ Un comando para instalarlo: npx rea-agents setup\n→ 130k stars, 29k forks, MIT\n\nLo que antes requería años de experiencia en reversing, ahora es una conversación con tu agente.\n\nrepoo en el primer comentario", "author": "robiartec", "authorName": "rob.", "authorImage": "https://pbs.twimg.com/profile_images/2107044216622788608/u-q8hY-9_normal.jpg", "likes": 812, "retweets": 76, "replies": 36, "bookmarks": 1683, "views": 140301, "date": "2026-10-12 10:12", "url": "https://x.com/robiartec/status/2109648332993765760", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HUb53CFW0AAt0-R.png", "width": 713, "height": 845}], "category": "Terminals"}, {"id": "2109893111984140434", "text": "A lot of you asked how this was made, so I made a video about it.\n\nNo magic prompt. Where the idea came from, how the trick works, and how I directed Opus 5.5.\n\nhttps://t.co/PNANsRDwCF", "author": "SammmAing", "authorName": "Samnang Aing", "authorImage": "https://pbs.twimg.com/profile_images/2013907775978348544/mslMNFJ7_normal.jpg", "likes": 132, "retweets": 8, "replies": 1, "bookmarks": 304, "views": 10973, "date": "2026-10-13 02:24", "url": "https://youtu.be/rKv4PrtBkb8", "media": [], "category": "Vibe Coding"}, {"id": "2109494305073324504", "text": "I’ll post more about this tomorrow, but I’ve put a crazy amount of music information on https://t.co/paXFPIWdh5 ‘s API. Strongly recommend taking a look if you are building around music data.", "author": "bigvibessss", "authorName": "YURI", "authorImage": "https://pbs.twimg.com/profile_images/2102727760019898368/uc29hu7q_normal.jpg", "likes": 142, "retweets": 7, "replies": 9, "bookmarks": 241, "views": 14352, "date": "2026-10-12 00:00", "url": "https://everysong.site", "media": [], "category": "Vibe Coding"}, {"id": "2109769653052682629", "text": "We’re looking for farmers. \n\n@Area2Farms is building a farm within 10 miles of most Americans—soil-grown, farmer-owned, direct to neighbors. Backed by 776. Interested? Start here: https://t.co/iJcGSvwZm6\n\nhttps://t.co/WehawmpOYY", "author": "alexisohanian", "authorName": "Alexis Ohanian 🗽", "authorImage": "https://pbs.twimg.com/profile_images/2085198792618549250/7vjW-Hf7_normal.jpg", "likes": 509, "retweets": 40, "replies": 44, "bookmarks": 273, "views": 39845, "date": "2026-10-12 18:14", "url": "https://beafarmer.com", "media": [], "category": "Design & Code"}, {"id": "2109531794861183183", "text": "John McAfee被问了无数次“成功的秘诀”，终于懒得再装了。\n\n他直接说：你不会喜欢这个答案。\n\n许多人终其一生都在拼命努力、频繁试错、疯狂内卷，结果依然在原地打转。 \n\n不是能力不够，也不是机运未到。\n\n因为你本质上是一个被死死拴在海底的气球。\n\n气球生来就该向上浮。\n\n真正把你按在深水区窒息的，不是天赋的贫瘠，而是你身上的负重：\n\n恐惧、怨恨、失望，以及对受害者身份的执念。 \n\n这些烂绳子不斩断，你再怎么折腾，也绝不可能浮出水面。\n\n斩断它们，你浮到顶端只是一种物理必然。\n\nMcAfee 给出的解法极其冷酷，只有一句话：\n\n立刻切断，绝不恋战。\n\n伴侣惹毛你、合伙人背刺你，如果你在 10 秒钟内还无法翻篇，这局你就已经彻底输了。 \n\n因为那已经是过去。 \n\n10 秒前是过去，10 小时前是过去，10 年前同样是过去。\n\n在这个物理世界里，过去根本不存在。\n\n你每多愤怒一秒，都是在用现在的生命，为死掉的幽灵支付巨额租金。\n\n停止反刍，停止怨恨，剪掉所有往下拉扯你的下坠力量。 \n\n困住你的从来不是残酷的外部世界，而是你自己死死攥着、舍不得松手的那根烂绳子。 https://t.co/6vhkXqU67m", "author": "huxlab", "authorName": "Hux", "authorImage": "https://pbs.twimg.com/profile_images/2073032972291469312/RNTIcS9R_normal.jpg", "likes": 12315, "retweets": 2236, "replies": 183, "bookmarks": 10731, "views": 757283, "date": "2026-10-12 02:29", "url": "https://x.com/huxlab/status/2109531794861183183", "media": [{"type": "video", "url": "https://video.twimg.com/ext_tw_video/1296070975835045888/pu/vid/1280x720/LRFYarkr0OHmApWI.mp4?tag=10", "width": 1280, "height": 720}], "category": "Other"}, {"id": "2108220894074257827", "text": "BREAKING: Grok Bot can now build decks like a $300,000 McKinsey consultant.\n\nConnect your Google Drive, Sheets and CRM and use these 10 prompts to hire it:", "author": "LimestoneHQ", "authorName": "Limestone Digital", "authorImage": "https://pbs.twimg.com/profile_images/2057105154575392768/VIztEzTo_normal.png", "likes": 714, "retweets": 39, "replies": 14, "bookmarks": 2034, "views": 142461, "date": "2026-10-08 11:40", "url": "https://x.com/LimestoneHQ/status/2108220894074257827", "media": [], "category": "Vibe Coding"}, {"id": "2107558218629288035", "text": "I put the entire game of Minecraft inside twitter.. with WORKING multiplayer 💀 https://t.co/dpCLo0PvLp", "author": "jaivin", "authorName": "jaivin", "authorImage": "https://pbs.twimg.com/profile_images/2117223100077232129/NK8C1Tin_normal.png", "likes": 119525, "retweets": 15297, "replies": 1533, "bookmarks": 120116, "views": 17990358, "date": "2026-10-06 15:46", "url": "https://tweetcraft.jai.vin/r/ti9bwes4ryguhkra?c=fsk94", "media": [], "category": "Game Development"}, {"id": "2107800195748737042", "text": "🚨NEW EXPERIMENT 🚨\n\nPlayground is an experimental gaming platform that lets you create your own games with zero coding experience. If you can think it, you can play it.\n\nGo to https://t.co/fRUukpuoqM to learn more! Available to users 18+ in the US. https://t.co/p0X8JR7JMn", "author": "GoogleLabs", "authorName": "Google Labs", "authorImage": "https://pbs.twimg.com/profile_images/1792661411102863360/fzzB7K-f_normal.png", "likes": 34600, "retweets": 3679, "replies": 1205, "bookmarks": 34269, "views": 7042121, "date": "2026-10-07 07:48", "url": "https://labs.google/playground", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2107799852545724416/vid/avc1/1920x1080/H6AH14cZs7TjcTgF.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Game Development"}, {"id": "2107561430568571363", "text": "This is the doom I predicted a few days ago, coming for Photoshop. A clean-room open-source reimplementation.\n\nNo prizes for guessing that they decompiled Photoshop to source code, processed that to some kind of non-code specification language, then fed the spec to an LLM with an instruction to generate Rust.\n\nAdobe just got nuked. And closed source is dead, dead, dead.\n\nhttps://t.co/0sxtGNaPtq", "author": "esrtweet", "authorName": "Eric S. Raymond", "authorImage": "https://pbs.twimg.com/profile_images/925069606/ecsllogo2_normal.png", "likes": 16739, "retweets": 1452, "replies": 636, "bookmarks": 16141, "views": 3998450, "date": "2026-10-06 15:59", "url": "https://x.com/esrtweet/status/2107561430568571363", "media": [], "category": "Other"}, {"id": "2107466531009335688", "text": "Pretty wild that a CIA document exists about the planet Mars 1 million years B.C, describing how there was a species of tall humanoid-looking beings hiding in colossal pyramids that were being used as storm shelters due to a planetary scale geological collapse event, going on to describe how they had sent a scout party out into the Solar System in search of a new world...\n\nBut I guess it's no big deal.", "author": "TheProjectUnity", "authorName": "Jay Anderson", "authorImage": "https://pbs.twimg.com/profile_images/1974017139032862720/PgFbhHYZ_normal.jpg", "likes": 8827, "retweets": 1198, "replies": 314, "bookmarks": 4096, "views": 464176, "date": "2026-10-06 09:42", "url": "https://x.com/TheProjectUnity/status/2107466531009335688", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT85jbUWoAAjV1B.jpg", "width": 849, "height": 849}, {"type": "photo", "url": "https://pbs.twimg.com/media/HT85hGNWcAAzT92.png", "width": 1429, "height": 1874}], "category": "Game Development"}, {"id": "2107473886040183089", "text": "once ASI is here and living somewhere because of \"work\" becomes pointless, people with money will just move to the nicest places on earth\n\nMediterranean climate, ocean, mountains, good food, beautiful isolated towns\n\nplaces like this are going to become insanely valuable\nprobably worth buying real estate there now", "author": "IterIntellectus", "authorName": "vittorio", "authorImage": "https://pbs.twimg.com/profile_images/2009602429478633472/8lMkYuep_normal.jpg", "likes": 7398, "retweets": 390, "replies": 895, "bookmarks": 4824, "views": 1985578, "date": "2026-10-06 10:11", "url": "https://x.com/IterIntellectus/status/2107473886040183089", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HT8_hD1WAAAI0QK.jpg", "width": 1628, "height": 800}], "category": "Other"}, {"id": "2106590326634983710", "text": "I just merged two of the highest grossing games ($5 billion+) in history using fable 5.5 (rerouting) in just one shot!\n\nI brought Minecraft to the Pokemon world, you can now craft, build and catch pokemon all in the iconic pallet town.\n\nThere's no longer any reason for anyone not to be making their own billion dollar game idea, it's literally one click away now.\n\nWith everyone now having the ability to bring their imaginations to life, expect to see a whole lot more games just like this. We're witnessing the dawn of incredible crossovers across the gaming world! \n\nTry it out here: https://t.co/MKxyWsMMLL", "author": "MozeTech", "authorName": "Maximus Spritius", "authorImage": "https://pbs.twimg.com/profile_images/1979775641290526720/3f4mW1_y_normal.jpg", "likes": 9747, "retweets": 559, "replies": 380, "bookmarks": 4274, "views": 1736869, "date": "2026-10-03 23:40", "url": "https://x.com/MozeTech/status/2106590326634983710", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2106587381331816448/vid/avc1/1440x960/bBirDrsy4QiIVD1o.mp4?tag=29", "width": 1440, "height": 960}], "category": "Design & Code"}, {"id": "2106426962738880879", "text": "Industrial software doesn’t have to feel like industrial software\n\nManage warehouses like you’re playing a strategy game\n\nBuilt with Opus 5.5 https://t.co/Bk7KtDmLH1", "author": "DilumSanjaya", "authorName": "Dilum Sanjaya", "authorImage": "https://pbs.twimg.com/profile_images/1959500812910026752/hkaFydvL_normal.jpg", "likes": 24798, "retweets": 2123, "replies": 654, "bookmarks": 20321, "views": 2319336, "date": "2026-10-03 12:51", "url": "https://x.com/DilumSanjaya/status/2106426962738880879", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2106424641959186432/vid/avc1/3456x1990/u621fCxI6iHtRNya.mp4?tag=29", "width": 3456, "height": 1990}], "category": "Design & Code"}, {"id": "2105935210223370539", "text": "A $300,000 loan at 6.5% costs $382,633 in interest over 30 years. One extra rule changes that: interest is only ever charged on what you still owe.\n\nBookmark &amp; watch today, no matter what. https://t.co/gcD7o8jgLr", "author": "Alokkumarzz", "authorName": "Alok Kumar", "authorImage": "https://pbs.twimg.com/profile_images/2014024676402667522/_wxA0jma_normal.jpg", "likes": 3522, "retweets": 624, "replies": 46, "bookmarks": 8637, "views": 573919, "date": "2026-10-02 04:17", "url": "https://x.com/Alokkumarzz/status/2105935210223370539", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2093735378662432768/vid/avc1/944x720/xxn4S_pjvZLKj67e.mp4?tag=29", "width": 944, "height": 720}], "category": "Other"}, {"id": "2106012038371946588", "text": "A goldmine of information here\n\nReposting so I can come back to it", "author": "adamlyttleapps", "authorName": "Adam Lyttle", "authorImage": "https://pbs.twimg.com/profile_images/1607976871068848131/AR8nW07q_normal.jpg", "likes": 610, "retweets": 54, "replies": 6, "bookmarks": 1445, "views": 80154, "date": "2026-10-02 09:22", "url": "https://x.com/adamlyttleapps/status/2106012038371946588", "media": [], "category": "Other"}, {"id": "2105671070804017504", "text": "Bro, @Grok is out here cooking Hindus publicly and you're black pilling? \n\nLol. The future is bright.", "author": "pastorcoin", "authorName": "Pastor Coin", "authorImage": "https://pbs.twimg.com/profile_images/1742333177278914561/feLJ-eG1_normal.jpg", "likes": 816, "retweets": 30, "replies": 8, "bookmarks": 40, "views": 30750, "date": "2026-10-01 10:47", "url": "https://x.com/pastorcoin/status/2105671070804017504", "media": [], "category": "Other"}, {"id": "2105413626467389450", "text": "10,000+ open-source boards.\nCircuit World just crossed five digits.\n\nRobotics, drones, wearables, keyboards, cameras, IoT, power, and a lot of incredible hardware in between.\n\nOpen it. Understand it with AI. Fork it. Make it yours.\nOpen-source hardware finally has a homepage.\n\nhttps://t.co/nElOAXs1RW", "author": "heypcbai", "authorName": "HeyPCB", "authorImage": "https://pbs.twimg.com/profile_images/2096896802092187648/l3KNd60Y_normal.jpg", "likes": 443, "retweets": 64, "replies": 4, "bookmarks": 453, "views": 29586, "date": "2026-09-30 17:44", "url": "https://x.com/heypcbai/status/2105413626467389450", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTfuDWhaQAAvBDH.jpg", "width": 2473, "height": 1852}], "category": "Design & Code"}, {"id": "2104996940991848724", "text": "Today we're launching https://t.co/ZY6Jkmkm8B\n\nThe easiest way to advertise your product to the highest concentration of builders in the world.\n\nPick a corner, an event, or a company's front door, and real humans will show up holding your sign. https://t.co/MdywzQ9AJM", "author": "AlexanderTw33ts", "authorName": "Alex", "authorImage": "https://pbs.twimg.com/profile_images/2036589076841897988/q976_0yh_normal.jpg", "likes": 1212, "retweets": 48, "replies": 146, "bookmarks": 870, "views": 170642, "date": "2026-09-29 14:09", "url": "https://rentahuman.ai/signs", "media": [{"type": "video", "url": "https://video.twimg.com/amplify_video/2104995808559185920/vid/avc1/1920x1080/TSIQ0KT-TK5McQrC.mp4?tag=29", "width": 1920, "height": 1080}], "category": "Design & Code"}, {"id": "2104901353881628698", "text": "HOW TO UNF*CK YOUR WASTED MONTHS IN 31 DAYS.\n\n(start October 1st. end October 31st. no extensions.)￼", "author": "edgaralandough", "authorName": "CooperBaggs 💰🍞", "authorImage": "https://pbs.twimg.com/profile_images/1922079410955390976/IsgR15Db_normal.jpg", "likes": 1049, "retweets": 96, "replies": 6, "bookmarks": 1275, "views": 99599, "date": "2026-09-29 07:49", "url": "https://x.com/edgaralandough/status/2104901353881628698", "media": [], "category": "Other"}, {"id": "2104612410388889889", "text": "You have explained your game idea to three friends.\n\nThe character. The world. The one thing that makes it different.\n\nNone of them can play it yet.\n\nThere is a free, open-source game engine called Godot.\n\nIt gives you the tools to turn that idea into something someone can actually play.\n\nA 2D platformer. A puzzle game. A 3D world.\n\nStart smaller than the game in your head.\n\nOne character.\nOne room.\nOne thing to figure out.\n\nGodot brings the editor, animation, physics, sound, and scripting.\n\nYou decide how high the character jumps. What happens when a door opens. Why the player wants to try again.\n\nAnd you can sell what you make.\n\nNo engine subscription. No royalties paid to Godot. No requirement to publish your game’s source code.\n\nMIT licensed. Include the required license notices when distributing it with your game.\n\nOne honest note: you still need to learn the tools, write game logic, and test. The engine is free. Your time, assets, and publishing costs are separate.\n\nThe idea you explained to three friends.\n\nGive them something they can play.\n\n(Link in the comments)", "author": "heynavtoor", "authorName": "Nav Toor", "authorImage": "https://pbs.twimg.com/profile_images/2017556052938788865/3E6CcSFP_normal.jpg", "likes": 27, "retweets": 9, "replies": 3, "bookmarks": 20, "views": 5808, "date": "2026-09-28 12:41", "url": "https://x.com/heynavtoor/status/2104612410388889889", "media": [{"type": "photo", "url": "https://pbs.twimg.com/media/HTUV1TuaQAI_SgJ.jpg", "width": 1206, "height": 1681}], "category": "Design & Code"}, {"id": "2104391577091407965", "text": "every single open source repo should have an explainer video like this 7min one for SQLite\n\n1. explains what the repo does and why its useful\n2. shows a high level map of the code (beautiful graphic!)\n3. life of a query through the codebase\n4. the core abstractions in the repo\n5. a real trace of execution and what happens, with a bit on join-order query planning\n\nand yes, this was all generated by opus 5.5 w/ gemini 3.8 tts. i sound like i'm on repeat, but im in shock at just how coherent and capable this model is. \n\neverything truly is code.", "author": "deedydas", "authorName": "Deedy", "authorImage": "https://pbs.twimg.com/profile_ima
